<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
<title id="title">两步决策任务</title><desc id="desc">stop 得到 1 后终止；forward 先得到负 1 到达 s1，再得到 4 后终止。gamma 为 0.9，所以两条路径回报分别为 1 与 2.6。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#327c77"/></marker></defs>
<rect width="960" height="390" rx="16" fill="#eff7f6"/>
<g font-family="sans-serif" text-anchor="middle" fill="#19354f">
<text x="480" y="43" font-size="23">先比较一整条未来：γ = 0.9</text>
<circle cx="110" cy="200" r="45" fill="#fff" stroke="#327c77" stroke-width="3"/><text x="110" y="208" font-size="24">s₀</text>
<path d="M 149 174 L 350 106" fill="none" stroke="#327c77" stroke-width="3" marker-end="url(#arrow)"/>
<text x="239" y="109" font-size="20">stop / +1</text>
<rect x="370" y="76" width="145" height="60" rx="10" fill="#fff" stroke="#327c77" stroke-width="2"/><text x="442" y="114" font-size="22">终止</text><text x="700" y="114" font-size="22">G₀ = 1</text>
<path d="M 151 223 L 386 272" fill="none" stroke="#327c77" stroke-width="3" marker-end="url(#arrow)"/><text x="265" y="273" font-size="20">forward / −1</text>
<circle cx="440" cy="280" r="42" fill="#fff" stroke="#327c77" stroke-width="3"/><text x="440" y="288" font-size="24">s₁</text>
<path d="M 484 280 L 640 280" fill="none" stroke="#327c77" stroke-width="3" marker-end="url(#arrow)"/><text x="565" y="260" font-size="20">+4</text>
<rect x="655" y="250" width="145" height="60" rx="10" fill="#fff" stroke="#327c77" stroke-width="2"/><text x="727" y="288" font-size="22">终止</text>
<text x="568" y="356" font-size="22">G₀ = −1 + 0.9 × 4 = 2.6</text>
</g></svg>
