<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">C++ 常用数据结构全景图</title>
  <desc id="desc">数据结构分为线性结构、树形结构、散列结构和图结构，并列出常用 STL 对应物。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef7f4"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".13"/></filter>
    <style>
      text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#243447}.h{font-size:28px;font-weight:700}.t{font-size:21px;font-weight:700}.s{font-size:16px}.line{stroke:#8da2b5;stroke-width:3;fill:none}.card{stroke-width:2;rx:16;filter:url(#shadow)}
    </style>
  </defs>
  <rect width="1000" height="560" rx="24" fill="url(#bg)"/>
  <rect x="380" y="34" width="240" height="68" rx="18" fill="#315b7d"/><text x="500" y="76" text-anchor="middle" fill="white" class="h">数据结构</text>
  <path class="line" d="M500 102v46M125 148h750M125 148v38M375 148v38M625 148v38M875 148v38"/>
  <g>
    <rect class="card" x="35" y="186" width="180" height="310" fill="#eaf4ff" stroke="#5195ce"/><text x="125" y="226" text-anchor="middle" class="t">线性结构</text>
    <text x="58" y="268" class="s">数组 / array</text><text x="58" y="303" class="s">动态数组 / vector</text><text x="58" y="338" class="s">链表 / list</text><text x="58" y="373" class="s">栈 / stack</text><text x="58" y="408" class="s">队列 / queue</text><text x="58" y="443" class="s">双端队列 / deque</text>
    <rect class="card" x="285" y="186" width="180" height="310" fill="#f2edff" stroke="#8064c5"/><text x="375" y="226" text-anchor="middle" class="t">树形结构</text>
    <text x="308" y="268" class="s">二叉搜索树</text><text x="308" y="303" class="s">平衡树</text><text x="308" y="338" class="s">set / map</text><text x="308" y="373" class="s">堆 / priority_queue</text><text x="308" y="408" class="s">Trie 前缀树</text><text x="308" y="443" class="s">并查集（森林）</text>
    <rect class="card" x="535" y="186" width="180" height="310" fill="#eaf9f1" stroke="#4a9b74"/><text x="625" y="226" text-anchor="middle" class="t">散列结构</text>
    <text x="558" y="268" class="s">哈希表</text><text x="558" y="303" class="s">unordered_set</text><text x="558" y="338" class="s">unordered_map</text><text x="558" y="390" class="s">平均 O(1) 查找</text><text x="558" y="425" class="s">需要处理冲突</text>
    <rect class="card" x="785" y="186" width="180" height="310" fill="#fff4e7" stroke="#d48a36"/><text x="875" y="226" text-anchor="middle" class="t">图结构</text>
    <text x="808" y="268" class="s">邻接表</text><text x="808" y="303" class="s">邻接矩阵</text><text x="808" y="355" class="s">BFS / DFS</text><text x="808" y="390" class="s">最短路</text><text x="808" y="425" class="s">拓扑排序</text>
  </g>
</svg>
