<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">栈和队列操作动画</title><desc id="desc">左侧展示栈后进先出，右侧展示队列先进先出。</desc>
  <style>
    text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#253746}.h{font-size:25px;font-weight:700}.t{font-size:19px}.box{stroke-width:2;rx:8}.stackIn{animation:stack 5s ease-in-out infinite}.queueIn{animation:queue 5s ease-in-out infinite}.pulse{animation:pulse 5s ease-in-out infinite}
    @keyframes stack{0%,15%{transform:translateY(-120px);opacity:0}35%,70%{transform:translateY(0);opacity:1}88%,100%{transform:translateY(-120px);opacity:0}}
    @keyframes queue{0%,15%{transform:translateX(160px);opacity:0}35%,70%{transform:translateX(0);opacity:1}88%,100%{transform:translateX(-480px);opacity:0}}
    @keyframes pulse{0%,30%,75%,100%{opacity:.25}42%,63%{opacity:1}}
  </style>
  <rect width="1000" height="470" rx="24" fill="#fbfdff"/><line x1="500" y1="35" x2="500" y2="435" stroke="#d6e0e7" stroke-width="2"/>
  <text x="250" y="50" text-anchor="middle" class="h">栈 stack：后进先出（LIFO）</text><text x="750" y="50" text-anchor="middle" class="h">队列 queue：先进先出（FIFO）</text>
  <path d="M135 105v300h230v-300" fill="none" stroke="#526b7b" stroke-width="5"/><rect class="box" x="140" y="330" width="220" height="70" fill="#dfeeff" stroke="#4385b8"/><text x="250" y="373" text-anchor="middle" class="t">A（栈底）</text><rect class="box" x="140" y="260" width="220" height="70" fill="#dfeeff" stroke="#4385b8"/><text x="250" y="303" text-anchor="middle" class="t">B</text><g class="stackIn"><rect class="box" x="140" y="190" width="220" height="70" fill="#ffe9bd" stroke="#d29022"/><text x="250" y="233" text-anchor="middle" class="t">C（栈顶）</text></g><text x="250" y="445" text-anchor="middle" class="t pulse">push C → pop C</text>
  <path d="M565 170h370v150H565" fill="none" stroke="#526b7b" stroke-width="5"/><rect class="box" x="600" y="200" width="105" height="90" fill="#dcf5e7" stroke="#4b966d"/><text x="652" y="253" text-anchor="middle" class="t">A</text><rect class="box" x="705" y="200" width="105" height="90" fill="#dcf5e7" stroke="#4b966d"/><text x="757" y="253" text-anchor="middle" class="t">B</text><g class="queueIn"><rect class="box" x="810" y="200" width="105" height="90" fill="#ffe9bd" stroke="#d29022"/><text x="862" y="253" text-anchor="middle" class="t">C</text></g><text x="590" y="145" class="t">front / 出队 ←</text><text x="805" y="145" class="t">← 入队 / back</text><text x="750" y="370" text-anchor="middle" class="t pulse">push C；最先 pop 的仍是 A</text>
</svg>
