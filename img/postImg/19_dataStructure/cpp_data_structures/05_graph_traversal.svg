<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">图的 BFS 遍历动画</title><desc id="desc">从顶点 A 开始，按层访问 B、C，再访问 D、E、F。</desc>
  <style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#253746}.h{font-size:25px;font-weight:700}.s{font-size:17px}.e{stroke:#8395a2;stroke-width:4}.n{fill:#eaf0f4;stroke:#617989;stroke-width:3}.v1{animation:v1 6s infinite}.v2{animation:v2 6s infinite}.v3{animation:v3 6s infinite}@keyframes v1{0%,12%,100%{fill:#eaf0f4}18%,88%{fill:#ffd27a}}@keyframes v2{0%,30%,100%{fill:#eaf0f4}36%,88%{fill:#9bd8ba}}@keyframes v3{0%,50%,100%{fill:#eaf0f4}56%,88%{fill:#9fcaf0}}</style>
  <rect width="1000" height="430" rx="24" fill="#fbfdff"/><text x="500" y="45" text-anchor="middle" class="h">图：BFS 按“层”扩散</text><g class="e"><line x1="180" y1="210" x2="360" y2="115"/><line x1="180" y1="210" x2="360" y2="305"/><line x1="360" y1="115" x2="585" y2="90"/><line x1="360" y1="115" x2="585" y2="210"/><line x1="360" y1="305" x2="585" y2="210"/><line x1="360" y1="305" x2="585" y2="330"/><line x1="585" y1="90" x2="585" y2="210"/></g><g class="n"><circle class="v1" cx="180" cy="210" r="42"/><circle class="v2" cx="360" cy="115" r="42"/><circle class="v2" cx="360" cy="305" r="42"/><circle class="v3" cx="585" cy="90" r="42"/><circle class="v3" cx="585" cy="210" r="42"/><circle class="v3" cx="585" cy="330" r="42"/></g><g text-anchor="middle" class="h"><text x="180" y="218">A</text><text x="360" y="123">B</text><text x="360" y="313">C</text><text x="585" y="98">D</text><text x="585" y="218">E</text><text x="585" y="338">F</text></g><text x="745" y="125" class="s">第 0 层：A</text><text x="745" y="175" class="s">第 1 层：B, C</text><text x="745" y="225" class="s">第 2 层：D, E, F</text><text x="745" y="295" class="s">队列保存“待访问顶点”</text><text x="745" y="335" class="s">复杂度：O(V + E)</text>
</svg>
