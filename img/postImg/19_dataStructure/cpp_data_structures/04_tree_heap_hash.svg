<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">二叉搜索树、堆和哈希表示意图</title><desc id="desc">比较有序二叉搜索树、满足局部有序的最小堆和通过散列函数定位桶的哈希表。</desc>
  <style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#253746}.h{font-size:22px;font-weight:700}.s{font-size:16px}.n{fill:#e9f3ff;stroke:#397fb8;stroke-width:2}.edge{stroke:#718695;stroke-width:2}.hot{animation:hot 4s ease-in-out infinite}@keyframes hot{0%,100%{fill:#e9f3ff}35%,65%{fill:#ffd98f}}</style>
  <rect width="1000" height="520" rx="24" fill="#fbfdff"/><line x1="333" y1="30" x2="333" y2="490" stroke="#d8e1e8"/><line x1="666" y1="30" x2="666" y2="490" stroke="#d8e1e8"/>
  <text x="166" y="48" text-anchor="middle" class="h">二叉搜索树：全局有序</text><g class="edge"><line x1="166" y1="105" x2="95" y2="190"/><line x1="166" y1="105" x2="237" y2="190"/><line x1="95" y1="190" x2="55" y2="275"/><line x1="95" y1="190" x2="135" y2="275"/></g><g class="n"><circle cx="166" cy="105" r="31"/><circle cx="95" cy="190" r="31"/><circle cx="237" cy="190" r="31"/><circle cx="55" cy="275" r="31"/><circle cx="135" cy="275" r="31"/></g><g text-anchor="middle" class="s"><text x="166" y="111">8</text><text x="95" y="196">3</text><text x="237" y="196">10</text><text x="55" y="281">1</text><text x="135" y="281">6</text></g><text x="166" y="350" text-anchor="middle" class="s">左子树 &lt; 根 &lt; 右子树</text><text x="166" y="385" text-anchor="middle" class="s">中序遍历：1, 3, 6, 8, 10</text><text x="166" y="420" text-anchor="middle" class="s">平衡时查找 O(log n)</text>
  <text x="500" y="48" text-anchor="middle" class="h">最小堆：只保证父 ≤ 子</text><g class="edge"><line x1="500" y1="105" x2="425" y2="190"/><line x1="500" y1="105" x2="575" y2="190"/><line x1="425" y1="190" x2="385" y2="275"/><line x1="425" y1="190" x2="465" y2="275"/></g><g class="n"><circle class="hot" cx="500" cy="105" r="31"/><circle cx="425" cy="190" r="31"/><circle cx="575" cy="190" r="31"/><circle cx="385" cy="275" r="31"/><circle cx="465" cy="275" r="31"/></g><g text-anchor="middle" class="s"><text x="500" y="111">1</text><text x="425" y="196">3</text><text x="575" y="196">2</text><text x="385" y="281">8</text><text x="465" y="281">6</text></g><text x="500" y="350" text-anchor="middle" class="s">堆顶始终是最小值</text><text x="500" y="385" text-anchor="middle" class="s">其余元素并非整体有序</text><text x="500" y="420" text-anchor="middle" class="s">push / pop：O(log n)</text>
  <text x="833" y="48" text-anchor="middle" class="h">哈希表：key → bucket</text><text x="705" y="105" class="s">hash("cat") % 5</text><path d="M820 100h70" stroke="#718695" stroke-width="2"/><path d="M887 94l12 6-12 6" fill="#718695"/><g class="s"><rect x="710" y="145" width="62" height="54" fill="#edf2f5" stroke="#7d909d"/><text x="741" y="178" text-anchor="middle">0</text><rect x="710" y="199" width="62" height="54" fill="#edf2f5" stroke="#7d909d"/><text x="741" y="232" text-anchor="middle">1</text><rect x="710" y="253" width="62" height="54" fill="#ffd98f" stroke="#d29022"/><text x="741" y="286" text-anchor="middle">2</text><rect x="710" y="307" width="62" height="54" fill="#edf2f5" stroke="#7d909d"/><text x="741" y="340" text-anchor="middle">3</text><rect x="710" y="361" width="62" height="54" fill="#edf2f5" stroke="#7d909d"/><text x="741" y="394" text-anchor="middle">4</text><rect x="810" y="253" width="145" height="54" rx="8" fill="#eaf9ef" stroke="#429466"/><text x="882" y="286" text-anchor="middle">cat → 7</text></g><path d="M772 280h38" stroke="#718695" stroke-width="2"/><text x="833" y="455" text-anchor="middle" class="s">平均查找 O(1)，最坏 O(n)</text>
</svg>
