<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">TF2：最新公共时间</title><desc id="desc">A 到 B 的样本到 10.20 秒，B 到 C 的样本到 10.15 秒。公共最新时间最多为 10.15 秒，不能直接查询 10.21 秒的当前时刻。</desc>
<defs><marker id="cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#38bdf8"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#34d399"/></marker></defs>
<rect width="1000" height="500" rx="22" fill="#0f172a"/>
<g font-family="system-ui, sans-serif" fill="#f1f5f9">
<text x="48" y="67" font-size="36" font-weight="700">最新可用 ≠ now</text>
<text x="48" y="114" font-size="25" fill="#94a3b8">示意时间，单位 s；假设公共区间内样本可插值</text>
<path d="M767 150 V388" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8 6"/>
<path d="M903 150 V388" stroke="#fb7185" stroke-width="2" stroke-dasharray="8 6"/>
<text x="48" y="219" font-size="28">A → B</text>
<rect x="200" y="190" width="680" height="38" rx="9" fill="#38bdf8"/>
<text x="200" y="174" font-size="23">9.90</text><text x="823" y="174" font-size="23">10.20</text>
<text x="48" y="313" font-size="28">B → C</text>
<rect x="427" y="282" width="340" height="38" rx="9" fill="#34d399"/>
<text x="427" y="358" font-size="23">10.00</text><text x="718" y="358" font-size="23" fill="#fbbf24">10.15</text>
<text x="855" y="414" font-size="23" fill="#fb7185">now 10.21</text>
<text x="48" y="457" font-size="29" fill="#fbbf24">A → C 的最新公共时间：10.15 s</text>
</g></svg>