<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
<title id="title">TF2：父子关系与点坐标换算</title><desc id="desc">坐标树从父级 base_link 指向子级 laser_frame。T_base_laser 把 laser_frame 中的点换算到 base_link。</desc>
<defs><marker id="cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#38bdf8"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#34d399"/></marker></defs>
<rect width="1000" height="640" rx="22" fill="#0f172a"/>
<g font-family="system-ui, sans-serif" fill="#f1f5f9">
<text x="48" y="63" font-size="23" fill="#94a3b8" letter-spacing="3">ROS 2 / TF2</text>
<text x="48" y="125" font-size="40" font-weight="700">坐标树的箭头 ≠ 点换算的方向</text>
<rect x="48" y="203" width="290" height="180" rx="18" fill="#1e293b" stroke="#475569"/>
<rect x="662" y="203" width="290" height="180" rx="18" fill="#1e293b" stroke="#475569"/>
<text x="74" y="249" font-size="26" fill="#94a3b8">父坐标系 A</text>
<text x="74" y="306" font-size="35" font-weight="700">base_link</text>
<text x="688" y="249" font-size="26" fill="#94a3b8">子坐标系 B</text>
<text x="688" y="306" font-size="35" font-weight="700">laser_frame</text>
<path d="M354 260 H644" fill="none" stroke="#38bdf8" stroke-width="4" marker-end="url(#cyan)"/>
<text x="405" y="237" font-size="25" fill="#38bdf8">树：父 → 子</text>
<path d="M644 347 H354" fill="none" stroke="#34d399" stroke-width="4" marker-end="url(#green)"/>
<text x="387" y="323" font-size="25" fill="#34d399">点：B 换算到 A</text>
<text x="48" y="444" font-size="30">p_A = R_A_B × p_B + t_A_B</text>
<text x="48" y="502" font-size="28" fill="#cbd5e1">安装平移 [0.3, 0, 0.2] m · yaw +90°</text>
<text x="48" y="564" font-size="29" fill="#34d399">[1, 0, 0]（雷达）→ [0.3, 1, 0.2]（底盘）</text>
</g></svg>