<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">空间Twist和物体Twist的转换</title><desc id="desc">同一刚体运动在空间坐标与物体坐标下表示并通过伴随矩阵转换</desc>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="currentColor"/></marker><style>.h{font:bold 25px sans-serif;fill:#263238}.t{font:21px sans-serif;fill:#37474f}.box{stroke-width:3}</style></defs>
  <rect x="12" y="12" width="876" height="366" rx="18" fill="#f7fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect class="box" x="65" y="85" width="290" height="180" rx="18" fill="#e3f2fd" stroke="#1976d2"/><text class="h" x="130" y="130">空间表示 Vₛ</text><text class="t" x="105" y="178">[Vₛ] = Ṫ T⁻¹</text><text class="t" x="105" y="220">固定在世界坐标系观察</text>
  <rect class="box" x="545" y="85" width="290" height="180" rx="18" fill="#e8f5e9" stroke="#388e3c"/><text class="h" x="610" y="130">物体表示 Vᵦ</text><text class="t" x="586" y="178">[Vᵦ] = T⁻¹ Ṫ</text><text class="t" x="584" y="220">坐标轴随刚体一起运动</text>
  <path d="M365 130 L532 130" stroke="#7b1fa2" stroke-width="4" marker-end="url(#arr)" color="#7b1fa2"/><text class="t" x="382" y="105">Ad T⁻¹</text>
  <path d="M535 225 L368 225" stroke="#ef6c00" stroke-width="4" marker-end="url(#arr)" color="#ef6c00"/><text class="t" x="405" y="260">Ad T</text>
  <text class="t" x="210" y="330">Vₛ = Ad_T Vᵦ　　Vᵦ = Ad_(T⁻¹) Vₛ</text>
</svg>
