<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">空间坐标系和物体坐标系之间的齐次变换</title>
  <desc id="desc">固定坐标系s、移动坐标系b以及从s原点指向b原点的平移向量p</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="currentColor"/></marker>
    <style>.axis{fill:none;stroke-width:4;marker-end:url(#arrow)}.txt{font:22px sans-serif;fill:#263238}.note{font:20px sans-serif;fill:#455a64}.panel{fill:#f7fafc;stroke:#cbd5e1;stroke-width:2}</style>
  </defs>
  <rect class="panel" x="12" y="12" width="876" height="406" rx="18"/>
  <g transform="translate(170 325)">
    <path class="axis" d="M0 0 L145 0" stroke="#e53935" color="#e53935"/><path class="axis" d="M0 0 L0 -130" stroke="#43a047" color="#43a047"/><path class="axis" d="M0 0 L-65 58" stroke="#1e88e5" color="#1e88e5"/>
    <text class="txt" x="150" y="7">xₛ</text><text class="txt" x="8" y="-140">yₛ</text><text class="txt" x="-95" y="83">zₛ</text><text class="txt" x="-25" y="30">{s}</text>
  </g>
  <g transform="translate(610 205) rotate(-18)">
    <path class="axis" d="M0 0 L135 0" stroke="#e53935" color="#e53935"/><path class="axis" d="M0 0 L0 -120" stroke="#43a047" color="#43a047"/><path class="axis" d="M0 0 L-58 52" stroke="#1e88e5" color="#1e88e5"/>
    <text class="txt" x="140" y="7">xᵦ</text><text class="txt" x="7" y="-128">yᵦ</text><text class="txt" x="-87" y="74">zᵦ</text><text class="txt" x="-20" y="32">{b}</text>
  </g>
  <path d="M185 312 Q370 215 592 207" fill="none" stroke="#7b1fa2" stroke-width="5" marker-end="url(#arrow)" color="#7b1fa2"/>
  <text class="txt" x="372" y="224" fill="#7b1fa2">pₛᵦ</text>
  <text class="note" x="330" y="375">Tₛᵦ = [ Rₛᵦ  pₛᵦ ; 0  1 ]</text>
</svg>
