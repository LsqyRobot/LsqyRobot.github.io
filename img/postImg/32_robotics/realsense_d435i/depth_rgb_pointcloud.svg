<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">彩色图、深度图与点云关系动态图</title>
  <desc id="desc">彩色图每个像素保存颜色，深度图每个像素保存距离；结合相机内参后，可以将深度像素反投影为三维点云。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef7ff"/></linearGradient>
    <linearGradient id="depth" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#172554"/><stop offset=".38" stop-color="#2563eb"/><stop offset=".7" stop-color="#22d3ee"/><stop offset="1" stop-color="#fde047"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#16345b" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#0ea5e9"/></marker>
    <style>
      text{font-family:Inter,Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#17324d}.title{font-size:28px;font-weight:700}.subtitle{font-size:16px;fill:#58708a}.label{font-size:18px;font-weight:700}.small{font-size:14px;fill:#58708a}.panel{fill:#fff;stroke:#dbe7f4;stroke-width:1.5}
      .flow{stroke-dasharray:7 8;animation:flow 1.2s linear infinite}.depth-scan{animation:depthScan 3s ease-in-out infinite}.point{transform-box:fill-box;transform-origin:center;animation:pop 2.8s ease-in-out infinite}.point:nth-child(3n){animation-delay:.3s}.point:nth-child(3n+1){animation-delay:.6s}
      @keyframes flow{to{stroke-dashoffset:-30}}@keyframes depthScan{0%,100%{transform:translateX(0)}50%{transform:translateX(150px)}}@keyframes pop{0%,18%{opacity:.2;transform:scale(.45)}42%,82%{opacity:1;transform:scale(1)}100%{opacity:.2;transform:scale(.45)}}
      @media(prefers-reduced-motion:reduce){.flow,.depth-scan,.point{animation:none!important}.point{opacity:1}}
    </style>
  </defs>
  <rect width="960" height="540" rx="24" fill="url(#bg)"/>
  <text x="38" y="45" class="title">同一场景，三种表达：颜色 → 距离 → 三维空间</text>
  <text x="38" y="70" class="subtitle">点云通常不是相机“直接拍到”的，而是由深度图与内参计算得到</text>

  <g filter="url(#shadow)">
    <rect x="30" y="104" width="264" height="330" rx="22" class="panel"/>
    <rect x="348" y="104" width="264" height="330" rx="22" class="panel"/>
    <rect x="666" y="104" width="264" height="330" rx="22" class="panel"/>
  </g>
  <text x="58" y="143" class="label">RGB 彩色图</text><text x="376" y="143" class="label">Depth 深度图</text><text x="694" y="143" class="label">Point Cloud 点云</text>

  <g>
    <rect x="58" y="164" width="208" height="176" rx="14" fill="#bfe6ff"/>
    <rect x="58" y="286" width="208" height="54" fill="#8fb66b"/>
    <circle cx="118" cy="211" r="29" fill="#fde68a"/>
    <rect x="164" y="215" width="63" height="71" rx="8" fill="#ef4444"/>
    <path d="M77 286 L124 237 L162 286 Z" fill="#64748b"/><path d="M202 286 L236 246 L266 286 Z" fill="#475569"/>
    <rect x="164" y="231" width="63" height="4" fill="#fff" opacity=".7"/>
    <text x="58" y="369" class="small">pixel(u,v) → [R, G, B]</text>
    <text x="58" y="396" class="small">回答：“它是什么颜色？”</text>
  </g>

  <g>
    <rect x="376" y="164" width="208" height="176" rx="14" fill="url(#depth)"/>
    <circle cx="438" cy="214" r="29" fill="#fde047" opacity=".9"/>
    <rect x="482" y="215" width="63" height="71" rx="8" fill="#22d3ee" opacity=".9"/>
    <path d="M395 286 L442 237 L480 286 Z" fill="#1d4ed8" opacity=".9"/><path d="M520 286 L554 246 L584 286 Z" fill="#172554" opacity=".9"/>
    <rect x="382" y="170" width="2" height="164" fill="#fff" opacity=".85" class="depth-scan"/>
    <text x="376" y="369" class="small">pixel(u,v) → Z，例如 1.25 m</text>
    <text x="376" y="396" class="small">回答：“它离相机多远？”</text>
  </g>

  <g transform="translate(690 170)">
    <line x1="12" y1="154" x2="203" y2="154" stroke="#94a3b8"/><line x1="12" y1="154" x2="88" y2="21" stroke="#94a3b8"/><line x1="12" y1="154" x2="12" y2="8" stroke="#94a3b8"/>
    <circle class="point" cx="35" cy="128" r="5" fill="#1d4ed8"/><circle class="point" cx="55" cy="109" r="5" fill="#2563eb"/><circle class="point" cx="77" cy="91" r="5" fill="#0ea5e9"/><circle class="point" cx="99" cy="72" r="5" fill="#22d3ee"/>
    <circle class="point" cx="125" cy="88" r="5" fill="#22d3ee"/><circle class="point" cx="148" cy="105" r="5" fill="#38bdf8"/><circle class="point" cx="174" cy="119" r="5" fill="#60a5fa"/>
    <circle class="point" cx="93" cy="131" r="5" fill="#f59e0b"/><circle class="point" cx="111" cy="118" r="5" fill="#f97316"/><circle class="point" cx="130" cy="127" r="5" fill="#ef4444"/>
    <circle class="point" cx="65" cy="145" r="5" fill="#65a30d"/><circle class="point" cx="111" cy="147" r="5" fill="#84cc16"/><circle class="point" cx="157" cy="145" r="5" fill="#65a30d"/>
    <circle class="point" cx="87" cy="57" r="5" fill="#fde047"/><circle class="point" cx="81" cy="44" r="5" fill="#fde68a"/>
  </g>
  <text x="694" y="369" class="small">pixel + Z + intrinsics → (X,Y,Z)</text>
  <text x="694" y="396" class="small">回答：“它在三维空间哪里？”</text>

  <line x1="300" y1="264" x2="339" y2="264" stroke="#0ea5e9" stroke-width="3" marker-end="url(#arrow)" class="flow"/>
  <line x1="618" y1="264" x2="657" y2="264" stroke="#0ea5e9" stroke-width="3" marker-end="url(#arrow)" class="flow"/>
  <rect x="110" y="463" width="740" height="48" rx="16" fill="#fff" stroke="#dbe7f4"/>
  <text x="135" y="493" font-size="16"><tspan font-weight="700">关键区别：</tspan> RGB 存颜色；Depth 存距离；Point Cloud 存一组空间坐标。</text>
</svg>
