<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">焦距与视场角关系动态图</title>
  <desc id="desc">在传感器尺寸不变时，短焦距对应更宽的视场角，长焦距对应更窄的视场角。动画在两种状态间切换。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="wideCone" x1="1" y1=".5" x2="0" y2=".5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".34"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="narrowCone" x1="1" y1=".5" x2="0" y2=".5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity=".34"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity=".06"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#16345b" flood-opacity=".10"/>
    </filter>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#0284c7"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#d97706"/>
    </marker>
    <style>
      text{font-family:Inter,Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#17324d}
      .title{font-size:28px;font-weight:700}.subtitle{font-size:16px;fill:#58708a}
      .label{font-size:17px;font-weight:650}.small{font-size:14px;fill:#58708a}.formula{font-size:21px;font-weight:700}
      .panel{fill:#fff;stroke:#dbe7f4;stroke-width:1.5}.sensor{stroke:#1e293b;stroke-width:7;stroke-linecap:round}
      .axis{stroke:#9fb2c5;stroke-width:1.5;stroke-dasharray:5 6}.ray-blue{stroke:#0ea5e9;stroke-width:2.5}.ray-orange{stroke:#f59e0b;stroke-width:2.5}
      .short-state{opacity:1;animation:showShort 8s ease-in-out infinite}.long-state{opacity:0;animation:showLong 8s ease-in-out infinite}
      .short-pill{animation:pillShort 8s ease-in-out infinite}.long-pill{animation:pillLong 8s ease-in-out infinite}
      .scan{animation:scan 3s linear infinite}
      @keyframes showShort{0%,42%,100%{opacity:1}50%,92%{opacity:0}}
      @keyframes showLong{0%,42%,100%{opacity:0}50%,92%{opacity:1}}
      @keyframes pillShort{0%,42%,100%{fill:#7dd3fc;stroke:#0ea5e9}50%,92%{fill:#f1f5f9;stroke:#cbd5e1}}
      @keyframes pillLong{0%,42%,100%{fill:#f1f5f9;stroke:#cbd5e1}50%,92%{fill:#fcd34d;stroke:#f59e0b}}
      @keyframes scan{from{stroke-dashoffset:0}to{stroke-dashoffset:-26}}
      @media (prefers-reduced-motion:reduce){.short-state,.long-state,.short-pill,.long-pill,.scan{animation:none!important}.long-state{opacity:0}.short-state{opacity:1}}
    </style>
  </defs>

  <rect width="960" height="540" rx="24" fill="url(#bg)"/>
  <text x="38" y="47" class="title">焦距 f：镜头中心到成像平面的尺度</text>
  <text x="38" y="72" class="subtitle">保持图像尺寸不变：f 越小，视野越宽；f 越大，视野越窄</text>

  <rect x="30" y="96" width="620" height="400" rx="22" class="panel" filter="url(#shadow)"/>
  <line x1="64" y1="294" x2="610" y2="294" class="axis"/>
  <text x="68" y="319" class="small">现实世界</text>
  <text x="562" y="319" class="small">光轴</text>

  <g class="short-state">
    <polygon points="456,294 66,116 66,472" fill="url(#wideCone)"/>
    <line x1="456" y1="294" x2="66" y2="116" class="ray-blue"/>
    <line x1="456" y1="294" x2="66" y2="472" class="ray-blue"/>
    <path d="M487 244 A56 56 0 0 0 487 344" fill="none" stroke="#0284c7" stroke-width="3"/>
    <text x="337" y="135" class="label" fill="#0284c7">短焦距 → 大 FOV</text>
    <line x1="456" y1="395" x2="586" y2="395" stroke="#0284c7" stroke-width="2" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
    <text x="492" y="421" class="label" fill="#0284c7">f 较小</text>
    <circle cx="456" cy="294" r="13" fill="#fff" stroke="#0284c7" stroke-width="4"/>
  </g>

  <g class="long-state">
    <polygon points="350,294 66,190 66,398" fill="url(#narrowCone)"/>
    <line x1="350" y1="294" x2="66" y2="190" class="ray-orange"/>
    <line x1="350" y1="294" x2="66" y2="398" class="ray-orange"/>
    <path d="M382 258 A50 50 0 0 0 382 330" fill="none" stroke="#d97706" stroke-width="3"/>
    <text x="226" y="194" class="label" fill="#d97706">长焦距 → 小 FOV</text>
    <line x1="350" y1="395" x2="586" y2="395" stroke="#d97706" stroke-width="2" marker-start="url(#arrowOrange)" marker-end="url(#arrowOrange)"/>
    <text x="435" y="421" class="label" fill="#d97706">f 较大</text>
    <circle cx="350" cy="294" r="13" fill="#fff" stroke="#d97706" stroke-width="4"/>
  </g>

  <line x1="586" y1="142" x2="586" y2="446" class="sensor"/>
  <line x1="596" y1="142" x2="596" y2="446" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 7" class="scan"/>
  <text x="529" y="476" class="small">固定尺寸的传感器</text>
  <text x="407" y="278" class="small">光心</text>

  <rect x="678" y="96" width="252" height="400" rx="22" class="panel" filter="url(#shadow)"/>
  <text x="704" y="132" class="label">看动画时抓住两点</text>
  <rect x="704" y="154" width="200" height="54" rx="13" class="short-pill" fill="#0ea5e9"/>
  <text x="723" y="178" font-size="15" font-weight="700">短焦距</text>
  <text x="723" y="198" font-size="13">同一张图容纳更多场景</text>
  <rect x="704" y="219" width="200" height="54" rx="13" class="long-pill" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="723" y="243" font-size="15" font-weight="700" fill="#17324d">长焦距</text>
  <text x="723" y="263" font-size="13" fill="#17324d">画面更“放大”，范围更窄</text>
  <line x1="704" y1="298" x2="904" y2="298" stroke="#e2e8f0"/>
  <text x="704" y="333" class="formula">FOV = 2·atan(w / 2f)</text>
  <text x="704" y="361" class="small">w：图像宽度（pixel）</text>
  <text x="704" y="384" class="small">f：焦距（pixel）</text>
  <rect x="704" y="411" width="200" height="58" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="718" y="434" class="small" fill="#1d4ed8">RealSense 内参里的 fx / fy</text>
  <text x="718" y="456" class="small" fill="#1d4ed8">就是横向 / 纵向的像素焦距</text>
</svg>
