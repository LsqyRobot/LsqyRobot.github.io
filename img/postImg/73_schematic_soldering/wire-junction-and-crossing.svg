<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 585" role="img" aria-labelledby="title desc">
<title id="title">原理图连接点与跨线桥的区别</title><desc id="desc">原创教学示意图，具体封装和端子以实际器件资料为准。</desc>
<style>text {font-family: "PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;}</style>
<rect width="600" height="585" rx="18" fill="#f4f7fa"/>
<text x="28" y="42" font-size="28" fill="#20344c" text-anchor="start">导线相交，究竟连没连？</text><text x="28" y="100" font-size="23" fill="#20344c" text-anchor="start">交叉处有实心连接点：相连</text><path d="M65,185 L260,185" stroke="#236d70" stroke-width="4" fill="none"/><path d="M160,125 L160,245" stroke="#236d70" stroke-width="4" fill="none"/><circle cx="160" cy="185" r="6" fill="#236d70"/><text x="300" y="180" font-size="22" fill="#20344c" text-anchor="start">同一个节点</text><text x="28" y="280" font-size="23" fill="#20344c" text-anchor="start">明确跨线桥：互不连接</text><path d="M65,365 L260,365" stroke="#236d70" stroke-width="4" fill="none"/><path d="M160,305 V350 C130,350 130,380 160,380 V425" stroke="#236d70" fill="none" stroke-width="4"/><text x="300" y="360" font-size="22" fill="#20344c" text-anchor="start">两个网络</text><text x="28" y="490" font-size="22" fill="#20344c" text-anchor="start">现代图常用“交叉无点”表示不连。</text><text x="28" y="524" font-size="22" fill="#20344c" text-anchor="start">图不清楚时查网络高亮，不靠猜。</text><text x="28" y="558" font-size="21" fill="#536980" text-anchor="start">同名标签还要确认作用域 / 图纸层级。</text></svg>
