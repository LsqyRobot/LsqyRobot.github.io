<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 490" role="img" aria-labelledby="title desc">
<title id="title">5V电阻LED串联回路和并联电容原理图</title><desc id="desc">原创教学示意图，具体封装和端子以实际器件资料为准。</desc>
<style>text {font-family: "PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;}</style>
<rect width="600" height="490" rx="18" fill="#f4f7fa"/>
<text x="28" y="42" font-size="28" fill="#20344c" text-anchor="start">练习：5 V 电源指示灯</text><text x="28" y="75" font-size="20" fill="#536980" text-anchor="start">R1 串联限流；C1 并联在电源两端</text><rect x="35" y="135" width="65" height="220" rx="8" fill="#e5edf5" stroke="#7e96ad" stroke-width="3"/><text x="43" y="123" font-size="24" fill="#20344c" text-anchor="start">J1</text><text x="49" y="185" font-size="20" fill="#20344c" text-anchor="start">1</text><text x="49" y="335" font-size="20" fill="#20344c" text-anchor="start">2</text><path d="M80,180 L250,180" stroke="#236d70" stroke-width="4" fill="none"/><path d="M80,330 L520,330" stroke="#236d70" stroke-width="4" fill="none"/><text x="110" y="145" font-size="22" fill="#bb6424" text-anchor="start">+5V</text><rect x="250" y="165" width="70" height="30" rx="0" fill="#fff" stroke="#20344c" stroke-width="3"/><text x="265" y="128" font-size="23" fill="#20344c" text-anchor="start">R1</text><text x="258" y="152" font-size="20" fill="#20344c" text-anchor="start">1 kΩ</text><text x="233" y="210" font-size="18" fill="#20344c" text-anchor="start">1</text><text x="322" y="210" font-size="18" fill="#20344c" text-anchor="start">2</text><path d="M320,180 L380,180" stroke="#236d70" stroke-width="4" fill="none"/><text x="355" y="145" font-size="21" fill="#20344c" text-anchor="start">LED_A</text><path d="M380,160 L380,200 L414,180 Z M414,157 V203" fill="none" stroke="#20344c" stroke-width="4"/><path d="M414,180 L520,180" stroke="#236d70" stroke-width="4" fill="none"/><path d="M520,180 L520,330" stroke="#236d70" stroke-width="4" fill="none"/><text x="425" y="128" font-size="21" fill="#20344c" text-anchor="start">D1 红 LED</text><text x="365" y="239" font-size="21" fill="#20344c" text-anchor="start">2 / A</text><text x="443" y="239" font-size="21" fill="#20344c" text-anchor="start">1 / K</text><path d="M405 148 l22 -22 m-11 0 h11 v11 M428 154 l22 -22 m-11 0 h11 v11" fill="none" stroke="#bb6424" stroke-width="3"/><path d="M170,180 L170,245" stroke="#236d70" stroke-width="4" fill="none"/><path d="M149,245 L191,245" stroke="#236d70" stroke-width="4" fill="none"/><path d="M149,265 L191,265" stroke="#236d70" stroke-width="4" fill="none"/><path d="M170,265 L170,330" stroke="#236d70" stroke-width="4" fill="none"/><circle cx="170" cy="180" r="6" fill="#236d70"/><circle cx="170" cy="330" r="6" fill="#236d70"/><text x="207" y="274" font-size="22" fill="#20344c" text-anchor="start">C1</text><text x="207" y="302" font-size="21" fill="#20344c" text-anchor="start">100 nF</text><path d="M170,330 L170,360" stroke="#236d70" stroke-width="4" fill="none"/><path d="M144,360 L196,360" stroke="#236d70" stroke-width="4" fill="none"/><path d="M152,371 L188,371" stroke="#236d70" stroke-width="4" fill="none"/><path d="M160,382 L180,382" stroke="#236d70" stroke-width="4" fill="none"/><text x="210" y="372" font-size="22" fill="#20344c" text-anchor="start">GND / 0 V</text><text x="28" y="425" font-size="22" fill="#20344c" text-anchor="start">本例规定 D1：1 = K 阴极，2 = A 阳极</text><text x="28" y="460" font-size="20" fill="#536980" text-anchor="start">教学图；引脚编号不代表正负极通用规则</text></svg>
