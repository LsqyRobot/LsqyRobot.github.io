<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 485" role="img" aria-labelledby="title desc">
<title id="title">焊板读图：连接、物料、位置方向</title><desc id="desc">原创教学示意图，具体封装和端子以实际器件资料为准。</desc>
<style>text {font-family: "PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;}</style>
<rect width="600" height="485" rx="18" fill="#f4f7fa"/>
<text x="30" y="45" font-size="30" fill="#20344c" text-anchor="start">从电路图，到手里的板子</text><text x="30" y="78" font-size="20" fill="#536980" text-anchor="start">先确认连接，再确认位置和方向</text><rect x="28" y="105" width="544" height="90" rx="12" fill="#fff" stroke="#c6d5e2" stroke-width="3"/><text x="49" y="159" font-size="32" fill="#287e78" text-anchor="start">01</text><text x="118" y="141" font-size="25" fill="#20344c" text-anchor="start">原理图</text><text x="118" y="173" font-size="21" fill="#536980" text-anchor="start">谁和谁连接？</text><rect x="28" y="215" width="544" height="90" rx="12" fill="#fff" stroke="#c6d5e2" stroke-width="3"/><text x="49" y="269" font-size="32" fill="#287e78" text-anchor="start">02</text><text x="118" y="251" font-size="25" fill="#20344c" text-anchor="start">BOM 物料表</text><text x="118" y="283" font-size="21" fill="#536980" text-anchor="start">拿哪个型号、数值和封装？</text><rect x="28" y="325" width="544" height="90" rx="12" fill="#fff" stroke="#c6d5e2" stroke-width="3"/><text x="49" y="379" font-size="32" fill="#287e78" text-anchor="start">03</text><text x="118" y="361" font-size="25" fill="#20344c" text-anchor="start">装配图 / PCB</text><text x="118" y="393" font-size="21" fill="#536980" text-anchor="start">焊到哪里，朝哪个方向？</text><text x="30" y="455" font-size="23" fill="#20344c" text-anchor="start">用位号 R1、C1、D1 把三份资料串起来</text></svg>
