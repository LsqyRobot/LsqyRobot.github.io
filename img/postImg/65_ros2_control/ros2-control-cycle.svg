<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">ROS 2 Control: read, update, write</title>
  <desc id="description">A control cycle reads hardware state, updates the controller and writes commands. The next cycle receives hardware feedback.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d31"/><stop offset="1" stop-color="#192d45"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#9fb4cb" stroke-opacity=".07"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9" fill="none" stroke="#93a9bf" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="76" fill="#6edbd1" font-size="18" letter-spacing="4">ROS 2 HUMBLE / ENGINEERING NOTES</text>
    <text x="68" y="166" fill="#f2f6fc" font-size="72" font-weight="700" letter-spacing="1">ROS 2 CONTROL</text>
    <text x="72" y="215" fill="#adc0d5" font-size="27">Controllers, executors &amp; hardware interfaces</text>
    <g>
      <rect x="70" y="295" width="300" height="146" rx="18" fill="#172a40" stroke="#6edbd1" stroke-opacity=".6"/>
      <text x="94" y="328" fill="#6edbd1" font-size="14" letter-spacing="2">01 / CONTROL CYCLE</text>
      <text x="94" y="377" fill="#f2f6fc" font-size="35" font-weight="700">READ</text>
      <text x="94" y="411" fill="#b8c9db" font-size="20">Hardware state</text>
    </g>
<g>
      <rect x="450" y="295" width="300" height="146" rx="18" fill="#172a40" stroke="#8db8ff" stroke-opacity=".6"/>
      <text x="474" y="328" fill="#8db8ff" font-size="14" letter-spacing="2">02 / CONTROL CYCLE</text>
      <text x="474" y="377" fill="#f2f6fc" font-size="35" font-weight="700">UPDATE</text>
      <text x="474" y="411" fill="#b8c9db" font-size="20">Controller logic</text>
    </g>
<g>
      <rect x="830" y="295" width="300" height="146" rx="18" fill="#172a40" stroke="#ffc47d" stroke-opacity=".6"/>
      <text x="854" y="328" fill="#ffc47d" font-size="14" letter-spacing="2">03 / CONTROL CYCLE</text>
      <text x="854" y="377" fill="#f2f6fc" font-size="35" font-weight="700">WRITE</text>
      <text x="854" y="411" fill="#b8c9db" font-size="20">Hardware command</text>
    </g>
    <g fill="none" stroke="#93a9bf" stroke-width="2" marker-end="url(#arrow)">
      <path d="M387 368H432"/>
      <path d="M767 368H812"/>
    </g>
    <path d="M980 458V500Q980 520 960 520H240Q220 520 220 500V458" fill="none" stroke="#93a9bf" stroke-opacity=".8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="394" y="503" width="412" height="34" rx="8" fill="#172a40"/>
    <text x="600" y="526" text-anchor="middle" fill="#b8c9db" font-size="16" letter-spacing="2">FEEDBACK / NEXT CYCLE</text>
    <text x="72" y="590" fill="#7c94ae" font-size="15" letter-spacing="2">STATE · TARGET · TIMING · INTERFACE CONTRACT</text>
  </g>
</svg>
