<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 585" role="img" aria-labelledby="title desc">
  <title id="title">典型二型系统的闭环结构与开环对数幅频特性</title>
  <desc id="desc">左侧为单位负反馈结构，前向通道是 K 乘以 tau s 加一，除以 s 的平方乘以 Ts 加一。右侧表示零点频率小于交越频率、交越频率又小于惯性环节转折频率时的开环渐近幅频曲线。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: FZLT, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .math { font-family: "KaTeX_Main", "Times New Roman", serif; font-style: italic; }
      .small { fill: #64748b; font-size: 14px; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
    </style>
  </defs>
  <rect x="1" y="1" width="1098" height="583" rx="24" fill="#f8fafc" stroke="#dbe3ee" stroke-width="2"/>
  <text x="45" y="53" fill="#0f172a" font-size="27" font-weight="700">典型Ⅱ型系统</text>
  <text x="45" y="81" class="small">两个积分环节 + 一个超前零点 + 一个惯性环节</text>

  <!-- Left: closed-loop structure -->
  <g filter="url(#shadow)">
    <rect x="43" y="111" width="415" height="416" rx="20" fill="#ffffff" stroke="#dbe3ee"/>
  </g>
  <rect x="66" y="132" width="126" height="34" rx="17" fill="#fff1e6"/>
  <text x="129" y="154" text-anchor="middle" fill="#c2410c" font-size="15" font-weight="700">a · 单位负反馈</text>

  <text x="72" y="253" class="math" fill="#334155" font-size="18">R(s)</text>
  <path d="M 110 247 H 151" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(166 247)">
    <circle r="16" fill="#ffffff" stroke="#f97316" stroke-width="3"/>
    <path d="M -8 0 H 8 M 0 -8 V 8" stroke="#f97316" stroke-width="2"/>
    <text x="-25" y="-14" fill="#ea580c" font-size="15">+</text>
    <text x="-25" y="28" fill="#ea580c" font-size="17">−</text>
  </g>
  <path d="M 182 247 H 213" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="215" y="190" width="180" height="114" rx="15" fill="#fff1e6" stroke="#f97316" stroke-width="2"/>
  <text x="305" y="229" text-anchor="middle" class="math" fill="#9a3412" font-size="22">K(τs + 1)</text>
  <path d="M 252 239 H 358" stroke="#9a3412" stroke-width="2"/>
  <text x="305" y="273" text-anchor="middle" class="math" fill="#9a3412" font-size="22">s²(Ts + 1)</text>
  <path d="M 395 247 H 425" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="395" y="225" class="math" fill="#334155" font-size="18">C(s)</text>
  <circle cx="412" cy="247" r="4" fill="#334155"/>
  <path d="M 412 247 V 384 H 166 V 265" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="247" y="363" width="84" height="42" rx="12" fill="#eef2f7" stroke="#cbd5e1"/>
  <text x="289" y="390" text-anchor="middle" fill="#475569" font-size="16">H(s) = 1</text>

  <rect x="72" y="437" width="357" height="62" rx="13" fill="#eef2f7"/>
  <text x="250" y="461" text-anchor="middle" fill="#334155" font-size="15">超前零点 (τs + 1) 抬升中频相位</text>
  <text x="250" y="485" text-anchor="middle" class="small">让交越附近斜率回到 −20 dB/dec</text>

  <!-- Right: Bode magnitude sketch -->
  <g filter="url(#shadow)">
    <rect x="482" y="111" width="575" height="416" rx="20" fill="#ffffff" stroke="#dbe3ee"/>
  </g>
  <rect x="505" y="132" width="176" height="34" rx="17" fill="#e0f2fe"/>
  <text x="593" y="154" text-anchor="middle" fill="#0369a1" font-size="15" font-weight="700">b · 开环渐近幅频特性</text>

  <path d="M 555 193 V 458 M 555 458 H 1018" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 555 235 H 1010 M 555 306 H 1010 M 555 377 H 1010 M 650 193 V 458 M 760 193 V 458 M 870 193 V 458 M 980 193 V 458" class="grid"/>
  <text x="529" y="198" text-anchor="end" fill="#475569" font-size="15">L(ω) / dB</text>
  <text x="1022" y="482" text-anchor="end" class="math" fill="#475569" font-size="17">log ω</text>
  <text x="543" y="311" text-anchor="end" fill="#64748b" font-size="13">0 dB</text>

  <!-- Three characteristic frequencies -->
  <path d="M 694 193 V 458" stroke="#f97316" stroke-width="2" stroke-dasharray="7 7"/>
  <path d="M 823 193 V 458" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="7 7"/>
  <path d="M 938 193 V 458" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="694" y="489" text-anchor="middle" class="math" fill="#ea580c" font-size="17">1 / τ</text>
  <text x="823" y="489" text-anchor="middle" class="math" fill="#7c3aed" font-size="17">ω<tspan baseline-shift="sub" font-size="12">c</tspan></text>
  <text x="938" y="489" text-anchor="middle" class="math" fill="#0284c7" font-size="17">1 / T</text>

  <path d="M 575 187 L 694 257 L 938 354 L 1006 438" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="694" cy="257" r="6" fill="#f97316" stroke="#ffffff" stroke-width="3"/>
  <circle cx="823" cy="306" r="7" fill="#8b5cf6" stroke="#ffffff" stroke-width="3"/>
  <circle cx="938" cy="354" r="6" fill="#0284c7" stroke="#ffffff" stroke-width="3"/>

  <rect x="564" y="222" width="126" height="34" rx="17" fill="#ecfdf5"/>
  <text x="627" y="245" text-anchor="middle" fill="#0f766e" font-size="14">−40 dB / dec</text>
  <rect x="742" y="242" width="126" height="34" rx="17" fill="#ecfdf5"/>
  <text x="805" y="265" text-anchor="middle" fill="#0f766e" font-size="14">−20 dB / dec</text>
  <rect x="900" y="398" width="126" height="34" rx="17" fill="#ecfdf5"/>
  <text x="963" y="421" text-anchor="middle" fill="#0f766e" font-size="14">−40 dB / dec</text>

  <rect x="528" y="510" width="481" height="42" rx="12" fill="#fff1e6"/>
  <text x="768" y="537" text-anchor="middle" fill="#c2410c" font-size="16" font-weight="700">设计要点：1/τ &lt; ω<tspan baseline-shift="sub" font-size="11">c</tspan> &lt; 1/T，且 τ &gt; T</text>
</svg>
