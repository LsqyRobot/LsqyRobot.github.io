<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc">
  <title id="title">典型一型系统的闭环结构与开环对数幅频特性</title>
  <desc id="desc">左侧为单位负反馈结构，前向通道是 K 除以 s 乘以 Ts 加一。右侧表示交越频率小于惯性环节转折频率时的开环渐近幅频曲线。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: FZLT, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .math { font-family: "KaTeX_Main", "Times New Roman", serif; font-style: italic; }
      .small { fill: #64748b; font-size: 14px; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
    </style>
  </defs>
  <rect x="1" y="1" width="1098" height="568" rx="24" fill="#f8fafc" stroke="#dbe3ee" stroke-width="2"/>
  <text x="45" y="53" fill="#0f172a" font-size="27" font-weight="700">典型Ⅰ型系统</text>
  <text x="45" y="81" class="small">一个积分环节 + 一个惯性环节</text>

  <!-- Left: closed-loop structure -->
  <g filter="url(#shadow)">
    <rect x="43" y="111" width="415" height="401" rx="20" fill="#ffffff" stroke="#dbe3ee"/>
  </g>
  <rect x="66" y="132" width="126" height="34" rx="17" fill="#f3e8ff"/>
  <text x="129" y="154" text-anchor="middle" fill="#6d28d9" font-size="15" font-weight="700">a · 单位负反馈</text>

  <text x="72" y="253" class="math" fill="#334155" font-size="18">R(s)</text>
  <path d="M 110 247 H 151" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(166 247)">
    <circle r="16" fill="#ffffff" stroke="#8b5cf6" stroke-width="3"/>
    <path d="M -8 0 H 8 M 0 -8 V 8" stroke="#8b5cf6" stroke-width="2"/>
    <text x="-25" y="-14" fill="#7c3aed" font-size="15">+</text>
    <text x="-25" y="28" fill="#7c3aed" font-size="17">−</text>
  </g>
  <path d="M 182 247 H 218" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="220" y="197" width="166" height="100" rx="15" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="303" y="231" text-anchor="middle" class="math" fill="#5b21b6" font-size="23">K</text>
  <path d="M 254 240 H 352" stroke="#5b21b6" stroke-width="2"/>
  <text x="303" y="270" text-anchor="middle" class="math" fill="#5b21b6" font-size="22">s(Ts + 1)</text>
  <path d="M 386 247 H 421" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="393" y="226" class="math" fill="#334155" font-size="18">C(s)</text>
  <circle cx="408" cy="247" r="4" fill="#334155"/>
  <path d="M 408 247 V 375 H 166 V 265" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="245" y="354" width="84" height="42" rx="12" fill="#eef2f7" stroke="#cbd5e1"/>
  <text x="287" y="381" text-anchor="middle" fill="#475569" font-size="16">H(s) = 1</text>

  <rect x="72" y="429" width="357" height="55" rx="13" fill="#eef2f7"/>
  <text x="250" y="452" text-anchor="middle" fill="#334155" font-size="15">低频积分保证稳态精度</text>
  <text x="250" y="474" text-anchor="middle" class="small">高频惯性环节使斜率再下降 −20 dB/dec</text>

  <!-- Right: Bode magnitude sketch -->
  <g filter="url(#shadow)">
    <rect x="482" y="111" width="575" height="401" rx="20" fill="#ffffff" stroke="#dbe3ee"/>
  </g>
  <rect x="505" y="132" width="176" height="34" rx="17" fill="#e0f2fe"/>
  <text x="593" y="154" text-anchor="middle" fill="#0369a1" font-size="15" font-weight="700">b · 开环渐近幅频特性</text>

  <!-- Grid and axes -->
  <path d="M 555 193 V 447 M 555 447 H 1018" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 555 235 H 1010 M 555 296 H 1010 M 555 357 H 1010 M 650 193 V 447 M 760 193 V 447 M 870 193 V 447 M 980 193 V 447" class="grid"/>
  <text x="529" y="198" text-anchor="end" fill="#475569" font-size="15">L(ω) / dB</text>
  <text x="1022" y="472" text-anchor="end" class="math" fill="#475569" font-size="17">log ω</text>
  <text x="543" y="301" text-anchor="end" fill="#64748b" font-size="13">0 dB</text>

  <!-- Characteristic frequencies -->
  <path d="M 788 193 V 447" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="7 7"/>
  <path d="M 914 193 V 447" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="788" y="477" text-anchor="middle" class="math" fill="#7c3aed" font-size="17">ω<tspan baseline-shift="sub" font-size="12">c</tspan></text>
  <text x="914" y="477" text-anchor="middle" class="math" fill="#0284c7" font-size="17">1 / T</text>

  <!-- Magnitude curve -->
  <path d="M 575 186 L 914 350 L 1005 438" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="788" cy="296" r="7" fill="#8b5cf6" stroke="#ffffff" stroke-width="3"/>
  <circle cx="914" cy="350" r="6" fill="#0284c7" stroke="#ffffff" stroke-width="3"/>
  <rect x="616" y="214" width="126" height="34" rx="17" fill="#ecfdf5"/>
  <text x="679" y="237" text-anchor="middle" fill="#0f766e" font-size="14">−20 dB / dec</text>
  <rect x="901" y="386" width="126" height="34" rx="17" fill="#ecfdf5"/>
  <text x="964" y="409" text-anchor="middle" fill="#0f766e" font-size="14">−40 dB / dec</text>

  <rect x="528" y="495" width="481" height="42" rx="12" fill="#f3e8ff"/>
  <text x="768" y="522" text-anchor="middle" fill="#6d28d9" font-size="16" font-weight="700">设计要点：ω<tspan baseline-shift="sub" font-size="11">c</tspan> &lt; 1/T，使交越处保持 −20 dB/dec</text>
</svg>
