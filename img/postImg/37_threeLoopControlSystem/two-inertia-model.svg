<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">柔性连接的两惯量模型</title>
  <desc id="desc">电机惯量和负载惯量通过具有刚度和阻尼的柔性传动轴连接。电机端和负载端可以发生相对扭转，从而产生机械共振与反共振。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7"/>
    </marker>
    <style>
      text { font-family: FZLT, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .math { font-family: "KaTeX_Main", "Times New Roman", serif; font-style: italic; }
      .small { fill: #64748b; font-size: 15px; }
    </style>
  </defs>
  <rect x="1" y="1" width="1098" height="558" rx="24" fill="#f8fafc" stroke="#dbe3ee" stroke-width="2"/>
  <text x="46" y="54" fill="#0f172a" font-size="27" font-weight="700">两惯量模型</text>
  <text x="46" y="82" class="small">实际柔性连接：传动轴会储能、耗能，并引入机械共振</text>

  <g filter="url(#shadow)">
    <rect x="70" y="115" width="960" height="250" rx="22" fill="#ffffff" stroke="#dbe3ee"/>
  </g>

  <path d="M 103 235 H 187" stroke="#0284c7" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="145" y="210" text-anchor="middle" fill="#0369a1" font-size="17">电磁转矩</text>
  <text x="145" y="260" text-anchor="middle" class="math" fill="#0369a1" font-size="20">T<tspan baseline-shift="sub" font-size="14">e</tspan></text>

  <g transform="translate(260 235)">
    <circle r="66" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/>
    <circle r="26" fill="#ffffff" stroke="#0284c7" stroke-width="3"/>
    <path d="M -12 -39 A 42 42 0 0 1 35 -18" fill="none" stroke="#0284c7" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text x="0" y="7" text-anchor="middle" fill="#075985" font-size="22" font-weight="700">电机</text>
    <text x="0" y="97" text-anchor="middle" class="math" fill="#334155" font-size="19">J<tspan baseline-shift="sub" font-size="13">M</tspan>，θ<tspan baseline-shift="sub" font-size="13">M</tspan></text>
  </g>

  <!-- Flexible spring-damper coupling -->
  <path d="M 326 235 H 365 L 380 214 L 405 256 L 430 214 L 455 256 L 480 214 L 505 256 L 520 235 H 548" fill="none" stroke="#8b5cf6" stroke-width="4" stroke-linejoin="round"/>
  <text x="438" y="187" text-anchor="middle" fill="#6d28d9" font-size="17" font-weight="700">扭转刚度 K<tspan baseline-shift="sub" font-size="12">s</tspan></text>
  <path d="M 365 291 H 402 M 402 270 V 312 M 402 282 H 474 M 474 270 V 312 M 474 291 H 548" fill="none" stroke="#64748b" stroke-width="3"/>
  <rect x="427" y="276" width="22" height="30" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="438" y="340" text-anchor="middle" fill="#475569" font-size="16">轴系阻尼 C<tspan baseline-shift="sub" font-size="11">s</tspan></text>

  <g transform="translate(615 235)">
    <circle r="66" fill="#ccfbf1" stroke="#0f766e" stroke-width="4"/>
    <circle r="26" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
    <text x="0" y="7" text-anchor="middle" fill="#0f766e" font-size="22" font-weight="700">负载</text>
    <text x="0" y="97" text-anchor="middle" class="math" fill="#334155" font-size="19">J<tspan baseline-shift="sub" font-size="13">L</tspan>，θ<tspan baseline-shift="sub" font-size="13">L</tspan></text>
  </g>

  <path d="M 795 235 H 688" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="746" y="210" text-anchor="middle" fill="#c2410c" font-size="17">负载转矩 T<tspan baseline-shift="sub" font-size="12">L</tspan></text>

  <g transform="translate(835 153)">
    <rect width="158" height="164" rx="18" fill="#fff7ed" stroke="#fdba74"/>
    <text x="79" y="32" text-anchor="middle" fill="#9a3412" font-size="17" font-weight="700">关键差异</text>
    <path d="M 22 48 H 136" stroke="#fed7aa"/>
    <text x="22" y="75" fill="#475569" font-size="15">θ<tspan baseline-shift="sub" font-size="10">M</tspan> ≠ θ<tspan baseline-shift="sub" font-size="10">L</tspan></text>
    <text x="22" y="104" fill="#475569" font-size="15">轴系产生扭矩</text>
    <text x="22" y="133" class="math" fill="#9a3412" font-size="16">T<tspan baseline-shift="sub" font-size="11">s</tspan> = K<tspan baseline-shift="sub" font-size="11">s</tspan>Δθ + C<tspan baseline-shift="sub" font-size="11">s</tspan>Δω</text>
  </g>

  <!-- Interpretation strip -->
  <text x="71" y="415" fill="#334155" font-size="18" font-weight="700">控制上的含义</text>
  <g transform="translate(71 438)">
    <rect width="286" height="78" rx="15" fill="#f3e8ff" stroke="#ddd6fe"/>
    <circle cx="34" cy="39" r="17" fill="#8b5cf6"/>
    <text x="34" y="45" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">1</text>
    <text x="62" y="32" fill="#5b21b6" font-size="16" font-weight="700">出现共振 / 反共振</text>
    <text x="62" y="56" class="small">带宽受到机械模态限制</text>
  </g>
  <g transform="translate(393 438)">
    <rect width="286" height="78" rx="15" fill="#e0f2fe" stroke="#bae6fd"/>
    <circle cx="34" cy="39" r="17" fill="#0284c7"/>
    <text x="34" y="45" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">2</text>
    <text x="62" y="32" fill="#075985" font-size="16" font-weight="700">增益不能盲目提高</text>
    <text x="62" y="56" class="small">相位滞后会侵蚀稳定裕度</text>
  </g>
  <g transform="translate(715 438)">
    <rect width="315" height="78" rx="15" fill="#ecfdf5" stroke="#a7f3d0"/>
    <circle cx="34" cy="39" r="17" fill="#0f766e"/>
    <text x="34" y="45" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">3</text>
    <text x="62" y="32" fill="#0f766e" font-size="16" font-weight="700">需要滤波、陷波或主动抑振</text>
    <text x="62" y="56" class="small">调参必须匹配真实机械刚度</text>
  </g>
</svg>
