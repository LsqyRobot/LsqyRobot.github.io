<svg xmlns="http://www.w3.org/2000/svg" width="900" height="645" viewBox="0 0 900 645" role="img" aria-labelledby="title description"><title id="title">删除 20：先接回链路，再释放节点</title><desc id="description">接续插入后的 [10, 15, 20, 30]；必须持有前驱和待删节点。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#647f96"/></marker></defs><rect width="100%" height="100%" fill="#f5f8fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="40" y="60" font-size="34" fill="#19334a" text-anchor="start" font-weight="700">删除 20：先接回链路，再释放节点</text><text x="40" y="101" font-size="22" fill="#536b7e" text-anchor="start" font-weight="400">接续插入后的 [10, 15, 20, 30]；必须持有前驱和待删节点。</text><text x="40" y="154" font-size="25" fill="#19334a" text-anchor="start" font-weight="400">① victim = prev.next；prev 指向 15</text><rect x="70" y="175" width="120" height="62" rx="12" fill="#fff" stroke="#91a8bb" stroke-width="2"/><text x="130" y="215" font-size="28" fill="#19334a" text-anchor="middle" font-weight="650">10</text><path d="M 195 206 L 227 206" fill="none" stroke="#647f96" stroke-width="3" marker-end="url(#arrow)"/><rect x="236" y="175" width="120" height="62" rx="12" fill="#fff" stroke="#91a8bb" stroke-width="2"/><text x="296" y="215" font-size="28" fill="#19334a" text-anchor="middle" font-weight="650">15</text><path d="M 361 206 L 393 206" fill="none" stroke="#647f96" stroke-width="3" marker-end="url(#arrow)"/><rect x="402" y="175" width="120" height="62" rx="12" fill="#fff" stroke="#91a8bb" stroke-width="2"/><text x="462" y="215" font-size="28" fill="#19334a" text-anchor="middle" font-weight="650">20</text><path d="M 527 206 L 559 206" fill="none" stroke="#647f96" stroke-width="3" marker-end="url(#arrow)"/><rect x="568" y="175" width="120" height="62" rx="12" fill="#fff" stroke="#91a8bb" stroke-width="2"/><text x="628" y="215" font-size="28" fill="#19334a" text-anchor="middle" font-weight="650">30</text><path d="M 693 206 L 725 206" fill="none" stroke="#647f96" stroke-width="3" marker-end="url(#arrow)"/><text x="734" y="214" font-size="23" fill="#536b7e" text-anchor="start" font-weight="400">null</text><text x="40" y="315" font-size="25" fill="#19334a" text-anchor="start" font-weight="400">② prev.next = victim.next</text><rect x="70" y="336" width="120" height="62" rx="12" fill="#fff" stroke="#91a8bb" stroke-width="2"/><text x="130" y="376" font-size="28" fill="#19334a" text-anchor="middle" font-weight="650">10</text><path d="M 195 367 L 227 367" fill="none" stroke="#647f96" stroke-width="3" marker-end="url(#arrow)"/><rect x="236" y="336" width="120" height="62" rx="12" fill="#fff" stroke="#91a8bb" stroke-width="2"/><text x="296" y="376" font-size="28" fill="#19334a" text-anchor="middle" font-weight="650">15</text><path d="M 361 367 L 393 367" fill="none" stroke="#647f96" stroke-width="3" marker-end="url(#arrow)"/><rect x="402" y="336" width="120" height="62" rx="12" fill="#fff" stroke="#91a8bb" stroke-width="2"/><text x="462" y="376" font-size="28" fill="#19334a" text-anchor="middle" font-weight="650">30</text><path d="M 527 367 L 559 367" fill="none" stroke="#647f96" stroke-width="3" marker-end="url(#arrow)"/><text x="568" y="375" font-size="23" fill="#536b7e" text-anchor="start" font-weight="400">null</text><rect x="620" y="337" width="120" height="62" rx="12" fill="#ffedd4" stroke="#91a8bb" stroke-width="2"/><text x="680" y="377" font-size="28" fill="#19334a" text-anchor="middle" font-weight="400">20</text><text x="625" y="430" font-size="21" fill="#536b7e" text-anchor="start" font-weight="400">已脱链</text><rect x="40" y="475" width="820" height="101" rx="12" fill="#e3f1e5" stroke="#91a8bb" stroke-width="2"/><text x="62" y="514" font-size="28" fill="#19334a" text-anchor="start" font-weight="650">③ 释放 victim；不再解引用它</text><text x="62" y="556" font-size="23" fill="#536b7e" text-anchor="start" font-weight="400">链表变为 [10, 15, 30]；仅移动指针变量不等于删除节点。</text><text x="40" y="623" font-size="18" fill="#6c8296" text-anchor="start" font-weight="400">数据结构与算法 · 可复现学习图</text></g></svg>
