<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title description"><title id="title">复杂度：说明输入规模与最坏情况</title><desc id="description">增长趋势描述工作量，不能单独替代实际耗时、内存和常数。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#647f96"/></marker></defs><rect width="100%" height="100%" fill="#f5f8fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="40" y="60" font-size="34" fill="#19334a" text-anchor="start" font-weight="700">复杂度：说明输入规模与最坏情况</text><text x="40" y="101" font-size="22" fill="#536b7e" text-anchor="start" font-weight="400">增长趋势描述工作量，不能单独替代实际耗时、内存和常数。</text><rect x="40" y="143" width="390" height="134" rx="12" fill="#dfeefe" stroke="#91a8bb" stroke-width="2"/><text x="62" y="182" font-size="28" fill="#19334a" text-anchor="start" font-weight="650">O(1) / O(log n)</text><text x="62" y="224" font-size="23" fill="#536b7e" text-anchor="start" font-weight="400">下标访问；有序数组二分。</text><text x="62" y="257" font-size="23" fill="#536b7e" text-anchor="start" font-weight="400">固定操作 / 区间反复减半。</text><rect x="470" y="143" width="390" height="134" rx="12" fill="#e3f1e5" stroke="#91a8bb" stroke-width="2"/><text x="492" y="182" font-size="28" fill="#19334a" text-anchor="start" font-weight="650">O(n)</text><text x="492" y="224" font-size="23" fill="#536b7e" text-anchor="start" font-weight="400">完整遍历；线性扫描。</text><text x="492" y="257" font-size="23" fill="#536b7e" text-anchor="start" font-weight="400">n 翻倍，扫描项数约翻倍。</text><rect x="40" y="360" width="390" height="134" rx="12" fill="#e3f1e5" stroke="#91a8bb" stroke-width="2"/><text x="62" y="399" font-size="28" fill="#19334a" text-anchor="start" font-weight="650">O(n log n)</text><text x="62" y="441" font-size="23" fill="#536b7e" text-anchor="start" font-weight="400">常见比较排序的目标量级。</text><text x="62" y="474" font-size="23" fill="#536b7e" text-anchor="start" font-weight="400">仍需注明具体算法与条件。</text><rect x="470" y="360" width="390" height="134" rx="12" fill="#ffedd4" stroke="#91a8bb" stroke-width="2"/><text x="492" y="399" font-size="28" fill="#19334a" text-anchor="start" font-weight="650">O(n²)</text><text x="492" y="441" font-size="23" fill="#536b7e" text-anchor="start" font-weight="400">插入排序的最坏情况。</text><text x="492" y="474" font-size="23" fill="#536b7e" text-anchor="start" font-weight="400">嵌套处理逐渐变长的前缀。</text><text x="40" y="594" font-size="23" fill="#536b7e" text-anchor="start" font-weight="400">哈希查找常见平均 O(1)；冲突严重时最坏可退化至 O(n)。</text><text x="40" y="628" font-size="18" fill="#6c8296" text-anchor="start" font-weight="400">数据结构与算法 · 可复现学习图</text></g></svg>
