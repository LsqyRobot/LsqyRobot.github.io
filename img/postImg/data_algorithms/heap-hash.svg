<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title description"><title id="title">堆和哈希表：维护的性质不同</title><desc id="description">堆优先得到极值；哈希表按键映射到桶，冲突仍需处理。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#647f96"/></marker></defs><rect width="100%" height="100%" fill="#f5f8fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="40" y="60" font-size="34" fill="#19334a" text-anchor="start" font-weight="700">堆和哈希表：维护的性质不同</text><text x="40" y="101" font-size="22" fill="#536b7e" text-anchor="start" font-weight="400">堆优先得到极值；哈希表按键映射到桶，冲突仍需处理。</text><text x="65" y="160" font-size="26" fill="#19334a" text-anchor="start" font-weight="400">大顶堆：父节点 ≥ 子节点</text><path d="M 230 225 L 145 312" fill="none" stroke="#647f96" stroke-width="3" marker-end="url(#arrow)"/><path d="M 270 225 L 355 312" fill="none" stroke="#647f96" stroke-width="3" marker-end="url(#arrow)"/><path d="M 120 355 L 80 428" fill="none" stroke="#647f96" stroke-width="3" marker-end="url(#arrow)"/><path d="M 153 355 L 210 428" fill="none" stroke="#647f96" stroke-width="3" marker-end="url(#arrow)"/><rect x="215" y="185" width="75" height="62" rx="12" fill="#ffedd4" stroke="#91a8bb" stroke-width="2"/><text x="252" y="225" font-size="28" fill="#19334a" text-anchor="middle" font-weight="400">9</text><rect x="100" y="310" width="75" height="62" rx="12" fill="#dfeefe" stroke="#91a8bb" stroke-width="2"/><text x="137" y="350" font-size="28" fill="#19334a" text-anchor="middle" font-weight="400">7</text><rect x="330" y="310" width="75" height="62" rx="12" fill="#dfeefe" stroke="#91a8bb" stroke-width="2"/><text x="367" y="350" font-size="28" fill="#19334a" text-anchor="middle" font-weight="400">6</text><rect x="40" y="435" width="75" height="62" rx="12" fill="#fff" stroke="#91a8bb" stroke-width="2"/><text x="77" y="475" font-size="28" fill="#19334a" text-anchor="middle" font-weight="400">2</text><rect x="185" y="435" width="75" height="62" rx="12" fill="#fff" stroke="#91a8bb" stroke-width="2"/><text x="222" y="475" font-size="28" fill="#19334a" text-anchor="middle" font-weight="400">4</text><text x="485" y="160" font-size="26" fill="#19334a" text-anchor="start" font-weight="400">哈希桶：h(k) = k mod 4</text><rect x="480" y="190" width="70" height="56" rx="12" fill="#e3f1e5" stroke="#91a8bb" stroke-width="2"/><text x="515" y="228" font-size="25" fill="#19334a" text-anchor="middle" font-weight="400">0</text><text x="574" y="228" font-size="24" fill="#536b7e" text-anchor="start" font-weight="400">空</text><rect x="480" y="273" width="70" height="56" rx="12" fill="#e3f1e5" stroke="#91a8bb" stroke-width="2"/><text x="515" y="311" font-size="25" fill="#19334a" text-anchor="middle" font-weight="400">1</text><text x="574" y="311" font-size="24" fill="#536b7e" text-anchor="start" font-weight="400">5 → 9 → null</text><rect x="480" y="356" width="70" height="56" rx="12" fill="#e3f1e5" stroke="#91a8bb" stroke-width="2"/><text x="515" y="394" font-size="25" fill="#19334a" text-anchor="middle" font-weight="400">2</text><text x="574" y="394" font-size="24" fill="#536b7e" text-anchor="start" font-weight="400">空</text><rect x="480" y="439" width="70" height="56" rx="12" fill="#e3f1e5" stroke="#91a8bb" stroke-width="2"/><text x="515" y="477" font-size="25" fill="#19334a" text-anchor="middle" font-weight="400">3</text><text x="574" y="477" font-size="24" fill="#536b7e" text-anchor="start" font-weight="400">空</text><text x="45" y="561" font-size="25" fill="#536b7e" text-anchor="start" font-weight="400">堆不是完整排序；哈希的平均 O(1) 不是最坏情况保证。</text><text x="40" y="598" font-size="18" fill="#6c8296" text-anchor="start" font-weight="400">数据结构与算法 · 可复现学习图</text></g></svg>
