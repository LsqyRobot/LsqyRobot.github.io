<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680" role="img" aria-labelledby="title description"><title id="title">最少硬币数：先定义状态再写转移</title><desc id="description">硬币 [1, 3, 4] 可重复使用，目标金额 6；这不是贪心选最大面额。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#647f96"/></marker></defs><rect width="100%" height="100%" fill="#f5f8fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="40" y="60" font-size="34" fill="#19334a" text-anchor="start" font-weight="700">最少硬币数：先定义状态再写转移</text><text x="40" y="101" font-size="22" fill="#536b7e" text-anchor="start" font-weight="400">硬币 [1, 3, 4] 可重复使用，目标金额 6；这不是贪心选最大面额。</text><rect x="40" y="141" width="820" height="167" rx="12" fill="#dfeefe" stroke="#91a8bb" stroke-width="2"/><text x="62" y="180" font-size="28" fill="#19334a" text-anchor="start" font-weight="650">dp[s]：恰好凑出金额 s 的最少硬币数</text><text x="62" y="222" font-size="23" fill="#536b7e" text-anchor="start" font-weight="400">dp[0] = 0；其它状态初始化为 ∞。</text><text x="62" y="255" font-size="23" fill="#536b7e" text-anchor="start" font-weight="400">dp[s] = min(dp[s], dp[s − coin] + 1)</text><text x="62" y="288" font-size="23" fill="#536b7e" text-anchor="start" font-weight="400">条件：coin ≤ s，并且前驱 dp[s − coin] 可达。</text><rect x="117" y="363" width="82" height="62" rx="12" fill="#fff" stroke="#91a8bb" stroke-width="2"/><text x="158" y="402" font-size="28" fill="#19334a" text-anchor="middle" font-weight="650">0</text><text x="158" y="449" font-size="18" fill="#536b7e" text-anchor="middle" font-weight="400">0</text><rect x="209" y="363" width="82" height="62" rx="12" fill="#fff" stroke="#91a8bb" stroke-width="2"/><text x="250" y="402" font-size="28" fill="#19334a" text-anchor="middle" font-weight="650">1</text><text x="250" y="449" font-size="18" fill="#536b7e" text-anchor="middle" font-weight="400">1</text><rect x="301" y="363" width="82" height="62" rx="12" fill="#fff" stroke="#91a8bb" stroke-width="2"/><text x="342" y="402" font-size="28" fill="#19334a" text-anchor="middle" font-weight="650">2</text><text x="342" y="449" font-size="18" fill="#536b7e" text-anchor="middle" font-weight="400">2</text><rect x="393" y="363" width="82" height="62" rx="12" fill="#e3f1e5" stroke="#91a8bb" stroke-width="2"/><text x="434" y="402" font-size="28" fill="#19334a" text-anchor="middle" font-weight="650">1</text><text x="434" y="449" font-size="18" fill="#536b7e" text-anchor="middle" font-weight="400">3</text><rect x="485" y="363" width="82" height="62" rx="12" fill="#fff" stroke="#91a8bb" stroke-width="2"/><text x="526" y="402" font-size="28" fill="#19334a" text-anchor="middle" font-weight="650">1</text><text x="526" y="449" font-size="18" fill="#536b7e" text-anchor="middle" font-weight="400">4</text><rect x="577" y="363" width="82" height="62" rx="12" fill="#fff" stroke="#91a8bb" stroke-width="2"/><text x="618" y="402" font-size="28" fill="#19334a" text-anchor="middle" font-weight="650">2</text><text x="618" y="449" font-size="18" fill="#536b7e" text-anchor="middle" font-weight="400">5</text><rect x="669" y="363" width="82" height="62" rx="12" fill="#ffedd4" stroke="#91a8bb" stroke-width="2"/><text x="710" y="402" font-size="28" fill="#19334a" text-anchor="middle" font-weight="650">2</text><text x="710" y="449" font-size="18" fill="#536b7e" text-anchor="middle" font-weight="400">6</text><text x="120" y="471" font-size="23" fill="#536b7e" text-anchor="start" font-weight="400">下方下标表示金额 s，方框内表示最少硬币数。</text><rect x="40" y="512" width="820" height="101" rx="12" fill="#e3f1e5" stroke="#91a8bb" stroke-width="2"/><text x="62" y="551" font-size="28" fill="#19334a" text-anchor="start" font-weight="650">金额 6：3 + 3 只需要 2 枚</text><text x="62" y="593" font-size="23" fill="#536b7e" text-anchor="start" font-weight="400">若贪心先选 4，则还需 1 + 1，共 3 枚。</text><text x="40" y="658" font-size="18" fill="#6c8296" text-anchor="start" font-weight="400">数据结构与算法 · 可复现学习图</text></g></svg>
