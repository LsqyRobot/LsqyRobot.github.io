<svg xmlns="http://www.w3.org/2000/svg" width="900" height="635" viewBox="0 0 900 635" role="img" aria-labelledby="title description"><title id="title">BFS：最短边数来自按层扩展</title><desc id="description">有向图、无权边；邻居顺序固定为图示邻接表顺序。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#647f96"/></marker></defs><rect width="100%" height="100%" fill="#f5f8fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="40" y="60" font-size="34" fill="#19334a" text-anchor="start" font-weight="700">BFS：最短边数来自按层扩展</text><text x="40" y="101" font-size="22" fill="#536b7e" text-anchor="start" font-weight="400">有向图、无权边；邻居顺序固定为图示邻接表顺序。</text><path d="M 195.89527250537728 221.02618187365567 L 379.2540149938961 175.186496251526" fill="none" stroke="#647f96" stroke-width="3" marker-end="url(#arrow)"/><path d="M 192.83735484166436 247.05016501394113 L 382.7251647743269 345.6457586328236" fill="none" stroke="#647f96" stroke-width="3" marker-end="url(#arrow)"/><path d="M 457 165 L 678 165" fill="none" stroke="#647f96" stroke-width="3" marker-end="url(#arrow)"/><path d="M 450.7858608905002 344.4760927396665 L 685.0538876378106 188.29740824145964" fill="none" stroke="#647f96" stroke-width="3" marker-end="url(#arrow)"/><path d="M 457 365 L 678 365" fill="none" stroke="#647f96" stroke-width="3" marker-end="url(#arrow)"/><circle cx="160" cy="230" r="36" fill="#dfeefe" stroke="#668dad" stroke-width="2"/><text x="160" y="240" font-size="30" fill="#19334a" text-anchor="middle" font-weight="700">A</text><text x="160" y="296" font-size="23" fill="#536b7e" text-anchor="middle" font-weight="400">距离 0</text><circle cx="420" cy="165" r="36" fill="#dfeefe" stroke="#668dad" stroke-width="2"/><text x="420" y="175" font-size="30" fill="#19334a" text-anchor="middle" font-weight="700">B</text><text x="420" y="231" font-size="23" fill="#536b7e" text-anchor="middle" font-weight="400">距离 1</text><circle cx="420" cy="365" r="36" fill="#dfeefe" stroke="#668dad" stroke-width="2"/><text x="420" y="375" font-size="30" fill="#19334a" text-anchor="middle" font-weight="700">C</text><text x="420" y="431" font-size="23" fill="#536b7e" text-anchor="middle" font-weight="400">距离 1</text><circle cx="720" cy="165" r="36" fill="#dfeefe" stroke="#668dad" stroke-width="2"/><text x="720" y="175" font-size="30" fill="#19334a" text-anchor="middle" font-weight="700">D</text><text x="720" y="231" font-size="23" fill="#536b7e" text-anchor="middle" font-weight="400">距离 2</text><circle cx="720" cy="365" r="36" fill="#dfeefe" stroke="#668dad" stroke-width="2"/><text x="720" y="375" font-size="30" fill="#19334a" text-anchor="middle" font-weight="700">E</text><text x="720" y="431" font-size="23" fill="#536b7e" text-anchor="middle" font-weight="400">距离 2</text><rect x="40" y="460" width="820" height="101" rx="12" fill="#e3f1e5" stroke="#91a8bb" stroke-width="2"/><text x="62" y="499" font-size="28" fill="#19334a" text-anchor="start" font-weight="650">队列保证按层展开：A → B → C → D → E</text><text x="62" y="541" font-size="23" fill="#536b7e" text-anchor="start" font-weight="400">发现节点就标记再入队；C 再看到 D 时不重复入队。</text><text x="40" y="613" font-size="18" fill="#6c8296" text-anchor="start" font-weight="400">数据结构与算法 · 可复现学习图</text></g></svg>
