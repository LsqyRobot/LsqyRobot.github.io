<svg xmlns="http://www.w3.org/2000/svg" width="900" height="665" viewBox="0 0 900 665" role="img" aria-labelledby="title description"><title id="title">单链表插入：先保存后继</title><desc id="description">在值为 10 的节点之后插入 15；节点不要求连续存储。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#647f96"/></marker></defs><rect width="100%" height="100%" fill="#f5f8fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="40" y="60" font-size="34" fill="#19334a" text-anchor="start" font-weight="700">单链表插入：先保存后继</text><text x="40" y="101" font-size="22" fill="#536b7e" text-anchor="start" font-weight="400">在值为 10 的节点之后插入 15；节点不要求连续存储。</text><text x="40" y="159" font-size="25" fill="#19334a" text-anchor="start" font-weight="400">初始：prev 指向 10</text><rect x="110" y="180" width="125" height="62" rx="12" fill="#fff" stroke="#91a8bb" stroke-width="2"/><text x="172.5" y="220" font-size="28" fill="#19334a" text-anchor="middle" font-weight="650">10</text><path d="M 240 211 L 272 211" fill="none" stroke="#647f96" stroke-width="3" marker-end="url(#arrow)"/><rect x="281" y="180" width="125" height="62" rx="12" fill="#fff" stroke="#91a8bb" stroke-width="2"/><text x="343.5" y="220" font-size="28" fill="#19334a" text-anchor="middle" font-weight="650">20</text><path d="M 411 211 L 443 211" fill="none" stroke="#647f96" stroke-width="3" marker-end="url(#arrow)"/><rect x="452" y="180" width="125" height="62" rx="12" fill="#fff" stroke="#91a8bb" stroke-width="2"/><text x="514.5" y="220" font-size="28" fill="#19334a" text-anchor="middle" font-weight="650">30</text><path d="M 582 211 L 614 211" fill="none" stroke="#647f96" stroke-width="3" marker-end="url(#arrow)"/><text x="623" y="219" font-size="23" fill="#536b7e" text-anchor="start" font-weight="400">null</text><text x="40" y="301" font-size="25" fill="#19334a" text-anchor="start" font-weight="400">① new.next