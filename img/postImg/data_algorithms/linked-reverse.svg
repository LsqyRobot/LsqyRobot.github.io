<svg xmlns="http://www.w3.org/2000/svg" width="900" height="655" viewBox="0 0 900 655" role="img" aria-labelledby="title description"><title id="title">原地反转：每次保留未处理的后半段</title><desc id="description">接续删除后的 [10, 15, 30]；先保存 next，再反转 curr.next。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#647f96"/></marker></defs><rect width="100%" height="100%" fill="#f5f8fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="40" y="60" font-size="34" fill="#19334a" text-anchor="start" font-weight="700">原地反转：每次保留未处理的后半段</text><text x="40" y="101" font-size="22" fill="#536b7e" text-anchor="start" font-weight="400">接续删除后的 [10, 15, 30]；先保存 next，再反转 curr.next。</text><text x="40" y="156" font-size="24" fill="#19334a" text-anchor="start" font-weight="400">初始：prev = null，curr 指向 10</text><rect x="280" y="181" width="112" height="62" rx="12" fill="#fff" stroke="#91a8bb" stroke-width="2"/><text x="336" y="221" font-size="28" fill="#19334a" text-anchor="middle" font-weight="650">10</text><path d="M 397 212 L 429 212" fill="none" stroke="#647f96" stroke-width="3" marker-end="url(#arrow)"/><rect x="438" y="181" width="112" height="62" rx="12" fill="#fff" stroke="#91a8bb" stroke-width="2"/><text x="494" y="221" font-size="28" fill="#19334a" text-anchor="middle" font-weight="650">15</text><path d="M 555 212 L 587 212" fill="none" stroke="#647f96" stroke-width="3" marker-end="url(#arrow)"/><rect x="596" y="181" width="112" height="62" rx="12" fill="#fff" stroke="#91a8bb" stroke-width="2"/><text x="652" y="221" font-size="28" fill="#19334a" text-anchor="middle" font-weight="650">30</text><path d="M 713 212 L 745 212" fill="none" stroke="#647f96" stroke-width="3" marker-end="url(#arrow)"/><text x="754" y="220" font-size="23" fill="#536b7e" text-anchor="start" font-weight="400">null</text><text x="40" y="296" font-size="24" fill="#19334a" text-anchor="start" font-weight="400">反转 10 的 next</text><rect x="40" y="317" width="112" height="62" rx="12" fill="#fff" stroke="#91a8bb" stroke-width="2"/><text x="96" y="357" font-size="28" fill="#19334a" text-anchor="middle" font-weight="650">10</text><path d="M 157 348 L 189 348" fill="none" stroke="#647f96" stroke-width="3" marker-end="url(#arrow)"/><text x="198" y="356" font-size="23" fill="#536b7e" text-anchor="start" font-weight="400">null</text><rect x="400" y="317" width="112" height="62" rx="12" fill="#fff" stroke="#91a8bb" stroke-width="2"/><text x="456" y="357" font-size="28" fill="#19334a" text-anchor="middle" font-weight="650">15</text><path d="M 517 348 L 549 348" fill="none" stroke="#647f96" stroke-width="3" marker-end="url(#arrow)"/><rect x="558" y="317" width="112" height="62" rx="12" fill="#fff" stroke="#91a8bb" stroke-width="2"/><text x="614" y="357" font-size="28" fill="#19334a" text-anchor="middle" font-weight="650">30</text><path d="M 675 348 L 707 348" fill="none" stroke="#647f96" stroke-width="3" marker-end="url(#arrow)"/><text x="716" y="356" font-size="23" fill="#536b7e" text-anchor="start" font-weight="400">null</text><text x="40" y="402" font-size="20" fill="#536b7e" text-anchor="start" font-weight="400">已处理：prev</text><text x="400" y="402" font-size="20" fill="#536b7e" text-anchor="start" font-weight="400">待处理：curr</text><text x="40" y="463" font-size="24" fill="#19334a" text-anchor="start" font-weight="400">继续处理 15、30，最后 head = prev</text><rect x="170" y="487" width="125" height="62" rx="12" fill="#fff" stroke="#91a8bb" stroke-width="2"/><text x="232.5" y="527" font-size="28" fill="#19334a" text-anchor="middle" font-weight="650">30</text><path d="M 300 518 L 332 518" fill="none" stroke="#647f96" stroke-width="3" marker-end="url(#arrow)"/><rect x="341" y="487" width="125" height="62" rx="12" fill="#fff" stroke="#91a8bb" stroke-width="2"/><text x="403.5" y="527" font-size="28" fill="#19334a" text-anchor="middle" font-weight="650">15</text><path d="M 471 518 L 503 518" fill="none" stroke="#647f96" stroke-width="3" marker-end="url(#arrow)"/><rect x="512" y="487" width="125" height="62" rx="12" fill="#fff" stroke="#91a8bb" stroke-width="2"/><text x="574.5" y="527" font-size="28" fill="#19334a" text-anchor="middle" font-weight="650">10</text><path d="M 642 518 L 674 518" fill="none" stroke="#647f96" stroke-width="3" marker-end="url(#arrow)"/><text x="683" y="526" font-size="23" fill="#536b7e" text-anchor="start" font-weight="400">null</text><text x="40" y="602" font-size="23" fill="#536b7e" text-anchor="start" font-weight="400">循环中的“已反转前缀”与“待处理后缀”共同保留全部节点。</text><text x="40" y="633" font-size="18" fill="#6c8296" text-anchor="start" font-weight="400">数据结构与算法 · 可复现学习图</text></g></svg>
