<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="title description"><title id="title">数据结构：先看关系，再选操作</title><desc id="description">存储关系、访问方式和不变量共同决定适用场景。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#647f96"/></marker></defs><rect width="100%" height="100%" fill="#f5f8fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="40" y="60" font-size="34" fill="#19334a" text-anchor="start" font-weight="700">数据结构：先看关系，再选操作</text><text x="40" y="101" font-size="22" fill="#536b7e" text-anchor="start" font-weight="400">存储关系、访问方式和不变量共同决定适用场景。</text><rect x="40" y="140" width="820" height="101" rx="12" fill="#dfeefe" stroke="#91a8bb" stroke-width="2"/><text x="62" y="179" font-size="28" fill="#19334a" text-anchor="start" font-weight="650">连续序列  vector / array</text><text x="62" y="221" font-size="23" fill="#536b7e" text-anchor="start" font-weight="400">下标访问直接；中间插入通常需要移动后缀。</text><rect x="40" y="285" width="820" height="101" rx="12" fill="#e3f1e5" stroke="#91a8bb" stroke-width="2"/><text x="62" y="324" font-size="28" fill="#19334a" text-anchor="start" font-weight="650">链接结构  forward_list / list</text><text x="62" y="366" font-size="23" fill="#536b7e" text-anchor="start" font-weight="400">沿链接访问；已有位置时改链接，查找位置仍需代价。</text><rect x="40" y="430" width="820" height="101" rx="12" fill="#ffedd4" stroke="#91a8bb" stroke-width="2"/><text x="62" y="469" font-size="28" fill="#19334a" text-anchor="start" font-weight="650">树、堆、哈希表与图</text><text x="62" y="511" font-size="23" fill="#536b7e" text-anchor="start" font-weight="400">分别维护顺序、极值、键映射，或任意节点关系。</text><text x="40" y="588" font-size="18" fill="#6c8296" text-anchor="start" font-weight="400">数据结构与算法 · 可复现学习图</text></g></svg>
