<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Actor and Critic input and output dimensions for quadruped reinforcement learning</title>
  <desc id="desc">A two-lane diagram showing an actor mapping 45 observation features to 12 actions and a critic mapping 48 privileged observation features to one value.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#10243a"/>
      <stop offset="1" stop-color="#0b1828"/>
    </linearGradient>
    <linearGradient id="actorGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#31d6b0"/>
      <stop offset="1" stop-color="#77f2d2"/>
    </linearGradient>
    <linearGradient id="criticGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64a8ff"/>
      <stop offset="1" stop-color="#9bc7ff"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#b8cee6" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrowActor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#59e5c5"/>
    </marker>
    <marker id="arrowCritic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#82baff"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="1070" cy="-35" r="300" fill="#2c7dff" opacity="0.08"/>
  <circle cx="105" cy="680" r="285" fill="#32dab2" opacity="0.075"/>

  <g font-family="Inter, Noto Sans SC, Arial, sans-serif">
    <text x="72" y="82" fill="#62e3c4" font-size="24" font-weight="700" letter-spacing="4">QUADRUPED RL</text>
    <text x="72" y="137" fill="#f4f8fc" font-size="44" font-weight="750" letter-spacing="1">ACTOR / CRITIC</text>
    <text x="72" y="176" fill="#aabed1" font-size="22" font-weight="500" letter-spacing="2">INPUT · OUTPUT · TENSOR DIMENSIONS</text>

    <g transform="translate(950 54)" stroke="#dceaff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.88">
      <rect x="26" y="16" width="120" height="48" rx="15" fill="#172d45"/>
      <path d="M48 64L25 108M70 64L62 111M119 64L127 111M141 64L164 108"/>
      <path d="M20 109H43M50 112H74M115 112H139M152 109H175"/>
      <circle cx="44" cy="38" r="7" fill="#62e3c4" stroke="none"/>
      <path d="M146 33L171 21"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="62" y="222" width="518" height="326" rx="28" fill="#0c1b2c" stroke="#43dbb8" stroke-opacity="0.55" stroke-width="2"/>
      <rect x="620" y="222" width="518" height="326" rx="28" fill="#0c1b2c" stroke="#6daeff" stroke-opacity="0.55" stroke-width="2"/>
    </g>

    <text x="98" y="269" fill="#61e5c5" font-size="23" font-weight="750" letter-spacing="3">ACTOR · POLICY</text>
    <text x="656" y="269" fill="#82baff" font-size="23" font-weight="750" letter-spacing="3">CRITIC · VALUE</text>

    <g>
      <rect x="96" y="315" width="126" height="108" rx="18" fill="#142b38" stroke="#40d8b5" stroke-width="2"/>
      <text x="159" y="348" text-anchor="middle" fill="#9cb7c8" font-size="15" font-weight="650" letter-spacing="1">ACTOR OBS</text>
      <text x="159" y="391" text-anchor="middle" fill="#f7fbff" font-size="39" font-weight="800">45</text>
      <text x="159" y="414" text-anchor="middle" fill="#76e9cf" font-size="13">features</text>

      <line x1="236" y1="369" x2="285" y2="369" stroke="#59e5c5" stroke-width="4" marker-end="url(#arrowActor)"/>

      <rect x="300" y="315" width="126" height="108" rx="18" fill="#153342" stroke="#40d8b5" stroke-width="2"/>
      <text x="363" y="354" text-anchor="middle" fill="#f7fbff" font-size="19" font-weight="750">ACTOR</text>
      <text x="363" y="384" text-anchor="middle" fill="#9cb7c8" font-size="14">MLP / RNN</text>
      <circle cx="340" cy="402" r="5" fill="#61e5c5"/>
      <circle cx="363" cy="402" r="5" fill="#61e5c5"/>
      <circle cx="386" cy="402" r="5" fill="#61e5c5"/>

      <line x1="440" y1="369" x2="489" y2="369" stroke="#59e5c5" stroke-width="4" marker-end="url(#arrowActor)"/>

      <rect x="504" y="315" width="42" height="108" rx="18" fill="#183e45" stroke="#40d8b5" stroke-width="2"/>
      <text x="525" y="353" text-anchor="middle" fill="#9cb7c8" font-size="14">μ</text>
      <text x="525" y="390" text-anchor="middle" fill="#f7fbff" font-size="28" font-weight="800">12</text>
      <text x="525" y="414" text-anchor="middle" fill="#76e9cf" font-size="11">action</text>

      <rect x="96" y="456" width="450" height="58" rx="15" fill="#102936"/>
      <text x="321" y="492" text-anchor="middle" fill="#d9f8f0" font-size="22" font-weight="650">45 → μ 12 · σ 12 → action 12</text>
    </g>

    <g>
      <rect x="654" y="315" width="126" height="108" rx="18" fill="#15293d" stroke="#6daeff" stroke-width="2"/>
      <text x="717" y="344" text-anchor="middle" fill="#9cb7c8" font-size="13" font-weight="650" letter-spacing="0.7">PRIVILEGED</text>
      <text x="717" y="363" text-anchor="middle" fill="#9cb7c8" font-size="13" font-weight="650" letter-spacing="0.7">OBS</text>
      <text x="717" y="397" text-anchor="middle" fill="#f7fbff" font-size="36" font-weight="800">48</text>
      <text x="717" y="416" text-anchor="middle" fill="#9bc7ff" font-size="11">features</text>

      <line x1="794" y1="369" x2="843" y2="369" stroke="#82baff" stroke-width="4" marker-end="url(#arrowCritic)"/>

      <rect x="858" y="315" width="126" height="108" rx="18" fill="#183149" stroke="#6daeff" stroke-width="2"/>
      <text x="921" y="354" text-anchor="middle" fill="#f7fbff" font-size="19" font-weight="750">CRITIC</text>
      <text x="921" y="384" text-anchor="middle" fill="#9cb7c8" font-size="14">VALUE MLP</text>
      <circle cx="898" cy="402" r="5" fill="#82baff"/>
      <circle cx="921" cy="402" r="5" fill="#82baff"/>
      <circle cx="944" cy="402" r="5" fill="#82baff"/>

      <line x1="998" y1="369" x2="1047" y2="369" stroke="#82baff" stroke-width="4" marker-end="url(#arrowCritic)"/>

      <rect x="1062" y="315" width="42" height="108" rx="18" fill="#1a3452" stroke="#6daeff" stroke-width="2"/>
      <text x="1083" y="353" text-anchor="middle" fill="#9cb7c8" font-size="14">V</text>
      <text x="1083" y="390" text-anchor="middle" fill="#f7fbff" font-size="28" font-weight="800">1</text>
      <text x="1083" y="414" text-anchor="middle" fill="#9bc7ff" font-size="11">value</text>

      <rect x="654" y="456" width="450" height="58" rx="15" fill="#11283f"/>
      <text x="879" y="492" text-anchor="middle" fill="#e1edff" font-size="22" font-weight="650">48 → V(s) 1 · training only</text>
    </g>

    <rect x="62" y="584" width="1076" height="2" fill="#8aa4bd" opacity="0.18"/>
    <text x="72" y="625" fill="#9fb4c7" font-size="17" letter-spacing="1.2">ASYMMETRIC ACTOR–CRITIC · 12 ACTUATED JOINTS · PPO</text>
    <text x="1128" y="625" text-anchor="end" fill="#dbe8f4" font-size="17" font-weight="700">45 → 12  |  48 → 1</text>
  </g>
</svg>
