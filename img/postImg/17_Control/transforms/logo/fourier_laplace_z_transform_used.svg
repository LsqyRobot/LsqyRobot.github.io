<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">傅里叶变换、拉普拉斯变换与 Z 变换笔记封面</title>
  <desc id="cover-desc">深色工程风格背景。左右两侧分别用动画展示拉普拉斯变换的虚轴与 Z 变换的单位圆，中部留出低干扰区域供网页叠加文章标题，底部连接采样映射 z 等于 e 的 sT 次方。关闭动画时仍保留完整静态关系。</desc>
  <defs>
    <linearGradient id="cover-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131d"/>
      <stop offset="0.52" stop-color="#0b2230"/>
      <stop offset="1" stop-color="#102f3a"/>
    </linearGradient>
    <radialGradient id="cover-glow-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5e9ff7" stop-opacity=".34"/>
      <stop offset="1" stop-color="#5e9ff7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cover-glow-mint" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#67d7bf" stop-opacity=".28"/>
      <stop offset="1" stop-color="#67d7bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cover-title-safe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07131d" stop-opacity="0"/>
      <stop offset=".2" stop-color="#07131d" stop-opacity=".58"/>
      <stop offset=".5" stop-color="#07131d" stop-opacity=".82"/>
      <stop offset=".8" stop-color="#07131d" stop-opacity=".58"/>
      <stop offset="1" stop-color="#07131d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cover-map-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e9ff7"/>
      <stop offset="1" stop-color="#67d7bf"/>
    </linearGradient>
    <pattern id="cover-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b9d8de" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="cover-soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cover-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#02090e" flood-opacity=".38"/>
    </filter>
    <marker id="cover-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9Z" fill="#9fded2"/>
    </marker>
    <style>
      .cover-kicker{font:700 15px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.2em;fill:#79dfc9}
      .cover-axis-label{font:600 15px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#a8c1c8}
      .cover-formula{font:700 18px "Times New Roman","Noto Serif SC",serif;fill:#d8f5ef}
      .cover-small{font:600 13px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#89a8b1}
      .cover-panel{fill:#0b1b26;fill-opacity:.5;stroke:#aed5da;stroke-opacity:.13;stroke-width:1.5}
      .cover-axis{fill:none;stroke:#8ba5ad;stroke-opacity:.58;stroke-width:1.5}
      .cover-imaginary{fill:none;stroke:#f2bb66;stroke-width:3.2;stroke-linecap:round;filter:url(#cover-soft-glow)}
      .cover-unit{fill:none;stroke:#f2bb66;stroke-width:3.2;stroke-dasharray:7 7;filter:url(#cover-soft-glow)}
      .cover-wave-flow{animation:coverFlow 5s linear infinite}
      .cover-map-flow{animation:coverFlow 2.6s linear infinite}
      .cover-scan{animation:coverScan 7s ease-in-out infinite;filter:url(#cover-soft-glow)}
      .cover-orbit{transform-box:view-box;transform-origin:990px 408px;animation:coverOrbit 7s linear infinite;filter:url(#cover-soft-glow)}
      .cover-breathe{animation:coverBreathe 3.2s ease-in-out infinite}
      @keyframes coverFlow{to{stroke-dashoffset:-52}}
      @keyframes coverScan{0%,100%{transform:translateY(82px)}50%{transform:translateY(-82px)}}
      @keyframes coverOrbit{to{transform:rotate(360deg)}}
      @keyframes coverBreathe{0%,100%{opacity:.48}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.cover-wave-flow,.cover-map-flow,.cover-scan,.cover-orbit,.cover-breathe{animation:none!important}}
    </style>
  </defs>

  <rect width="1200" height="675" fill="url(#cover-bg)"/>
  <rect width="1200" height="675" fill="url(#cover-grid)"/>
  <ellipse cx="155" cy="390" rx="300" ry="290" fill="url(#cover-glow-blue)"/>
  <ellipse cx="1060" cy="395" rx="300" ry="290" fill="url(#cover-glow-mint)"/>
  <path d="M-20 565C120 500 210 615 345 544S570 480 690 548" fill="none" stroke="#5e9ff7" stroke-opacity=".3" stroke-width="2.5" stroke-dasharray="12 14" class="cover-wave-flow"/>
  <path d="M-10 595C115 530 234 630 350 580S565 535 680 590" fill="none" stroke="#67d7bf" stroke-opacity=".22" stroke-width="2" stroke-dasharray="8 16" class="cover-wave-flow"/>
  <path d="M0 142H1200M0 328H1200" fill="none" stroke="#d0e8ec" stroke-opacity=".035"/>
  <rect x="130" y="118" width="940" height="235" rx="80" fill="url(#cover-title-safe)"/>
  <text class="cover-kicker" x="600" y="78" text-anchor="middle" fill-opacity=".78">SIGNALS · SYSTEMS · CONTROL</text>
  <circle cx="538" cy="102" r="3" fill="#5e9ff7" fill-opacity=".62"/>
  <line x1="552" y1="102" x2="648" y2="102" stroke="#9bcbd3" stroke-opacity=".22"/>
  <circle cx="662" cy="102" r="3" fill="#67d7bf" fill-opacity=".62"/>

  <g filter="url(#cover-shadow)" aria-label="s 平面到 z 平面的低干扰映射背景">
    <rect class="cover-panel" x="48" y="284" width="326" height="270" rx="30"/>
    <rect class="cover-panel" x="826" y="284" width="326" height="270" rx="30"/>
  </g>

  <g aria-label="拉普拉斯变换 s 平面">
    <line class="cover-axis" x1="78" y1="408" x2="344" y2="408"/>
    <line class="cover-axis" x1="211" y1="304" x2="211" y2="527"/>
    <line class="cover-imaginary" x1="211" y1="309" x2="211" y2="522"/>
    <path d="M75 458C100 432 121 476 145 443S187 371 211 412 256 475 281 420 318 360 347 395" fill="none" stroke="#5e9ff7" stroke-width="2.2" stroke-opacity=".48" stroke-dasharray="9 9" class="cover-wave-flow"/>
    <g transform="translate(156 408)" stroke="#f0776d" stroke-opacity=".86" stroke-width="4" stroke-linecap="round">
      <path d="M-6-6L6 6M6-6L-6 6"/>
    </g>
    <g class="cover-scan">
      <circle cx="211" cy="408" r="13" fill="#f2bb66" fill-opacity=".16" class="cover-breathe"/>
      <circle cx="211" cy="408" r="5.5" fill="#ffd58c"/>
    </g>
    <text class="cover-axis-label" x="327" y="397">σ</text>
    <text class="cover-axis-label" x="222" y="322">jω</text>
    <text class="cover-small" x="76" y="538">s 平面 · 虚轴切片</text>
  </g>

  <g aria-label="Z 变换 z 平面">
    <line class="cover-axis" x1="856" y1="408" x2="1122" y2="408"/>
    <line class="cover-axis" x1="990" y1="304" x2="990" y2="527"/>
    <circle class="cover-unit" cx="990" cy="408" r="88"/>
    <circle cx="990" cy="408" r="60" fill="#67d7bf" fill-opacity=".045" stroke="#67d7bf" stroke-opacity=".2"/>
    <g transform="translate(1034 408)" stroke="#f0776d" stroke-opacity=".86" stroke-width="4" stroke-linecap="round">
      <path d="M-6-6L6 6M6-6L-6 6"/>
    </g>
    <g class="cover-orbit">
      <circle cx="1078" cy="408" r="13" fill="#f2bb66" fill-opacity=".16" class="cover-breathe"/>
      <circle cx="1078" cy="408" r="5.5" fill="#ffd58c"/>
    </g>
    <text class="cover-axis-label" x="1103" y="397">Re</text>
    <text class="cover-axis-label" x="1001" y="322">Im</text>
    <text class="cover-small" x="856" y="538">z 平面 · 单位圆切片</text>
  </g>

  <g aria-label="采样映射公式">
    <path d="M372 486C492 550 708 550 828 486" fill="none" stroke="url(#cover-map-gradient)" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#cover-arrow)" class="cover-map-flow"/>
    <rect x="533" y="514" width="134" height="43" rx="21.5" fill="#0c2631" stroke="#9fded2" stroke-opacity=".31"/>
    <text class="cover-formula" x="600" y="541" text-anchor="middle">z = e<tspan baseline-shift="super" font-size="12">sT</tspan></text>
  </g>

  <g aria-label="关键对应关系" transform="translate(356 594)">
    <rect width="488" height="48" rx="15" fill="#061019" fill-opacity=".6" stroke="#b6d6da" stroke-opacity=".12"/>
    <circle cx="26" cy="24" r="5" fill="#5e9ff7"/>
    <text class="cover-small" x="40" y="29">Re(s)&lt;0 ↔ |z|&lt;1</text>
    <circle cx="204" cy="24" r="5" fill="#f2bb66"/>
    <text class="cover-small" x="218" y="29">jω ↔ 单位圆</text>
    <circle cx="357" cy="24" r="5" fill="#67d7bf"/>
    <text class="cover-small" x="371" y="29">极点决定响应</text>
  </g>
</svg>
