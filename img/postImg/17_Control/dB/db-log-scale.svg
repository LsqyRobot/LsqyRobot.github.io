<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500">
  <defs><style>.bg{fill:#f8fafc}.title{font:700 28px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.txt{font:20px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#263248}.small{font:16px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#536078}.axis{stroke:#7a879d;stroke-width:3}.tick{stroke:#7a879d;stroke-width:2}.line{stroke:#3478f6;stroke-width:8;stroke-linecap:round}.dot{fill:#ff8a3d;stroke:#fff;stroke-width:4}.card{fill:#fff;stroke:#d9e1ec;stroke-width:2}</style></defs>
  <rect class="bg" width="960" height="500" rx="20"/>
  <text x="42" y="52" class="title">对数刻度：把巨大的动态范围压缩到可读范围</text>
  <rect x="42" y="82" width="876" height="154" rx="14" class="card"/>
  <text x="68" y="118" class="txt">线性声压刻度（Pa）</text>
  <line x1="75" y1="184" x2="880" y2="184" class="axis"/>
  <circle cx="76" cy="184" r="9" class="dot"/><circle cx="156" cy="184" r="9" class="dot"/><circle cx="880" cy="184" r="9" class="dot"/>
  <text x="64" y="216" class="small">20 μPa</text><text x="126" y="160" class="small">20 Pa</text><text x="831" y="216" class="small">200 Pa</text>
  <text x="338" y="160" class="small">绝大多数日常声音挤在左端</text>
  <rect x="42" y="260" width="876" height="190" rx="14" class="card"/>
  <text x="68" y="298" class="txt">声压级对数刻度（dB SPL）</text>
  <line x1="82" y1="368" x2="878" y2="368" class="line"/>
  <g class="tick"><line x1="82" y1="352" x2="82" y2="384"/><line x1="281" y1="352" x2="281" y2="384"/><line x1="480" y1="352" x2="480" y2="384"/><line x1="679" y1="352" x2="679" y2="384"/><line x1="878" y1="352" x2="878" y2="384"/></g>
  <g class="small" text-anchor="middle"><text x="82" y="415">0 dB</text><text x="281" y="415">35 dB</text><text x="480" y="415">70 dB</text><text x="679" y="415">105 dB</text><text x="878" y="415">140 dB</text></g>
  <text x="480" y="442" class="small" text-anchor="middle">相同距离代表相同的“倍数变化”，更容易观察和比较</text>
</svg>
