<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510">
  <defs><style>.bg{fill:#f8fafc}.title{font:700 28px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.head{font:700 23px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#fff}.txt{font:19px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#263248}.formula{font:700 24px Georgia,'Times New Roman',serif;fill:#172033}.small{font:16px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#536078}.card{fill:#fff;stroke:#d9e1ec;stroke-width:2}.blue{fill:#3478f6}.orange{fill:#ff8a3d}.line{stroke:#c8d2e1;stroke-width:2}</style></defs>
  <rect class="bg" width="960" height="510" rx="20"/><text x="42" y="52" class="title">什么时候用 10 lg，什么时候用 20 lg？</text>
  <rect x="42" y="84" width="420" height="232" rx="15" class="card"/><path d="M57 84h390a15 15 0 0 1 15 15v50H42V99a15 15 0 0 1 15-15" class="blue"/>
  <text x="252" y="125" text-anchor="middle" class="head">功率型量 P</text><text x="252" y="198" text-anchor="middle" class="formula">G = 10 lg(P₂ / P₁)</text><text x="74" y="244" class="txt">功率 ×2  →  +3.01 dB</text><text x="74" y="282" class="txt">功率 ×10 → +10 dB</text>
  <rect x="498" y="84" width="420" height="232" rx="15" class="card"/><path d="M513 84h390a15 15 0 0 1 15 15v50H498V99a15 15 0 0 1 15-15" class="orange"/>
  <text x="708" y="125" text-anchor="middle" class="head">幅值型量 X</text><text x="708" y="198" text-anchor="middle" class="formula">G = 20 lg(X₂ / X₁)</text><text x="530" y="244" class="txt">幅值 ×√2 → +3.01 dB</text><text x="530" y="282" class="txt">幅值 ×2   → +6.02 dB</text>
  <rect x="42" y="342" width="876" height="126" rx="15" class="card"/><text x="68" y="380" class="txt">为什么会多一个 2？</text><text x="68" y="418" class="formula">P ∝ X²  ⇒  10 lg(X₂/X₁)² = 20 lg(X₂/X₁)</text><line x1="680" y1="370" x2="680" y2="444" class="line"/><text x="704" y="398" class="small">前提：两次测量的阻抗相同</text><text x="704" y="428" class="small">否则应直接比较实际功率</text>
</svg>
