<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530">
  <defs><style>.bg{fill:#f8fafc}.title{font:700 28px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.unit{font:700 25px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#3478f6}.txt{font:19px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#263248}.small{font:16px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#536078}.card{fill:#fff;stroke:#d9e1ec;stroke-width:2}.tag{fill:#eaf2ff}</style></defs>
  <rect class="bg" width="960" height="530" rx="20"/><text x="42" y="52" class="title">带后缀的 dB：后缀说明“0 dB 等于什么”</text>
  <g><rect x="42" y="82" width="276" height="160" rx="15" class="card"/><rect x="60" y="100" width="98" height="42" rx="21" class="tag"/><text x="109" y="129" text-anchor="middle" class="unit">dB SPL</text><text x="60" y="178" class="txt">参考：20 μPa</text><text x="60" y="211" class="small">空气中的声压级</text></g>
  <g><rect x="342" y="82" width="276" height="160" rx="15" class="card"/><rect x="360" y="100" width="82" height="42" rx="21" class="tag"/><text x="401" y="129" text-anchor="middle" class="unit">dBm</text><text x="360" y="178" class="txt">参考：1 mW</text><text x="360" y="211" class="small">射频、光通信功率</text></g>
  <g><rect x="642" y="82" width="276" height="160" rx="15" class="card"/><rect x="660" y="100" width="82" height="42" rx="21" class="tag"/><text x="701" y="129" text-anchor="middle" class="unit">dBW</text><text x="660" y="178" class="txt">参考：1 W</text><text x="660" y="211" class="small">dBW = dBm − 30</text></g>
  <g><rect x="42" y="266" width="276" height="160" rx="15" class="card"/><rect x="60" y="284" width="82" height="42" rx="21" class="tag"/><text x="101" y="313" text-anchor="middle" class="unit">dBV</text><text x="60" y="362" class="txt">参考：1 V</text><text x="60" y="395" class="small">音频、电压测量</text></g>
  <g><rect x="342" y="266" width="276" height="160" rx="15" class="card"/><rect x="360" y="284" width="82" height="42" rx="21" class="tag"/><text x="401" y="313" text-anchor="middle" class="unit">dBu</text><text x="360" y="362" class="txt">参考：0.775 V</text><text x="360" y="395" class="small">专业音频（历史上对应 600 Ω）</text></g>
  <g><rect x="642" y="266" width="276" height="160" rx="15" class="card"/><rect x="660" y="284" width="92" height="42" rx="21" class="tag"/><text x="706" y="313" text-anchor="middle" class="unit">dBFS</text><text x="660" y="362" class="txt">参考：数字满量程</text><text x="660" y="395" class="small">常规信号 ≤ 0 dBFS</text></g>
  <text x="480" y="480" text-anchor="middle" class="txt">“3 dB”只表达比值；“3 dBm”则表达相对于 1 mW 的绝对功率级。</text>
</svg>
