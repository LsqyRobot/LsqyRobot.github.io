<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#637189"/></marker><style>.bg{fill:#f8fafc}.title{font:700 28px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.txt{font:20px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#263248}.big{font:700 25px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.small{font:16px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#536078}.box{fill:#fff;stroke:#3478f6;stroke-width:3}.sum{fill:#eaf2ff;stroke:#3478f6;stroke-width:3}.arrow{stroke:#637189;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="960" height="380" rx="20"/><text x="42" y="52" class="title">级联系统：线性域相乘，dB 域相加</text>
  <text x="42" y="162" class="txt">输入</text><line x1="90" y1="154" x2="142" y2="154" class="arrow"/>
  <rect x="150" y="105" width="170" height="98" rx="14" class="box"/><text x="235" y="143" text-anchor="middle" class="big">第 1 级</text><text x="235" y="177" text-anchor="middle" class="txt">×10 = +20 dB</text>
  <line x1="320" y1="154" x2="372" y2="154" class="arrow"/><rect x="380" y="105" width="170" height="98" rx="14" class="box"/><text x="465" y="143" text-anchor="middle" class="big">第 2 级</text><text x="465" y="177" text-anchor="middle" class="txt">×20 ≈ +26 dB</text>
  <line x1="550" y1="154" x2="602" y2="154" class="arrow"/><rect x="610" y="105" width="170" height="98" rx="14" class="box"/><text x="695" y="143" text-anchor="middle" class="big">第 3 级</text><text x="695" y="177" text-anchor="middle" class="txt">×5 ≈ +14 dB</text><line x1="780" y1="154" x2="840" y2="154" class="arrow"/><text x="850" y="162" class="txt">输出</text>
  <rect x="150" y="246" width="630" height="82" rx="14" class="sum"/><text x="465" y="280" text-anchor="middle" class="big">总增益：10 × 20 × 5 = 1000 倍</text><text x="465" y="311" text-anchor="middle" class="txt">20 dB + 26 dB + 14 dB ≈ 60 dB</text>
</svg>
