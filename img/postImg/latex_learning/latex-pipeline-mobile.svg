<svg xmlns="http://www.w3.org/2000/svg" width="380" height="890" viewBox="0 0 380 890" role="img" aria-labelledby="title desc">
  <title id="title">从 LaTeX 源文件到 PDF：手机阅读版</title>
  <desc id="desc">正文和图片进入 XeLaTeX，书目数据进入 Biber。latexmk 调度编译直至引用稳定，最后检查 PDF。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#61758c"/></marker></defs>
  <rect width="380" height="890" rx="16" fill="#fff"/>
  <g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#20344d" text-anchor="middle">
    <text x="190" y="40" font-size="27" font-weight="700">从源文件到 PDF</text>
    <text x="190" y="70" font-size="17" fill="#536b84">由 latexmk 自动调度</text>
    <rect x="16" y="102" width="104" height="70" rx="10" fill="#edf5ff" stroke="#98bbdf"/>
    <text x="68" y="132" font-size="21" font-weight="700">.tex</text>
    <text x="68" y="157" font-size="17">正文</text>
    <rect x="138" y="102" width="104" height="70" rx="10" fill="#edf8f5" stroke="#91c8b9"/>
    <text x="190" y="132" font-size="18" font-weight="700">.pdf / .png</text>
    <text x="190" y="157" font-size="17">插图</text>
    <rect x="260" y="102" width="104" height="70" rx="10" fill="#f3effb" stroke="#bba4db"/>
    <text x="312" y="132" font-size="21" font-weight="700">.bib</text>
    <text x="312" y="157" font-size="17">书目</text>
    <g fill="none" stroke="#61758c" stroke-width="2" stroke-linejoin="round">
      <path d="M68 172v21h109v22" marker-end="url(#arrow)"/>
      <path d="M190 172v21h-13"/>
      <path d="M312 172v20h42v241h-22" marker-end="url(#arrow)"/>
      <path d="M177 334v43" marker-end="url(#arrow)"/>
      <path d="M177 484v43" marker-end="url(#arrow)"/>
      <path d="M177 646v43" marker-end="url(#arrow)"/>
    </g>
    <rect x="26" y="220" width="302" height="114" rx="12" fill="#edf5ff" stroke="#9abddf"/>
    <text x="177" y="254" font-size="21" font-weight="700">XeLaTeX：第一遍排版</text>
    <text x="177" y="287" font-size="17">读取正文与图片</text>
    <text x="177" y="313" font-size="17">写出 .aux 与 .bcf</text>
    <rect x="26" y="382" width="302" height="102" rx="12" fill="#f3effb" stroke="#baa3d9"/>
    <text x="177" y="417" font-size="21" font-weight="700">Biber：整理参考文献</text>
    <text x="177" y="451" font-size="17">读取 .bib / .bcf → 生成 .bbl</text>
    <rect x="26" y="532" width="302" height="114" rx="12" fill="#edf5ff" stroke="#9abddf"/>
    <text x="177" y="566" font-size="21" font-weight="700">XeLaTeX：再次编译</text>
    <text x="177" y="599" font-size="17">读入 .bbl 并更新引用</text>
    <text x="177" y="625" font-size="17">按需继续编译，直到编号稳定</text>
    <rect x="26" y="694" width="302" height="102" rx="12" fill="#edf8f5" stroke="#93c8b9"/>
    <text x="177" y="728" font-size="21" font-weight="700">PDF：检查成品</text>
    <text x="177" y="762" font-size="17">核对图表、字体、引用与布局</text>
    <text x="190" y="840" font-size="17" fill="#536b84">修改源文件 → 重编译 → 再检查</text>
    <text x="190" y="868" font-size="16" fill="#61758c">文献链路：BibLaTeX + Biber</text>
  </g>
</svg>
