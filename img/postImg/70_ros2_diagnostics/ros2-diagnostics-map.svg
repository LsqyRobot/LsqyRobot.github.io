<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">ROS 2 排障学习地图</title>
<desc id="desc">先检查 ROS 图、QoS 和日志。崩溃或卡住用 GDB 看调用栈和变量；延迟或抖动用 tracing 看事件时间线。</desc>
<rect width="1200" height="600" rx="24" fill="#0f172a"/>
<g font-family="system-ui, sans-serif">
<text x="48" y="79" fill="#94a3b8" font-size="22" letter-spacing="4">ROS 2 / DIAGNOSTICS</text>
<text x="48" y="145" fill="#f8fafc" font-size="42" font-weight="700">从现象出发，用证据定位</text>
<rect x="48" y="196" width="344" height="242" rx="18" fill="#1e293b" stroke="#334155"/>
<text x="72" y="246" fill="#38bdf8" font-size="28" font-weight="700">01</text>
<text x="72" y="308" fill="#f8fafc" font-size="32" font-weight="700">先检查</text>
<text x="72" y="358" fill="#cbd5e1" font-size="23">ROS 图 · QoS · 日志</text>
<path d="M72 398 H362" stroke="#38bdf8" stroke-width="5"/>
<rect x="420" y="196" width="344" height="242" rx="18" fill="#1e293b" stroke="#334155"/>
<text x="444" y="246" fill="#a78bfa" font-size="28" font-weight="700">02</text>
<text x="444" y="308" fill="#f8fafc" font-size="32" font-weight="700">崩溃 / 卡住</text>
<text x="444" y="358" fill="#cbd5e1" font-size="23">GDB · 调用栈 · 变量</text>
<path d="M444 398 H734" stroke="#a78bfa" stroke-width="5"/>
<rect x="792" y="196" width="344" height="242" rx="18" fill="#1e293b" stroke="#334155"/>
<text x="816" y="246" fill="#34d399" font-size="28" font-weight="700">03</text>
<text x="816" y="308" fill="#f8fafc" font-size="32" font-weight="700">延迟 / 抖动</text>
<text x="816" y="358" fill="#cbd5e1" font-size="23">Tracing · 时间线</text>
<path d="M816 398 H1106" stroke="#34d399" stroke-width="5"/>
<text x="48" y="516" fill="#cbd5e1" font-size="26">复现条件 → 采集现场 → 解释结果 → 修复后复测</text>
<text x="48" y="559" fill="#94a3b8" font-size="20">Ubuntu 22.04 · ROS 2 Humble · C++ / rclcpp</text>
</g></svg>
