<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Rust 系统学习笔记封面</title>
  <desc id="desc">所有权、借用和错误处理三个模块组成一条从内存模型到工程实践的学习路径。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#26150f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f97316" stop-opacity=".34"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#f8fafc" stroke-opacity=".055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0l8 4-8 4z" fill="#fb923c"/>
    </marker>
  </defs>

  <rect width="1200" height="675" rx="32" fill="url(#background)"/>
  <rect width="1200" height="675" rx="32" fill="url(#grid)"/>
  <circle cx="928" cy="302" r="330" fill="url(#glow)"/>

  <g transform="translate(82 112)">
    <rect x="0" y="0" width="84" height="30" rx="15" fill="#f97316"/>
    <text x="42" y="21" text-anchor="middle" fill="#fff7ed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">V1 · 2024</text>
    <text x="0" y="102" fill="#fff7ed" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="760">Rust 系统学习笔记</text>
    <text x="2" y="153" fill="#fdba74" font-family="system-ui, -apple-system, sans-serif" font-size="27">从所有权模型走到可测试的 Cargo 工程</text>
    <text x="2" y="232" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">OWN → BORROW → RESULT → ASYNC → SHIP</text>
    <path d="M4 276H465" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
    <text x="2" y="326" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20">一条主线 · 一个练习项目 · 一组质量门禁</text>
  </g>

  <g transform="translate(710 118)" filter="url(#shadow)">
    <g transform="translate(0 0)">
      <rect width="360" height="104" rx="20" fill="#172033" stroke="#475569"/>
      <circle cx="50" cy="52" r="25" fill="#f97316"/>
      <text x="50" y="59" text-anchor="middle" fill="#fff" font-family="ui-monospace, monospace" font-size="20" font-weight="700">01</text>
      <text x="92" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Owner</text>
      <text x="92" y="72" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="15">String · Vec&lt;T&gt; · move</text>
    </g>
    <path d="M180 108v32" stroke="#fb923c" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(0 150)">
      <rect width="360" height="104" rx="20" fill="#172033" stroke="#475569"/>
      <circle cx="50" cy="52" r="25" fill="#ea580c"/>
      <text x="50" y="59" text-anchor="middle" fill="#fff" font-family="ui-monospace, monospace" font-size="20" font-weight="700">02</text>
      <text x="92" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Borrow</text>
      <text x="92" y="72" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="15">&amp;T · &amp;mut T · 'a</text>
    </g>
    <path d="M180 258v32" stroke="#fb923c" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(0 300)">
      <rect width="360" height="104" rx="20" fill="#172033" stroke="#475569"/>
      <circle cx="50" cy="52" r="25" fill="#c2410c"/>
      <text x="50" y="59" text-anchor="middle" fill="#fff" font-family="ui-monospace, monospace" font-size="20" font-weight="700">03</text>
      <text x="92" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Result</text>
      <text x="92" y="72" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="15">Option&lt;T&gt; · Result&lt;T, E&gt;</text>
    </g>
  </g>

  <text x="82" y="620" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">BEYOND THE MEMORY · SYSTEMS / RUST</text>
</svg>
