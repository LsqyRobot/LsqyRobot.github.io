<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Rust 所有权、共享借用、可变借用和移动关系图</title>
  <desc id="desc">值先由 samples 拥有；只读阶段允许多个共享引用；写入阶段只允许一个可变引用；所有权移动后旧绑定不可继续使用。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0l8 4-8 4z" fill="#c2410c"/>
    </marker>
    <marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0l8 4-8 4z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="520" rx="24" fill="url(#bg)"/>
  <text x="56" y="60" fill="#0f172a" font-family="system-ui, sans-serif" font-size="28" font-weight="700">同一个值，在不同阶段只有清晰的一种访问规则</text>

  <g font-family="system-ui, sans-serif">
    <g transform="translate(54 108)">
      <rect width="184" height="258" rx="18" fill="#fff" stroke="#fb923c" stroke-width="2"/>
      <circle cx="92" cy="60" r="31" fill="#f97316"/>
      <text x="92" y="69" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">值</text>
      <text x="92" y="123" text-anchor="middle" fill="#7c2d12" font-size="19" font-weight="700">samples</text>
      <text x="92" y="151" text-anchor="middle" fill="#64748b" font-family="ui-monospace, monospace" font-size="14">Vec&lt;Sample&gt;</text>
      <path d="M36 178h112" stroke="#fed7aa"/>
      <text x="92" y="213" text-anchor="middle" fill="#334155" font-size="16">负责最终释放</text>
      <text x="92" y="239" text-anchor="middle" fill="#334155" font-size="16">当前 owner</text>
    </g>

    <path d="M246 238h62" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="277" y="218" text-anchor="middle" fill="#9a3412" font-size="14">borrow</text>

    <g transform="translate(320 108)">
      <rect width="260" height="258" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
      <text x="130" y="43" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="700">读阶段：共享借用</text>
      <rect x="31" y="78" width="84" height="60" rx="12" fill="#e2e8f0"/>
      <text x="73" y="115" text-anchor="middle" fill="#334155" font-family="ui-monospace, monospace" font-size="17">&amp;T</text>
      <rect x="145" y="78" width="84" height="60" rx="12" fill="#e2e8f0"/>
      <text x="187" y="115" text-anchor="middle" fill="#334155" font-family="ui-monospace, monospace" font-size="17">&amp;T</text>
      <text x="130" y="178" text-anchor="middle" fill="#475569" font-size="16">允许多个 reader</text>
      <path d="M34 199h192" stroke="#e2e8f0"/>
      <text x="130" y="230" text-anchor="middle" fill="#64748b" font-size="15">借用不负责释放值</text>
    </g>

    <path d="M588 238h62" stroke="#64748b" stroke-width="3" marker-end="url(#gray-arrow)"/>
    <text x="619" y="218" text-anchor="middle" fill="#475569" font-size="14">next scope</text>

    <g transform="translate(662 108)">
      <rect width="244" height="258" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/>
      <text x="122" y="43" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="700">写阶段：独占借用</text>
      <rect x="72" y="78" width="100" height="60" rx="12" fill="#ffedd5"/>
      <text x="122" y="115" text-anchor="middle" fill="#9a3412" font-family="ui-monospace, monospace" font-size="17">&amp;mut T</text>
      <text x="122" y="178" text-anchor="middle" fill="#7c2d12" font-size="16">同一时刻只有一个</text>
      <path d="M28 199h188" stroke="#fed7aa"/>
      <text x="122" y="230" text-anchor="middle" fill="#64748b" font-size="15">结束后 owner 继续可用</text>
    </g>
  </g>

  <path d="M146 390v48h650" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="470" y="429" text-anchor="middle" fill="#9a3412" font-family="ui-monospace, monospace" font-size="15">move: consume(samples)</text>
  <text x="480" y="478" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="17">移动之后由新绑定负责释放；旧绑定不能再访问该值</text>
</svg>
