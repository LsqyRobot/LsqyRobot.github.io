<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="robogauge-score-title robogauge-score-desc">
  <title id="robogauge-score-title">RoboGauge：从逐时刻指标到综合评分</title>
  <desc id="robogauge-score-desc">评估代码的运算顺序：固定地形、难度和随机化设置，每个时间样本的八项指标先归一化，再做加权几何均值。每个 seed 的 max_velocity 和 diagonal_velocity 两个 goal family 分别取质量最差百分之五十的时间样本平均，再将两类 family 等权平均，最后将三个 seed 等权平均得到 Q。最差百分之五十是按质量排序后的较差半数，不是一个连续时间窗口。另通过难度搜索得到最高可通过难度 L 星。非平地且通过的 L 星至少为一时，S 等于零点零九乘 L 星减一加零点一九乘质量 Q；平地 S 等于 Q；非平地 L 星等于零时 S 等于零。最后对随机化设置及七个地形配置作算术平均。几何均值与最差一半的聚合不能随意交换先后。</desc>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#607987"/></marker>
    <marker id="training-tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#866f91"/></marker>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #243b46; }
      .title { font-size: 27px; font-weight: 600; }
      .subtitle, .note { font-size: 17px; fill: #536975; }
      .label { font-size: 20px; font-weight: 500; }
      .detail { font-size: 18px; fill: #536975; }
      .small { font-size: 16px; fill: #536975; }
      .formula { font-size: 23px; font-weight: 500; fill: #245565; }
      .node { fill: #f5f9fb; stroke: #c6d6df; stroke-width: 1.3; }
      .accent { fill: #eef7f7; stroke: #9ec2c6; stroke-width: 1.3; }
      .training { fill: #faf7fc; stroke: #b7a5bf; stroke-width: 1.3; stroke-dasharray: 5 4; }
      .arrow, .training-arrow { fill: none; stroke: #607987; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
      .training-arrow { stroke: #866f91; stroke-dasharray: 6 5; }
      .divider { stroke: #e4ebef; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1000" height="650" fill="#ffffff"/>
  <text x="30" y="43" class="title" text-anchor="start">RoboGauge：从逐时刻指标到综合评分</text>
  <text x="30" y="76" class="subtitle" text-anchor="start">评估代码的运算顺序 · 先计算每个时间样本的质量，再强调其中的困难片段</text>
  <path d="M 30 97 H 970" class="divider"/>
  <path d="M 235 190 H 275" class="arrow" marker-end="url(#tip)"/>
  <path d="M 485 190 H 525" class="arrow" marker-end="url(#tip)"/>
  <path d="M 745 190 H 785" class="arrow" marker-end="url(#tip)"/>
  <path d="M 132 250 V 365" class="arrow" marker-end="url(#tip)"/>
  <path d="M 270 415 H 365" class="arrow" marker-end="url(#tip)"/>
  <path d="M 877 250 V 307 H 580 V 365" class="arrow" marker-end="url(#tip)"/>
  <path d="M 572 495 V 540" class="arrow" marker-end="url(#tip)"/>
  <rect x="30" y="130" width="205" height="120" rx="8" class="node"/>
  <text x="132" y="165" class="label" text-anchor="middle">1. 单个测试条件</text>
  <text x="132" y="198" class="detail" text-anchor="middle">地形 × 难度</text>
  <text x="132" y="228" class="detail" text-anchor="middle">× 随机化设置</text>
  <rect x="275" y="130" width="210" height="120" rx="8" class="node"/>
  <text x="380" y="166" class="label" text-anchor="middle">2. 归一化</text>
  <text x="380" y="199" class="detail" text-anchor="middle">8 项评估指标</text>
  <text x="380" y="229" class="small" text-anchor="middle">每个时间样本分别处理</text>
  <rect x="525" y="130" width="220" height="120" rx="8" class="accent"/>
  <text x="635" y="166" class="label" text-anchor="middle">3. 逐时刻质量</text>
  <text x="635" y="199" class="detail" text-anchor="middle">加权几何均值 q(t)</text>
  <text x="635" y="229" class="small" text-anchor="middle">此时尚未跨时间平均</text>
  <rect x="785" y="130" width="185" height="120" rx="8" class="accent"/>
  <text x="877" y="165" class="label" text-anchor="middle">4. 困难片段汇总</text>
  <text x="877" y="196" class="small" text-anchor="middle">各 family 内最差 50%</text>
  <text x="877" y="226" class="detail" text-anchor="middle">较差半数的均值</text>
  <rect x="30" y="365" width="240" height="100" rx="8" class="node"/>
  <text x="150" y="401" class="label" text-anchor="middle">难度搜索</text>
  <text x="150" y="436" class="detail" text-anchor="middle">最高可通过难度 L*</text>
  <text x="53" y="313" class="small" text-anchor="start">搜索可通过等级</text>
  <text x="287" y="402" class="label" text-anchor="start">L*</text>
  <text x="594" y="333" class="label" text-anchor="start">质量 Q</text>
  <text x="594" y="355" class="small" text-anchor="start">2 family → 3 seed，均为等权平均</text>
  <rect x="365" y="365" width="415" height="130" rx="8" class="accent"/>
  <text x="572" y="399" class="label" text-anchor="middle">5. 非平地通过 L* ≥ 1</text>
  <text x="572" y="437" class="formula" text-anchor="middle">S = 0.09 (L* − 1) + 0.19 Q</text>
  <text x="572" y="477" class="small" text-anchor="middle">平地：S = Q；非平地 L* = 0：S = 0</text>
  <rect x="260" y="540" width="625" height="65" rx="8" class="node"/>
  <text x="572" y="566" class="label" text-anchor="middle">6. 汇总测试结果</text>
  <text x="572" y="592" class="detail" text-anchor="middle">随机化设置与 7 个地形配置：算术平均</text>
  <text x="30" y="632" class="note" text-anchor="start">最差 50% 是按质量排序的较差半数，不是连续时间窗；几何聚合与时间平均也不能交换顺序。</text>
</svg>
