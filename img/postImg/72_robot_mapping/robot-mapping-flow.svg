<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">四足与无人机共用雷达 IMU 建图组件</title>
<desc id="desc">Go2 与四旋翼经不同传感器话题和安装外参，输入同一个 ros2_mapping 与 Cartographer 3D，输出点云地图和估计轨迹。当前为传感器回放，地图未反馈控制。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5ee1c4"/></marker></defs>
<rect width="1200" height="675" rx="24" fill="#0c1728"/>
<g font-family="sans-serif" fill="#edf5ff">
<text x="54" y="80" font-size="40" font-weight="700">四足 × 无人机：同一个建图组件</text>
<text x="54" y="126" font-size="23" fill="#adbed4">适配传感器输入，复用地图估计</text>
<rect x="54" y="186" width="300" height="130" rx="16" fill="#1d354a"/>
<text x="80" y="234" font-size="30">Go2 四足</text><text x="80" y="275" font-size="21" fill="#c1d7e6">话题 / 坐标系 / 安装外参</text>
<rect x="54" y="365" width="300" height="130" rx="16" fill="#1d354a"/>
<text x="80" y="413" font-size="30">四旋翼无人机</text><text x="80" y="454" font-size="21" fill="#c1d7e6">话题 / 坐标系 / 安装外参</text>
<rect x="435" y="245" width="334" height="200" rx="16" fill="#214b43"/>
<text x="465" y="288" font-size="21" fill="#9fe8d5">PointCloud2 + Imu + TF</text>
<text x="465" y="341" font-size="31" font-weight="700">ros2_mapping</text>
<text x="465" y="393" font-size="25">Cartographer 3D</text>
<rect x="851" y="245" width="294" height="200" rx="16" fill="#1d354a"/>
<text x="879" y="304" font-size="29">三维地图</text><text x="879" y="353" font-size="29">估计轨迹</text><text x="879" y="402" font-size="21" fill="#c1d7e6">PLY / PBSTREAM / CSV</text>
<text x="54" y="565" font-size="24" fill="#5ee1c4">同一建图入口 · 两套机器人配置 · 两段实际 SLAM 视频</text>
<text x="54" y="615" font-size="21" fill="#adbed4">MuJoCo 运动记录 + 虚拟传感器回放；本轮不含估计反馈控制</text>
</g>
