<svg xmlns="http://www.w3.org/2000/svg" width="900" height="780" viewBox="0 0 900 780" role="img" aria-labelledby="measurement-chain-title measurement-chain-description"><title id="measurement-chain-title">测量链：先过滤带外，再解释带内</title><desc id="measurement-chain-description">传感器 → 模拟反混叠 → ADC → 频谱 / 阶次；转速与振动应同步。</desc><defs><marker id="measurement-chain-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#425d72"/></marker></defs><rect width="900" height="100%" fill="#fff"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="40" y="50" font-size="28" fill="#142c42" text-anchor="start" font-weight="700">测量链：先过滤带外，再解释带内</text><text x="40" y="82" font-size="18" fill="#425d72" text-anchor="start" font-weight="400">传感器 → 模拟反混叠 → ADC → 频谱 / 阶次；转速与振动应同步。</text><text x="40" y="125" font-size="21" fill="#142c42" text-anchor="start" font-weight="650">带外分量必须在会产生混叠的采样之前受到抑制。</text><rect x="40" y="160" width="160" height="125" rx="12" fill="#edf5fc" stroke="#70899b" stroke-width="2"/><text x="120" y="197" font-size="20" fill="#142c42" text-anchor="middle" font-weight="650">加速度传感器</text><text x="120" y="229" font-size="18" fill="#142c42" text-anchor="middle" font-weight="400">安装 / 量程</text><text x="120" y="261" font-size="18" fill="#142c42" text-anchor="middle" font-weight="400">模拟振动信号</text><rect x="235" y="160" width="190" height="125" rx="12" fill="#edf7ef" stroke="#70899b" stroke-width="2"/><text x="330" y="197" font-size="20" fill="#142c42" text-anchor="middle" font-weight="650">模拟反混叠滤波</text><text x="330" y="229" font-size="18" fill="#142c42" text-anchor="middle" font-weight="400">保留目标通带</text><text x="330" y="261" font-size="18" fill="#142c42" text-anchor="middle" font-weight="400">抑制带外分量</text><rect x="465" y="160" width="150" height="125" rx="12" fill="#edf5fc" stroke="#70899b" stroke-width="2"/><text x="540" y="197" font-size="20" fill="#142c42" text-anchor="middle" font-weight="650">ADC</text><text x="540" y="229" font-size="18" fill="#142c42" text-anchor="middle" font-weight="400">采样率 fs</text><text x="540" y="261" font-size="18" fill="#142c42" text-anchor="middle" font-weight="400">原始时域记录</text><rect x="655" y="160" width="205" height="125" rx="12" fill="#fff3e8" stroke="#70899b" stroke-width="2"/><text x="757.5" y="197" font-size="20" fill="#142c42" text-anchor="middle" font-weight="650">窗 / FFT / 阶次</text><text x="757.5" y="229" font-size="18" fill="#142c42" text-anchor="middle" font-weight="400">频带 / 幅值标度</text><text x="757.5" y="261" font-size="18" fill="#142c42" text-anchor="middle" font-weight="400">时域与工况对照</text><line x1="204" y1="222" x2="227" y2="222" stroke="#425d72" stroke-width="2.5" marker-end="url(#measurement-chain-arrow)"/><line x1="429" y1="222" x2="457" y2="222" stroke="#425d72" stroke-width="2.5" marker-end="url(#measurement-chain-arrow)"/><line x1="619" y1="222" x2="647" y2="222" stroke="#425d72" stroke-width="2.5" marker-end="url(#measurement-chain-arrow)"/><rect x="40" y="330" width="215" height="85" rx="12" fill="#edf7ef" stroke="#70899b" stroke-width="2"/><text x="147" y="365" font-size="20" fill="#142c42" text-anchor="middle" font-weight="650">转速脉冲 / 编码器</text><text x="147" y="395" font-size="19" fill="#142c42" text-anchor="middle" font-weight="400">共同时间基准</text><path d="M260 372 L540 372 L540 293" fill="none" stroke="#425d72" stroke-width="2.5" marker-end="url(#measurement-chain-arrow)"/><text x="275" y="358" font-size="20" fill="#142c42" text-anchor="start" font-weight="400">同步采集转速与振动</text><text x="585" y="361" font-size="20" fill="#142c42" text-anchor="start" font-weight="400">阶次分析使用</text><text x="585" y="393" font-size="20" fill="#142c42" text-anchor="start" font-weight="400">同步转速 / 角度</text><rect x="40" y="450" width="820" height="235" rx="12" fill="#fff" stroke="#70899b" stroke-width="2"/><text x="60" y="485" font-size="20" fill="#142c42" text-anchor="start" font-weight="650">反混叠未生效的例子：fs = 2000 Hz，奈奎斯特频率 = 1000 Hz</text><line x1="100" y1="610" x2="822" y2="610" stroke="#425d72" stroke-width="2.5" marker-end="url(#measurement-chain-arrow)"/><line x1="460" y1="514" x2="460" y2="619" stroke="#70899b" stroke-width="2" stroke-dasharray="6 5"/><line x1="208" y1="610" x2="208" y2="548" stroke="#1667a2" stroke-width="4" /><line x1="712" y1="610" x2="712" y2="548" stroke="#a94b12" stroke-width="4" /><text x="208" y="535" font-size="20" fill="#1667a2" text-anchor="middle" font-weight="650">看到 300 Hz</text><text x="712" y="535" font-size="20" fill="#a94b12" text-anchor="middle" font-weight="650">原信号 1700 Hz</text><path d="M712 565 Q460 498 208 565" fill="none" stroke="#425d72" stroke-width="2.5" marker-end="url(#measurement-chain-arrow)"/><text x="100" y="640" font-size="18" fill="#142c42" text-anchor="middle" font-weight="400">0</text><text x="208" y="640" font-size="18" fill="#142c42" text-anchor="middle" font-weight="400">300</text><text x="460" y="640" font-size="18" fill="#142c42" text-anchor="middle" font-weight="400">1000</text><text x="712" y="640" font-size="18" fill="#142c42" text-anchor="middle" font-weight="400">1700</text><text x="820" y="640" font-size="18" fill="#142c42" text-anchor="middle" font-weight="400">2000</text><text x="800" y="665" font-size="18" fill="#142c42" text-anchor="end" font-weight="400">频率 / Hz</text><text x="60" y="665" font-size="19" fill="#425d72" text-anchor="start" font-weight="400">1700 → |1700 − 2000| = 300 Hz；采样后低通不能恢复它的原身份。</text><text x="40" y="710" font-size="19" fill="#142c42" text-anchor="start" font-weight="400">有效分析依赖传感器、滤波、采样、记录长度、窗和同步条件共同成立。</text><text x="40" y="761" font-size="17" fill="#425d72" text-anchor="start" font-weight="400">振动与减振 · 机制示意，非实测结果 · 可复现 SVG</text></g></svg>
