<svg xmlns="http://www.w3.org/2000/svg" width="900" height="705" viewBox="0 0 900 705" role="img" aria-labelledby="title description">
<title id="title">柔性伺服：反馈测到了哪里，控制就看到了哪里</title><desc id="description">指令进入位置、速度和电流回路，电机惯量经弹性、阻尼及可选背隙驱动负载与工具。电机编码器反馈回到位置和速度回路，负载编码器和工具加速度提供独立观测。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="context-stroke"/></marker></defs>
<rect width="900" height="705" fill="#fff"/>
<g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="47" font-size="29" fill="#17354b" text-anchor="start" font-weight="700">柔性伺服：反馈测到了哪里，控制就看到了哪里</text><text x="35" y="82" font-size="18" fill="#485f70" text-anchor="start" font-weight="400">减速比折算到同一侧；框图表示信号与传动关系，不表示驱动器内部的全部环节。</text><path d="M855,518H885V130H280V150" fill="none" stroke="#185a96" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#arrow)"/><path d="M470,130L470,150" fill="none" stroke="#185a96" stroke-width="2.5" marker-end="url(#arrow)"/><text x="365" y="113" font-size="18" fill="#185a96" text-anchor="start" font-weight="600">电机反馈 qₘ / ωₘ</text><rect x="35" y="150" width="120" height="90" rx="10" fill="#eef5fb" stroke="#7596af" stroke-width="2"/><text x="95" y="186" font-size="21" fill="#17354b" text-anchor="middle" font-weight="650">指令规划</text><text x="95" y="220" font-size="16" fill="#485f70" text-anchor="middle" font-weight="400">q* / v* / a*</text><rect x="215" y="150" width="130" height="90" rx="10" fill="#eef5fb" stroke="#7596af" stroke-width="2"/><text x="280" y="186" font-size="21" fill="#17354b" text-anchor="middle" font-weight="650">位置回路</text><text x="280" y="220" font-size="16" fill="#485f70" text-anchor="middle" font-weight="400">位置误差 → ω*</text><rect x="405" y="150" width="130" height="90" rx="10" fill="#eef5fb" stroke="#7596af" stroke-width="2"/><text x="470" y="186" font-size="21" fill="#17354b" text-anchor="middle" font-weight="650">速度回路</text><text x="470" y="220" font-size="16" fill="#485f70" text-anchor="middle" font-weight="400">速度误差 → τ*</text><rect x="595" y="150" width="130" height="90" rx="10" fill="#eef5fb" stroke="#7596af" stroke-width="2"/><text x="660" y="186" font-size="21" fill="#17354b" text-anchor="middle" font-weight="650">电流回路</text><text x="660" y="220" font-size="16" fill="#485f70" text-anchor="middle" font-weight="400">内部电流反馈</text><path d="M155,194L215,194" fill="none" stroke="#17354b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M345,194L405,194" fill="none" stroke="#17354b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M535,194L595,194" fill="none" stroke="#17354b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M725,194H815V330" fill="none" stroke="#17354b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="753" y="179" font-size="22" fill="#17354b" text-anchor="start" font-weight="600">τₘ</text><text x="35" y="292" font-size="21" fill="#17354b" text-anchor="start" font-weight="650">机械传动：电机端运动与负载端运动可能不同</text><rect x="705" y="330" width="150" height="100" rx="10" fill="#eef5fb" stroke="#7596af" stroke-width="2"/><text x="780" y="368" font-size="20" fill="#17354b" text-anchor="middle" font-weight="650">电机惯量 Jₘ</text><text x="780" y="404" font-size="19" fill="#185a96" text-anchor="middle" font-weight="400">θₘ / ωₘ</text><rect x="440" y="330" width="210" height="100" rx="10" fill="#fff5e8" stroke="#ba8555" stroke-width="2"/><text x="545" y="359" font-size="20" fill="#17354b" text-anchor="middle" font-weight="650">弹性 kₜ + 阻尼 cₜ</text><text x="545" y="391" font-size="18" fill="#a24b12" text-anchor="middle" font-weight="400">可另建背隙 / 接触</text><text x="545" y="417" font-size="16" fill="#485f70" text-anchor="middle" font-weight="400">储能、释能与换向冲击</text><rect x="215" y="330" width="150" height="100" rx="10" fill="#eff8f3" stroke="#71a58d" stroke-width="2"/><text x="290" y="368" font-size="20" fill="#17354b" text-anchor="middle" font-weight="650">负载惯量 Jₗ</text><text x="290" y="404" font-size="19" fill="#14684b" text-anchor="middle" font-weight="400">θₗ / ωₗ</text><rect x="35" y="330" width="120" height="100" rx="10" fill="#eff8f3" stroke="#71a58d" stroke-width="2"/><text x="95" y="370" font-size="18" fill="#17354b" text-anchor="middle" font-weight="650">工具 / 末端</text><text x="95" y="404" font-size="16" fill="#485f70" text-anchor="middle" font-weight="400">位移 / 加速度</text><path d="M705,380L650,380" fill="none" stroke="#17354b" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M440,380L365,380" fill="none" stroke="#17354b" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M215,380L155,380" fill="none" stroke="#17354b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M780,430L780,485" fill="none" stroke="#185a96" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="710" y="485" width="145" height="65" rx="10" fill="#eef5fb" stroke="#7596af" stroke-width="2"/><text x="782.5" y="511" font-size="18" fill="#185a96" text-anchor="middle" font-weight="600">电机编码器</text><text x="782.5" y="538" font-size="18" fill="#185a96" text-anchor="middle" font-weight="400">qₘ / ωₘ</text><path d="M95,430L95,485" fill="none" stroke="#14684b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M290,430L290,485" fill="none" stroke="#14684b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="485" width="365" height="76" rx="10" fill="#eff8f3" stroke="#71a58d" stroke-width="2"/><text x="52" y="513" font-size="20" fill="#14684b" text-anchor="start" font-weight="600">独立观测：负载编码器</text><text x="52" y="546" font-size="19" fill="#14684b" text-anchor="start" font-weight="400">工具 / 外壳加速度传感器</text><text x="35" y="593" font-size="18" fill="#485f70" text-anchor="start" font-weight="400">外部测量用于核验；这里没有默认把它接入反馈回路。</text><rect x="35" y="615" width="820" height="65" rx="10" fill="#fff5e8" stroke="#ba8555" stroke-width="2"/><text x="445" y="655" font-size="23" fill="#a24b12" text-anchor="middle" font-weight="650">电机端安静 ≠ 末端安静：应同时检查负载与结构响应。</text></g></svg>
