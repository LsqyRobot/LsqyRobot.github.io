<svg xmlns="http://www.w3.org/2000/svg" width="850" height="320" viewBox="0 0 850 320" role="img" aria-labelledby="title description">
<title id="title">基座激励：绝对位移与相对变形要分开</title><desc id="description">移动基座通过并联弹簧 k 与阻尼器 c 连接质量 m。基座绝对位移为 y(t)，质量绝对位移为 x(t)，两者都相对各自静态平衡位置计量；弹簧和阻尼器的相对变形增量为 z=x-y。</desc>
<defs><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1c65a0"/></marker><marker id="orange-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a94d08"/></marker></defs>
<rect width="850" height="320" fill="#fff"/>
<g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">
<text x="24" y="33" font-size="24" fill="#19334a" text-anchor="start" font-weight="700">基座激励：绝对位移与相对变形要分开</text><line x1="80" y1="98" x2="80" y2="247" stroke="#8395a4" stroke-width="2" stroke-dasharray="6 5"/><text x="80" y="267" font-size="16" fill="#4b6173" text-anchor="middle" font-weight="400">y=0</text><rect x="121" y="109" width="19" height="137" rx="0" fill="#dce4eb" stroke="#486276" stroke-width="3"/><line x1="80" y1="80" x2="140" y2="80" stroke="#1c65a0" stroke-width="3" marker-end="url(#blue-arrow)"/><text x="110" y="64" font-size="20" fill="#1c65a0" text-anchor="middle" font-weight="600">y(t)</text><polyline points="140,137 188,137 196,126 214,148 232,126 250,148 268,126 286,148 304,126 322,148 340,126 358,148 376,126 394,148 412,126 420,137 500,137" fill="none" stroke="#486276" stroke-width="3" stroke-linejoin="round"/><text x="295" y="109" font-size="24" fill="#19334a" text-anchor="middle" font-weight="600">k</text><line x1="140" y1="216" x2="240" y2="216" stroke="#486276" stroke-width="3" /><path d="M 345 196 H 240 V 236 H 345" fill="none" stroke="#486276" stroke-width="3"/><line x1="315" y1="200" x2="315" y2="232" stroke="#486276" stroke-width="4" /><line x1="315" y1="216" x2="500" y2="216" stroke="#486276" stroke-width="3" /><text x="295" y="264" font-size="24" fill="#19334a" text-anchor="middle" font-weight="600">c</text><line x1="400" y1="103" x2="400" y2="247" stroke="#8395a4" stroke-width="2" stroke-dasharray="6 5"/><text x="400" y="267" font-size="16" fill="#4b6173" text-anchor="middle" font-weight="400">x=0</text><rect x="500" y="109" width="138" height="137" rx="8" fill="#e5f1fb" stroke="#1c65a0" stroke-width="3"/><text x="569" y="187" font-size="32" fill="#19334a" text-anchor="middle" font-weight="700">m</text><line x1="400" y1="80" x2="500" y2="80" stroke="#1c65a0" stroke-width="3" marker-end="url(#blue-arrow)"/><text x="450" y="64" font-size="20" fill="#1c65a0" text-anchor="middle" font-weight="600">x(t)</text><line x1="460" y1="251" x2="460" y2="284" stroke="#a94d08" stroke-width="2" stroke-dasharray="4 4"/><line x1="500" y1="251" x2="500" y2="284" stroke="#a94d08" stroke-width="2" /><line x1="461" y1="273" x2="499" y2="273" stroke="#a94d08" stroke-width="3" marker-end="url(#orange-arrow)"/><text x="460" y="293" font-size="16" fill="#a94d08" text-anchor="middle" font-weight="400">x=y</text><text x="519" y="280" font-size="20" fill="#a94d08" text-anchor="start" font-weight="600">z=x−y</text><rect x="665" y="84" width="160" height="190" rx="7" fill="#f5f9fc" stroke="#b4c6d4" stroke-width="3"/><text x="679" y="112" font-size="20" fill="#19334a" text-anchor="start" font-weight="600">坐标定义</text><text x="679" y="146" font-size="16" fill="#4b6173" text-anchor="start" font-weight="400">质量绝对位移</text><text x="679" y="171" font-size="22" fill="#1c65a0" text-anchor="start" font-weight="400">x(t)</text><text x="679" y="205" font-size="16" fill="#4b6173" text-anchor="start" font-weight="400">基座绝对位移</text><text x="679" y="230" font-size="22" fill="#1c65a0" text-anchor="start" font-weight="400">y(t)</text><text x="679" y="258" font-size="16" fill="#4b6173" text-anchor="start" font-weight="400">正方向 →</text><text x="24" y="309" font-size="16" fill="#4b6173" text-anchor="start" font-weight="400">示意图；x、y 从各自静态平衡位置计量；橙色箭头是扣除静态间距后的相对变形。</text>
</g></svg>
