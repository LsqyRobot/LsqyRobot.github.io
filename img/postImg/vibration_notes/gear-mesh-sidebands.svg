5" font-size="25" fill="#142c42" text-anchor="middle" font-weight="650">60 齿</text><text x="360" y="302" font-size="25" fill="#142c42" text-anchor="middle" font-weight="650">5 Hz</text><text x="200" y="435" font-size="21" fill="#1667a2" text-anchor="middle" font-weight="650">输入 900 rpm</text><text x="400" y="435" font-size="21" fill="#16724d" text-anchor="middle" font-weight="650">输出 300 rpm</text><rect x="555" y="165" width="305" height="240" rx="12" fill="#edf5fc" stroke="#70899b" stroke-width="2"/><text x="577" y="202" font-size="21" fill="#142c42" text-anchor="start" font-weight="650">每秒通过啮合点的齿数</text><text x="577" y="248" font-size="24" fill="#142c42" text-anchor="start" font-weight="400">20 × 15 = 60 × 5</text><text x="577" y="290" font-size="27" fill="#1667a2" text-anchor="start" font-weight="700">fmesh = 300 Hz</text><text x="577" y="336" font-size="20" fill="#142c42" text-anchor="start" font-weight="400">输入轴参考：20 阶</text><text x="577" y="369" font-size="20" fill="#142c42" text-anchor="start" font-weight="400">输出轴参考：60 阶</text><text x="40" y="480" font-size="23" fill="#142c42" text-anchor="start" font-weight="650">边带频率：300 ± 5 Hz 与 300 ± 15 Hz</text><line x1="110" y1="655" x2="810" y2="655" stroke="#425d72" stroke-width="2.5" marker-end="url(#gear-sidebands-arrow)"/><text x="848" y="661" font-size="18" fill="#142c42" text-anchor="middle" font-weight="400">Hz</text><line x1="225" y1="655" x2="225" y2="605" stroke="#a94b12" stroke-width="4" /><text x="225" y="593" font-size="18" fill="#a94b12" text-anchor="middle" font-weight="650">−15 Hz</text><text x="225" y="684" font-size="19" fill="#142c42" text-anchor="middle" font-weight="400">285</text><line x1="375" y1="655" x2="375" y2="565" stroke="#16724d" stroke-width="4" /><text x="375" y="553" font-size="18" fill="#16724d" text-anchor="middle" font-weight="650">−5 Hz</text><text x="375" y="684" font-size="19" fill="#142c42" text-anchor="middle" font-weight="400">295</text><line x1="450" y1="655" x2="450" y2="515" stroke="#1667a2" stroke-width="4" /><text x="450" y="503" font-size="18" fill="#1667a2" text-anchor="middle" font-weight="650">啮合</text><text x="450" y="684" font-size="19" fill="#142c42" text-anchor="middle" font-weight="400">300</text><line x1="525" y1="655" x2="525" y2="565" stroke="#16724d" stroke-width="4" /><text x="525" y="553" font-size="18" fill="#16724d" text-anchor="middle" font-weight="650">+5 Hz</text><text x="525" y="684" font-size="19" fill="#142c42" text-anchor="middle" font-weight="400">305</text><line x1="675" y1="655" x2="675" y2="605" stroke="#a94b12" stroke-width="4" /><text x="675" y="593" font-size="18" fill="#a94b12" text-anchor="middle" font-weight="650">+15 Hz</text><text x="675" y="684" font-size="19" fill="#142c42" text-anchor="middle" font-weight="400">315</text><text x="40" y="720" font-size="20" fill="#142c42" text-anchor="start" font-weight="400">绿色：输出转频 5 Hz 调制；橙色：输入转频 15 Hz 调制。</text><text x="40" y="754" font-size="19" fill="#425d72" text-anchor="start" font-weight="400">线高仅为显示关系；边带不对应唯一故障，需要工况、时域与机械检查。</text><text x="40" y="781" font-size="17" fill="#425d72" text-anchor="start" font-weight="400">振动与减振 · 机制示意，非实测结果 · 可复现 SVG</text></g></svg>
