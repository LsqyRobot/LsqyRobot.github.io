<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-labelledby="title description"><title id="title">振动知识地图：机理、证据与治理</title><desc id="description">振动来源包括旋转传动、结构接触、控制规划与工艺环境，通过质量刚度阻尼和传递路径产生响应；用同步测量诊断，再选择措施复核。</desc><rect width="920" height="460" fill="#fff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#627f95"/></marker></defs><g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="32" y="38" font-size="25" fill="#203c51" text-anchor="start">振动知识地图：机理、证据与治理</text><rect x="32" y="65" width="270" height="165" rx="10" fill="#e9f1f8" stroke="#8aa2b6" stroke-width="1.5"/><text x="50" y="95" font-size="21" fill="#203c51" text-anchor="start">① 可能的激励来源</text><text x="50" y="125" font-size="17" fill="#203c51" text-anchor="start">旋转件 · 齿轮 · 轴承</text><text x="50" y="151" font-size="17" fill="#203c51" text-anchor="start">摩擦 · 冲击 · 流体 · 电磁</text><text x="50" y="177" font-size="17" fill="#203c51" text-anchor="start">控制回路 · 运动规划</text><rect x="326" y="65" width="270" height="165" rx="10" fill="#e9f1f8" stroke="#8aa2b6" stroke-width="1.5"/><text x="344" y="95" font-size="21" fill="#203c51" text-anchor="start">② 结构与动力学</text><text x="344" y="125" font-size="17" fill="#203c51" text-anchor="start">质量 m · 刚度 k · 阻尼 c</text><text x="344" y="151" font-size="17" fill="#203c51" text-anchor="start">横向 · 轴向 · 扭转模态</text><text x="344" y="177" font-size="17" fill="#203c51" text-anchor="start">共振 · 连接与传递路径</text><rect x="620" y="65" width="268" height="165" rx="10" fill="#e9f1f8" stroke="#8aa2b6" stroke-width="1.5"/><text x="638" y="95" font-size="21" fill="#203c51" text-anchor="start">③ 观察到的响应</text><text x="638" y="125" font-size="17" fill="#203c51" text-anchor="start">位移 · 速度 · 加速度</text><text x="638" y="151" font-size="17" fill="#203c51" text-anchor="start">跟踪误差 · 残余摆动</text><text x="638" y="177" font-size="17" fill="#203c51" text-anchor="start">噪声 · 工艺影响 · 动载荷</text><path d="M302 147 L322 147" stroke="#627f95" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M596 147 L616 147" stroke="#627f95" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M754 232 L754 274" stroke="#627f95" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M610 341 L582 341" stroke="#627f95" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M308 341 L280 341" stroke="#627f95" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="620" y="278" width="268" height="127" rx="10" fill="#f6efe1" stroke="#8aa2b6" stroke-width="1.5"/><text x="638" y="308" font-size="21" fill="#203c51" text-anchor="start">④ 同步测量</text><text x="638" y="338" font-size="17" fill="#203c51" text-anchor="start">时域 · 频谱 · 阶次 · 相位</text><text x="638" y="364" font-size="17" fill="#203c51" text-anchor="start">测点 / 工况 / 单位保持一致</text><rect x="312" y="278" width="270" height="127" rx="10" fill="#f6efe1" stroke="#8aa2b6" stroke-width="1.5"/><text x="330" y="308" font-size="21" fill="#203c51" text-anchor="start">⑤ 候选原因与验证</text><text x="330" y="338" font-size="17" fill="#203c51" text-anchor="start">机械检查 · 模态 / 路径证据</text><text x="330" y="364" font-size="17" fill="#203c51" text-anchor="start">比较转速、载荷和动作阶段</text><rect x="32" y="278" width="248" height="127" rx="10" fill="#e8f2e9" stroke="#8aa2b6" stroke-width="1.5"/><text x="50" y="308" font-size="21" fill="#203c51" text-anchor="start">⑥ 减振与复核</text><text x="50" y="338" font-size="17" fill="#203c51" text-anchor="start">源头 · 结构 · 路径 · 控制</text><text x="50" y="364" font-size="17" fill="#203c51" text-anchor="start">同工况复测，检查新代价</text><text x="32" y="438" font-size="17" fill="#203c51" text-anchor="start">一个谱峰可以来自不同机制；诊断需要证据链，措施需要前后对照。</text></g></svg>
