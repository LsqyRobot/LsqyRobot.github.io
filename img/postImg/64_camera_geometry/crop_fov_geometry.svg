<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">Full, central crop and off-centre crop field of view</title>
<desc id="desc">Three horizontal image-plane cross sections share fx=600. Full width 640 has cx=320; cropping x0=160 to width 320 gives cx=160; cropping x0=240 gives cx=80. Field of view is the angle difference of rays through the outer pixel edges. Orange indicates the ROI centre ray and white indicates the optical axis.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#112a3c"/><stop offset="1" stop-color="#091521"/></linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#cbe6f3" stroke-opacity=".045"/></pattern>
</defs>
<rect width="1280" height="760" fill="url(#background)"/>
<rect width="1280" height="760" fill="url(#grid)"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="32" y="57" font-size="38" fill="#f2f7fb" font-weight="700">裁剪改变视场角，f_x 保持不变</text>
<text x="32" y="99" font-size="24" fill="#abc1d0" >同一相机、同一缩放比例：c_x′ = c_x - x_0；像素边界位于 -0.5 与 W - 0.5。</text>
<rect x="32" y="127" width="384" height="536" rx="18" fill="#0b1d2d" stroke="#426074"/>
<text x="54" y="168" font-size="28" fill="#f2f7fb" font-weight="700">完整图像</text>
<text x="54" y="208" font-size="23" fill="#65e0cf" >W=640 · f_x=600 · c_x=320</text>
<text x="54" y="244" font-size="22" fill="#abc1d0" >x_0=0 · ROI 中心 u=319.5</text>
<text x="224" y="286" font-size="22" fill="#abc1d0" text-anchor="middle">边界 u: -0.5 / 639.5</text>
<path d="M224 524L105.415 302H342.21500000000003Z" fill="#65e0cf" fill-opacity=".11"/>
<line x1="105.415" y1="302" x2="342.21500000000003" y2="302" stroke="#426074" stroke-width="5" />
<line x1="105.415" y1="302" x2="342.21500000000003" y2="302" stroke="#65e0cf" stroke-width="6" />
<line x1="224" y1="524" x2="105.415" y2="302" stroke="#65e0cf" stroke-width="3" />
<line x1="224" y1="524" x2="342.21500000000003" y2="302" stroke="#65e0cf" stroke-width="3" />
<line x1="224" y1="320" x2="224" y2="524" stroke="#f2f7fb" stroke-width="2" stroke-dasharray="8 8"/>
<line x1="224" y1="524" x2="223.81500000000003" y2="302" stroke="#ffc477" stroke-width="3" stroke-dasharray="5 7"/>
<circle cx="224" cy="302" r="5" fill="#f2f7fb"/>
<circle cx="223.81500000000003" cy="302" r="4" fill="#ffc477"/>
<circle cx="224" cy="524" r="7" fill="#f2f7fb"/>
<text x="224" y="555" font-size="23" fill="#f2f7fb" text-anchor="middle">O</text>
<text x="224" y="594" font-size="23" fill="#abc1d0" text-anchor="middle">左 -28.11°   右 +28.04°</text>
<text x="224" y="640" font-size="31" fill="#65e0cf" text-anchor="middle" font-weight="700">FOV = 56.14°</text>
<rect x="448" y="127" width="384" height="536" rx="18" fill="#0b1d2d" stroke="#426074"/>
<text x="470" y="168" font-size="28" fill="#f2f7fb" font-weight="700">居中裁剪</text>
<text x="470" y="208" font-size="23" fill="#65e0cf" >W=320 · f_x=600 · c_x=160</text>
<text x="470" y="244" font-size="22" fill="#abc1d0" >x_0=160 · ROI 中心 u=159.5</text>
<text x="640" y="286" font-size="22" fill="#abc1d0" text-anchor="middle">边界 u: -0.5 / 319.5</text>
<path d="M640 524L580.615 302H699.015Z" fill="#65e0cf" fill-opacity=".11"/>
<line x1="521.415" y1="302" x2="758.215" y2="302" stroke="#426074" stroke-width="5" />
<line x1="580.615" y1="302" x2="699.015" y2="302" stroke="#65e0cf" stroke-width="6" />
<line x1="640" y1="524" x2="580.615" y2="302" stroke="#65e0cf" stroke-width="3" />
<line x1="640" y1="524" x2="699.015" y2="302" stroke="#65e0cf" stroke-width="3" />
<line x1="640" y1="320" x2="640" y2="524" stroke="#f2f7fb" stroke-width="2" stroke-dasharray="8 8"/>
<line x1="640" y1="524" x2="639.815" y2="302" stroke="#ffc477" stroke-width="3" stroke-dasharray="5 7"/>
<circle cx="640" cy="302" r="5" fill="#f2f7fb"/>
<circle cx="639.815" cy="302" r="4" fill="#ffc477"/>
<circle cx="640" cy="524" r="7" fill="#f2f7fb"/>
<text x="640" y="555" font-size="23" fill="#f2f7fb" text-anchor="middle">O</text>
<text x="640" y="594" font-size="23" fill="#abc1d0" text-anchor="middle">左 -14.98°   右 +14.89°</text>
<text x="640" y="640" font-size="31" fill="#65e0cf" text-anchor="middle" font-weight="700">FOV = 29.86°</text>
<rect x="864" y="127" width="384" height="536" rx="18" fill="#0b1d2d" stroke="#426074"/>
<text x="886" y="168" font-size="28" fill="#f2f7fb" font-weight="700">偏心裁剪</text>
<text x="886" y="208" font-size="23" fill="#65e0cf" >W=320 · f_x=600 · c_x=80</text>
<text x="886" y="244" font-size="22" fill="#abc1d0" >x_0=240 · ROI 中心 u=159.5</text>
<text x="1056" y="286" font-size="22" fill="#abc1d0" text-anchor="middle">边界 u: -0.5 / 319.5</text>
<path d="M1056 524L1026.215 302H1144.615Z" fill="#65e0cf" fill-opacity=".11"/>
<line x1="937.415" y1="302" x2="1174.215" y2="302" stroke="#426074" stroke-width="5" />
<line x1="1026.215" y1="302" x2="1144.615" y2="302" stroke="#65e0cf" stroke-width="6" />
<line x1="1056" y1="524" x2="1026.215" y2="302" stroke="#65e0cf" stroke-width="3" />
<line x1="1056" y1="524" x2="1144.615" y2="302" stroke="#65e0cf" stroke-width="3" />
<line x1="1056" y1="320" x2="1056" y2="524" stroke="#f2f7fb" stroke-width="2" stroke-dasharray="8 8"/>
<line x1="1056" y1="524" x2="1085.415" y2="302" stroke="#ffc477" stroke-width="3" stroke-dasharray="5 7"/>
<circle cx="1056" cy="302" r="5" fill="#f2f7fb"/>
<circle cx="1085.415" cy="302" r="4" fill="#ffc477"/>
<circle cx="1056" cy="524" r="7" fill="#f2f7fb"/>
<text x="1056" y="555" font-size="23" fill="#f2f7fb" text-anchor="middle">O</text>
<text x="1056" y="594" font-size="23" fill="#abc1d0" text-anchor="middle">左 -7.64°   右 +21.76°</text>
<text x="1056" y="640" font-size="31" fill="#65e0cf" text-anchor="middle" font-weight="700">FOV = 29.40°</text>
<text x="1112" y="438" font-size="22" fill="#ffc477" >ROI 中心</text>
<line x1="1108" y1="441" x2="1073" y2="419" stroke="#ffc477" stroke-width="2" />
<text x="914" y="471" font-size="22" fill="#f2f7fb" >光轴</text>
<line x1="968" y1="464" x2="1050" y2="445" stroke="#f2f7fb" stroke-width="2" />
<text x="640" y="705" font-size="27" fill="#f2f7fb" text-anchor="middle">FOV = atan((W - 0.5 - c_x)/f_x) - atan((-0.5 - c_x)/f_x)</text>
<text x="640" y="744" font-size="22" fill="#abc1d0" text-anchor="middle">橙虚线：ROI 中心射线；白虚线：光轴。主点由光轴确定，不是裁剪后的图像中心。</text>
</g>
</svg>
