<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Camera intrinsics: focal length, principal point and projection</title>
<desc id="desc">The intrinsic matrix K maps a camera-frame point to image coordinates after perspective division. A ray intersects a virtual image plane in front of the optical centre.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#112a3c"/><stop offset="1" stop-color="#091521"/></linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#cbe6f3" stroke-opacity=".045"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#background)"/>
<rect width="1600" height="900" fill="url(#grid)"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="90" y="95" font-size="26" fill="#65e0cf" letter-spacing="5">CAMERA GEOMETRY</text>
<text x="86" y="215" font-size="102" fill="#f2f7fb" font-weight="700">CAMERA</text>
<text x="86" y="329" font-size="102" fill="#f2f7fb" font-weight="700">INTRINSICS</text>
<text x="94" y="390" font-size="32" fill="#abc1d0" >焦距 · 主点 · 视场角 · 图像裁剪</text>
<rect x="90" y="438" width="660" height="278" rx="18" fill="#0b1d2d" stroke="#426074"/>
<text x="126" y="585" font-size="60" fill="#65e0cf" >K =</text>
<path d="M290 470H266V678H290 M666 470H690V678H666" fill="none" stroke="#abc1d0" stroke-width="4" />
<text x="346" y="527" font-size="45" fill="#f2f7fb" text-anchor="middle">f_x</text>
<text x="476" y="527" font-size="45" fill="#abc1d0" text-anchor="middle">0</text>
<text x="606" y="527" font-size="45" fill="#ffc477" text-anchor="middle">c_x</text>
<text x="346" y="590" font-size="45" fill="#abc1d0" text-anchor="middle">0</text>
<text x="476" y="590" font-size="45" fill="#f2f7fb" text-anchor="middle">f_y</text>
<text x="606" y="590" font-size="45" fill="#ffc477" text-anchor="middle">c_y</text>
<text x="346" y="653" font-size="45" fill="#abc1d0" text-anchor="middle">0</text>
<text x="476" y="653" font-size="45" fill="#abc1d0" text-anchor="middle">0</text>
<text x="606" y="653" font-size="45" fill="#abc1d0" text-anchor="middle">1</text>
<path d="M1130 280L1290 235V660L1130 705Z" fill="#65e0cf" fill-opacity=".10" stroke="#65e0cf" stroke-opacity=".6" stroke-width="3"/>
<line x1="1210" y1="258" x2="1210" y2="683" stroke="#65e0cf" stroke-width="1" stroke-opacity=".3"/>
<line x1="1130" y1="420" x2="1290" y2="375" stroke="#65e0cf" stroke-width="1" stroke-opacity=".3"/>
<line x1="1130" y1="560" x2="1290" y2="515" stroke="#65e0cf" stroke-width="1" stroke-opacity=".3"/>
<line x1="850" y1="550" x2="1510" y2="550" stroke="#abc1d0" stroke-width="3" marker-end="url(#arrow)" />
<text x="1485" y="589" font-size="29" fill="#abc1d0" >+Z</text>
<line x1="880" y1="550" x2="1460" y2="305" stroke="#65e0cf" stroke-width="6" />
<line x1="880" y1="550" x2="1445" y2="705" stroke="#87baff" stroke-width="3" stroke-opacity=".65"/>
<circle cx="880" cy="550" r="9" fill="#f2f7fb"/>
<text x="858" y="599" font-size="34" fill="#f2f7fb" >O</text>
<circle cx="1460" cy="305" r="10" fill="#65e0cf"/>
<text x="1325" y="261" font-size="29" fill="#65e0cf" >P = (X,Y,Z)</text>
<circle cx="1130" cy="444.4" r="8" fill="#65e0cf"/>
<text x="1160" y="453" font-size="28" fill="#65e0cf" >p = (u,v)</text>
<circle cx="1130" cy="550" r="8" fill="#ffc477"/>
<text x="1170" y="596" font-size="28" fill="#ffc477" >(c_x,c_y)</text>
<text x="1120" y="763" font-size="27" fill="#abc1d0" >虚像平面</text>
<rect x="90" y="776" width="1420" height="80" rx="18" fill="#07121d" stroke="#426074"/>
<text x="800" y="828" font-size="37" fill="#f2f7fb" text-anchor="middle">u = f_x X/Z + c_x;     v = f_y Y/Z + c_y</text>
</g>
</svg>
