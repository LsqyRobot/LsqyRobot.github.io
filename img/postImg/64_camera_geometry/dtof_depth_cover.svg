<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">dToF: range to camera-axis depth</title>
<desc id="desc">The radial distance r is the hypotenuse of a right triangle, while depth Z is the projection onto the optical axis. Z equals r cos theta and differs from radial range away from the optical axis.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#112a3c"/><stop offset="1" stop-color="#091521"/></linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#cbe6f3" stroke-opacity=".045"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#background)"/>
<rect width="1600" height="900" fill="url(#grid)"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="90" y="95" font-size="26" fill="#65e0cf" letter-spacing="5">DEPTH GEOMETRY</text>
<text x="83" y="261" font-size="156" fill="#f2f7fb" font-weight="700">dToF</text>
<text x="90" y="356" font-size="66" fill="#f2f7fb" font-weight="700">RANGE TO DEPTH</text>
<text x="94" y="414" font-size="32" fill="#abc1d0" >沿射线测距，沿相机光轴存深度</text>
<rect x="90" y="472" width="680" height="247" rx="18" fill="#0b1d2d" stroke="#426074"/>
<text x="122" y="526" font-size="26" fill="#abc1d0" >理想同轴往返测距</text>
<text x="122" y="597" font-size="52" fill="#65e0cf" >r = c Δt / 2</text>
<text x="122" y="673" font-size="52" fill="#ffc477" >Z = r cos θ</text>
<path d="M895 630L1450 302V630Z" fill="#65e0cf" fill-opacity=".075"/>
<line x1="867" y1="630" x2="1520" y2="630" stroke="#abc1d0" stroke-width="3" marker-end="url(#arrow)" />
<line x1="895" y1="630" x2="1450" y2="302" stroke="#65e0cf" stroke-width="7" />
<line x1="895" y1="630" x2="1450" y2="630" stroke="#ffc477" stroke-width="7" />
<line x1="1450" y1="302" x2="1450" y2="630" stroke="#abc1d0" stroke-width="3" stroke-dasharray="9 10"/>
<path d="M1426 630V606H1450" fill="none" stroke="#abc1d0" stroke-width="3" />
<path d="M1020 630A125 125 0 0 0 1002.6 566.4" fill="none" stroke="#f2f7fb" stroke-width="3" />
<text x="1033" y="592" font-size="34" fill="#f2f7fb" >θ</text>
<circle cx="895" cy="630" r="9" fill="#f2f7fb"/>
<text x="868" y="681" font-size="34" fill="#f2f7fb" >O</text>
<circle cx="1450" cy="302" r="10" fill="#65e0cf"/>
<text x="1372" y="262" font-size="31" fill="#65e0cf" >P(X,Y,Z)</text>
<text x="1121" y="441" font-size="56" fill="#65e0cf" >r</text>
<text x="1162" y="689" font-size="56" fill="#ffc477" >Z</text>
<text x="1468" y="676" font-size="29" fill="#abc1d0" >+Z</text>
<text x="1090" y="745" font-size="33" fill="#abc1d0" >离轴时 r &gt; Z</text>
<rect x="90" y="781" width="1420" height="76" rx="18" fill="#07121d" stroke="#426074"/>
<text x="800" y="830" font-size="32" fill="#f2f7fb" text-anchor="middle">r = ||P||     ·     Z = P_z     ·     Z = r / sqrt(1 + x_n² + y_n²)</text>
</g>
</svg>
