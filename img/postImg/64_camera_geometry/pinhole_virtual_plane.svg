<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Pinhole model: real and virtual image planes</title>
<desc id="desc">Positive camera Z points right and positive Y points down. A point below the optical axis produces an inverted real image behind the optical centre and an upright virtual image in front. Similar triangles give Y/Z = y/f.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#112a3c"/><stop offset="1" stop-color="#091521"/></linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#cbe6f3" stroke-opacity=".045"/></pattern>
</defs>
<rect width="1280" height="720" fill="url(#background)"/>
<rect width="1280" height="720" fill="url(#grid)"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="48" y="62" font-size="38" fill="#f2f7fb" font-weight="700">针孔成像：真实倒像与虚像平面</text>
<text x="48" y="107" font-size="24" fill="#abc1d0" >侧视图：+Z 向右，+Y 向下；虚像平面用于推导，不是实体传感器。</text>
<rect x="54" y="143" width="1172" height="457" rx="18" fill="#0a1a29" stroke="#426074"/>
<text x="305" y="188" font-size="26" fill="#87baff" text-anchor="middle">真实传感器</text>
<text x="650" y="188" font-size="26" fill="#65e0cf" text-anchor="middle">虚像平面</text>
<rect x="296" y="216" width="28" height="252" rx="18" fill="#193950" stroke="#87baff" stroke-width="2"/>
<line x1="650" y1="216" x2="650" y2="486" stroke="#65e0cf" stroke-width="3" stroke-dasharray="8 9"/>
<path d="M480 320L1100 320V510Z" fill="#65e0cf" fill-opacity=".06"/>
<path d="M480 320L650 320V372.1Z" fill="#65e0cf" fill-opacity=".14"/>
<line x1="104" y1="320" x2="1185" y2="320" stroke="#abc1d0" stroke-width="3" marker-end="url(#arrow)" />
<text x="1144" y="300" font-size="26" fill="#abc1d0" >+Z</text>
<line x1="480" y1="232" x2="480" y2="542" stroke="#abc1d0" stroke-width="3" marker-end="url(#arrow)" />
<text x="499" y="541" font-size="26" fill="#abc1d0" >+Y</text>
<line x1="1100" y1="510" x2="258" y2="251.96774193548387" stroke="#ffc477" stroke-width="4" marker-end="url(#arrow)"/>
<text x="842" y="405" font-size="25" fill="#ffc477" >入射光线</text>
<line x1="310" y1="320" x2="310" y2="267.9032258064516" stroke="#87baff" stroke-width="3" marker-end="url(#arrow)" />
<circle cx="310" cy="267.9032258064516" r="6" fill="#87baff"/>
<text x="124" y="226" font-size="23" fill="#87baff" >倒像 y_real &lt; 0</text>
<line x1="650" y1="320" x2="650" y2="372.0967741935484" stroke="#65e0cf" stroke-width="3" marker-end="url(#arrow)" />
<circle cx="650" cy="372.0967741935484" r="6" fill="#65e0cf"/>
<text x="675" y="371" font-size="25" fill="#65e0cf" >y &gt; 0</text>
<line x1="1100" y1="320" x2="1100" y2="510" stroke="#65e0cf" stroke-width="3" marker-end="url(#arrow)" />
<circle cx="1100" cy="510" r="8" fill="#65e0cf"/>
<text x="1122" y="435" font-size="29" fill="#65e0cf" >Y</text>
<text x="1092" y="547" font-size="26" fill="#65e0cf" >P(Y,Z)</text>
<circle cx="480" cy="320" r="8" fill="#f2f7fb"/>
<text x="437" y="304" font-size="28" fill="#f2f7fb" >O</text>
<line x1="310" y1="516" x2="480" y2="516" stroke="#87baff" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="391" y="550" font-size="28" fill="#87baff" text-anchor="middle">f</text>
<line x1="480" y1="516" x2="650" y2="516" stroke="#65e0cf" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="565" y="550" font-size="28" fill="#65e0cf" text-anchor="middle">f</text>
<line x1="480" y1="582" x2="1100" y2="582" stroke="#abc1d0" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="875" y="566" font-size="24" fill="#abc1d0" text-anchor="middle">Z（从 O 到物点）</text>
<rect x="54" y="622" width="1172" height="67" rx="18" fill="#112a3c" stroke="#426074"/>
<text x="640" y="666" font-size="27" fill="#f2f7fb" text-anchor="middle">相似三角形：Y/Z = y/f     →     y = fY/Z；真实像面 y_real = -fY/Z</text>
</g>
</svg>
