<svg xmlns="http://www.w3.org/2000/svg" width="760" height="725" viewBox="0 0 760 725" role="img" aria-labelledby="title desc"><title id="title">坐标变换：旋转基底，再加平移</title><desc id="desc">gₐᵦ 的输入是 b 系坐标，输出是 a 系坐标。</desc><defs><marker id="a1c3c51" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1c3c51"/></marker><marker id="a506d80" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#506d80"/></marker><marker id="aa7bdcb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a7bdcb"/></marker><marker id="a176d9d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#176d9d"/></marker><marker id="a27826b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#27826b"/></marker><marker id="aa85816" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a85816"/></marker><marker id="ab44765" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b44765"/></marker></defs><rect width="100%" height="100%" fill="#f3f8fb"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="59" font-size="35" fill="#1c3c51" text-anchor="start" font-weight="700">坐标变换：旋转基底，再加平移</text><text x="35" y="103" font-size="25" fill="#506d80" text-anchor="start" font-weight="400">gₐᵦ 的输入是 b 系坐标，输出是 a 系坐标。</text><path d="M 65 465 L 390 465" fill="none" stroke="#176d9d" stroke-width="3" marker-end="url(#a176d9d)"/><path d="M 135 520 L 135 165" fill="none" stroke="#176d9d" stroke-width="3" marker-end="url(#a176d9d)"/><text x="355" y="503" font-size="29" fill="#176d9d" text-anchor="start" font-weight="400">xₐ</text><text x="98" y="171" font-size="29" fill="#176d9d" text-anchor="start" font-weight="400">yₐ</text><text x="95" y="498" font-size="26" fill="#176d9d" text-anchor="start" font-weight="400">Oₐ</text><path d="M 135 465 L 215 305" fill="none" stroke="#506d80" stroke-width="3" marker-end="url(#a506d80)" stroke-dasharray="8 6"/><text x="247" y="399" font-size="29" fill="#506d80" text-anchor="start" font-weight="400">p</text><path d="M 215 305 L 215 200" fill="none" stroke="#27826b" stroke-width="3" marker-end="url(#a27826b)"/><path d="M 215 305 L 115 305" fill="none" stroke="#27826b" stroke-width="3" marker-end="url(#a27826b)"/><text x="228" y="193" font-size="29" fill="#27826b" text-anchor="start" font-weight="400">xᵦ</text><text x="72" y="310" font-size="29" fill="#27826b" text-anchor="start" font-weight="400">yᵦ</text><circle cx="215" cy="305" r="7" fill="#27826b" stroke="#fff" stroke-width="2"/><text x="230" y="333" font-size="27" fill="#27826b" text-anchor="start" font-weight="400">Oᵦ</text><circle cx="215" cy="225" r="10" fill="#a85816" stroke="#fff" stroke-width="2"/><path d="M 228 225 L 360 225" fill="none" stroke="#a85816" stroke-width="3" stroke-dasharray="8 6"/><text x="280" y="211" font-size="25" fill="#a85816" text-anchor="start" font-weight="400">同一个点</text><rect x="414" y="156" width="311" height="233" rx="16" fill="#e8f3f8" stroke="#cbdce6" stroke-width="2"/><text x="434" y="196" font-size="29" fill="#1c3c51" text-anchor="start" font-weight="650">θ = 90°</text><text x="434" y="240" font-size="26" fill="#506d80" text-anchor="start" font-weight="400">p = (1, 2)</text><text x="434" y="282" font-size="26" fill="#506d80" text-anchor="start" font-weight="400">xᵦ = (1, 0)</text><text x="434" y="324" font-size="26" fill="#506d80" text-anchor="start" font-weight="400">R xᵦ = (0, 1)</text><text x="434" y="366" font-size="26" fill="#506d80" text-anchor="start" font-weight="400">xₐ = (1, 3)</text><rect x="35" y="554" width="690" height="107" rx="16" fill="#fff" stroke="#cbdce6" stroke-width="2"/><text x="55" y="594" font-size="29" fill="#1c3c51" text-anchor="start" font-weight="650">xₐ = R xᵦ + p</text><text x="55" y="638" font-size="26" fill="#506d80" text-anchor="start" font-weight="400">点加平移（末项 1）；方向只旋转（末项 0）。</text><text x="35" y="703" font-size="20" fill="#506d80" text-anchor="start" font-weight="400">机器人操作数学 · 原创算例 / MLS 顺序 (v, ω)</text></g></svg>
