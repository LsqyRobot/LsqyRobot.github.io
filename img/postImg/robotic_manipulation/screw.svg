<svg xmlns="http://www.w3.org/2000/svg" width="760" height="805" viewBox="0 0 760 805" role="img" aria-labelledby="title desc"><title id="title">偏置转轴：v 不等于“纯平移”</title><desc id="desc">xy 平面内，绕 q 处的 z 轴转 90°；此图取 h = 0。</desc><defs><marker id="a1c3c51" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1c3c51"/></marker><marker id="a506d80" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#506d80"/></marker><marker id="aa7bdcb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a7bdcb"/></marker><marker id="a176d9d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#176d9d"/></marker><marker id="a27826b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#27826b"/></marker><marker id="aa85816" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a85816"/></marker><marker id="ab44765" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b44765"/></marker></defs><rect width="100%" height="100%" fill="#f3f8fb"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="59" font-size="35" fill="#1c3c51" text-anchor="start" font-weight="700">偏置转轴：v 不等于“纯平移”</text><text x="35" y="103" font-size="25" fill="#506d80" text-anchor="start" font-weight="400">xy 平面内，绕 q 处的 z 轴转 90°；此图取 h = 0。</text><path d="M 58 240 L 385 240" fill="none" stroke="#a7bdcb" stroke-width="2" marker-end="url(#aa7bdcb)"/><path d="M 110 465 L 110 165" fill="none" stroke="#a7bdcb" stroke-width="2" marker-end="url(#aa7bdcb)"/><path d="M 280 240 L 110 240" fill="none" stroke="#506d80" stroke-width="3" stroke-dasharray="8 6"/><path d="M 280 240 L 280 410" fill="none" stroke="#506d80" stroke-width="3" stroke-dasharray="8 6"/><path d="M110 240 A170 170 0 0 0 280 410" fill="none" stroke="#176d9d" stroke-width="5" marker-end="url(#a176d9d)"/><circle cx="110" cy="240" r="9" fill="#176d9d" stroke="#fff" stroke-width="2"/><circle cx="280" cy="240" r="9" fill="#a85816" stroke="#fff" stroke-width="2"/><circle cx="280" cy="410" r="10" fill="#27826b" stroke="#fff" stroke-width="2"/><path d="M 110 240 L 110 325" fill="none" stroke="#27826b" stroke-width="4" marker-end="url(#a27826b)"/><text x="49" y="205" font-size="25" fill="#176d9d" text-anchor="start" font-weight="400">原点 (0, 0)</text><text x="232" y="205" font-size="25" fill="#a85816" text-anchor="start" font-weight="400">q = (1, 0)</text><text x="214" y="291" font-size="29" fill="#506d80" text-anchor="start" font-weight="400">90°</text><text x="235" y="455" font-size="27" fill="#27826b" text-anchor="start" font-weight="400">(1, −1)</text><rect x="414" y="157" width="311" height="191" rx="16" fill="#e8f3f8" stroke="#cbdce6" stroke-width="2"/><text x="434" y="197" font-size="29" fill="#1c3c51" text-anchor="start" font-weight="650">h = 0：纯转动</text><text x="434" y="241" font-size="26" fill="#506d80" text-anchor="start" font-weight="400">q = (1, 0, 0)</text><text x="434" y="283" font-size="26" fill="#506d80" text-anchor="start" font-weight="400">ω = (0, 0, 1)</text><text x="434" y="325" font-size="26" fill="#506d80" text-anchor="start" font-weight="400">v = (0, −1, 0)</text><text x="35" y="516" font-size="26" fill="#506d80" text-anchor="start" font-weight="400">轴偏离参考系原点：纯转动也可以有 v ≠ 0。</text><rect x="35" y="555" width="690" height="191" rx="16" fill="#fff" stroke="#cbdce6" stroke-width="2"/><text x="55" y="595" font-size="29" fill="#1c3c51" text-anchor="start" font-weight="650">一般螺距 h：再加沿轴平移</text><text x="55" y="639" font-size="26" fill="#506d80" text-anchor="start" font-weight="400">v = −ω × q + hω；ξ = (v, ω)</text><text x="55" y="681" font-size="26" fill="#506d80" text-anchor="start" font-weight="400">例如 h = 0.2 时，v = (0, −1, 0.2)。</text><text x="55" y="723" font-size="26" fill="#506d80" text-anchor="start" font-weight="400">任意点的速度仍由 ẋ = v + ω × x 计算。</text><text x="35" y="783" font-size="20" fill="#506d80" text-anchor="start" font-weight="400">机器人操作数学 · 原创算例 / MLS 顺序 (v, ω)</text></g></svg>
