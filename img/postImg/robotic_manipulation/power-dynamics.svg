<svg xmlns="http://www.w3.org/2000/svg" width="760" height="837" viewBox="0 0 760 837" role="img" aria-labelledby="title desc"><title id="title">速度与力：功率把两侧连接起来</title><desc id="desc">力矩映射是运动映射的对偶；不需要求 J 的逆。</desc><defs><marker id="a1c3c51" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1c3c51"/></marker><marker id="a506d80" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#506d80"/></marker><marker id="aa7bdcb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a7bdcb"/></marker><marker id="a176d9d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#176d9d"/></marker><marker id="a27826b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#27826b"/></marker><marker id="aa85816" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a85816"/></marker><marker id="ab44765" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b44765"/></marker></defs><rect width="100%" height="100%" fill="#f3f8fb"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="59" font-size="35" fill="#1c3c51" text-anchor="start" font-weight="700">速度与力：功率把两侧连接起来</text><text x="35" y="103" font-size="25" fill="#506d80" text-anchor="start" font-weight="400">力矩映射是运动映射的对偶；不需要求 J 的逆。</text><rect x="35" y="152" width="315" height="149" rx="16" fill="#e8f3f8" stroke="#cbdce6" stroke-width="2"/><text x="55" y="192" font-size="29" fill="#1c3c51" text-anchor="start" font-weight="650">速度方向</text><text x="55" y="236" font-size="26" fill="#506d80" text-anchor="start" font-weight="400">q̇  →  V = Jq̇</text><text x="55" y="278" font-size="26" fill="#506d80" text-anchor="start" font-weight="400">关节 → 末端</text><rect x="410" y="152" width="315" height="149" rx="16" fill="#e5f2ed" stroke="#cbdce6" stroke-width="2"/><text x="430" y="192" font-size="29" fill="#1c3c51" text-anchor="start" font-weight="650">外力的对偶方向</text><text x="430" y="236" font-size="26" fill="#506d80" text-anchor="start" font-weight="400">F外 → τ外 = JᵀF外</text><text x="430" y="278" font-size="26" fill="#506d80" text-anchor="start" font-weight="400">末端 → 关节</text><rect x="35" y="345" width="690" height="89" rx="16" fill="#fff" stroke="#cbdce6" stroke-width="2"/><text x="380" y="402" font-size="32" fill="#1c3c51" text-anchor="middle" font-weight="400">功率相同：F外ᵀV = τ外ᵀq̇</text><rect x="35" y="465" width="690" height="149" rx="16" fill="#fff" stroke="#cbdce6" stroke-width="2"/><text x="55" y="505" font-size="29" fill="#1c3c51" text-anchor="start" font-weight="650">固定顺序与同一表达坐标系</text><text x="55" y="549" font-size="26" fill="#506d80" text-anchor="start" font-weight="400">V = (v, ω)，F = (f, τ力矩)</text><text x="55" y="591" font-size="26" fill="#506d80" text-anchor="start" font-weight="400">2R：F外 = (1, 0) N → τ外 = (−1, −1) N·m</text><rect x="35" y="660" width="690" height="123" rx="16" fill="#e8f3f8" stroke="#cbdce6" stroke-width="2"/><text x="380" y="706" font-size="26" fill="#1c3c51" text-anchor="middle" font-weight="400">M(q)q̈ + C(q,q̇)q̇ + g(q) = τ驱动 + JᵀF外</text><text x="380" y="751" font-size="25" fill="#506d80" text-anchor="middle" font-weight="400">动力学平衡：F外 指外界施加给机器人的力</text><text x="35" y="815" font-size="20" fill="#506d80" text-anchor="start" font-weight="400">机器人操作数学 · 原创算例 / MLS 顺序 (v, ω)</text></g></svg>
