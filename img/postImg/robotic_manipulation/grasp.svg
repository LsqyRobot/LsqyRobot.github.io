<svg xmlns="http://www.w3.org/2000/svg" width="760" height="873" viewBox="0 0 760 873" role="img" aria-labelledby="title desc"><title id="title">抓取：内力可以变化，物体仍平衡</title><desc id="desc">接触力不等于物体合力；先选物体参考点。</desc><defs><marker id="a1c3c51" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1c3c51"/></marker><marker id="a506d80" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#506d80"/></marker><marker id="aa7bdcb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a7bdcb"/></marker><marker id="a176d9d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#176d9d"/></marker><marker id="a27826b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#27826b"/></marker><marker id="aa85816" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a85816"/></marker><marker id="ab44765" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b44765"/></marker></defs><rect width="100%" height="100%" fill="#f3f8fb"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="59" font-size="35" fill="#1c3c51" text-anchor="start" font-weight="700">抓取：内力可以变化，物体仍平衡</text><text x="35" y="103" font-size="25" fill="#506d80" text-anchor="start" font-weight="400">接触力不等于物体合力；先选物体参考点。</text><rect x="225" y="175" width="310" height="216" rx="16" fill="#e8f3f8" stroke="#cbdce6" stroke-width="2"/><circle cx="225" cy="282" r="10" fill="#a85816" stroke="#fff" stroke-width="2"/><circle cx="535" cy="282" r="10" fill="#a85816" stroke="#fff" stroke-width="2"/><path d="M 115 282 L 222 282" fill="none" stroke="#27826b" stroke-width="7" marker-end="url(#a27826b)"/><path d="M 645 282 L 538 282" fill="none" stroke="#27826b" stroke-width="7" marker-end="url(#a27826b)"/><text x="57" y="235" font-size="25" fill="#27826b" text-anchor="start" font-weight="400">f₁ = (+1, 0)</text><text x="518" y="235" font-size="25" fill="#27826b" text-anchor="start" font-weight="400">f₂ = (−1, 0)</text><text x="380" y="277" font-size="30" fill="#1c3c51" text-anchor="middle" font-weight="400">刚体物体</text><text x="380" y="320" font-size="25" fill="#506d80" text-anchor="middle" font-weight="400">参考点在中心</text><rect x="35" y="438" width="690" height="149" rx="16" fill="#e5f2ed" stroke="#cbdce6" stroke-width="2"/><text x="55" y="478" font-size="29" fill="#1c3c51" text-anchor="start" font-weight="650">G 把接触力映射为物体合力 / 合力矩</text><text x="55" y="522" font-size="26" fill="#506d80" text-anchor="start" font-weight="400">本例 Gf = 0：合力为 0，绕中心的合力矩为 0。</text><text x="55" y="564" font-size="26" fill="#506d80" text-anchor="start" font-weight="400">非零接触力属于 ker(G)，构成一组内力。</text><rect x="35" y="646" width="690" height="149" rx="16" fill="#fff" stroke="#cbdce6" stroke-width="2"/><text x="55" y="686" font-size="29" fill="#1c3c51" text-anchor="start" font-weight="650">能否抓稳，还要看约束</text><text x="55" y="730" font-size="26" fill="#506d80" text-anchor="start" font-weight="400">接触位置、单边接触、摩擦锥共同决定可行力。</text><text x="55" y="772" font-size="26" fill="#506d80" text-anchor="start" font-weight="400">这幅相向挤压示意本身不证明力闭合。</text><text x="35" y="851" font-size="20" fill="#506d80" text-anchor="start" font-weight="400">机器人操作数学 · 原创算例 / MLS 顺序 (v, ω)</text></g></svg>
