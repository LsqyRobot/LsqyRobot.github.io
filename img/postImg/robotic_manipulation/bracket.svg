<svg xmlns="http://www.w3.org/2000/svg" width="760" height="832" viewBox="0 0 760 832" role="img" aria-labelledby="title desc"><title id="title">动作不交换：四步留下净位移</title><desc id="desc">独轮车不能瞬时侧滑，却能通过转向改变位置。</desc><defs><marker id="a1c3c51" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1c3c51"/></marker><marker id="a506d80" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#506d80"/></marker><marker id="aa7bdcb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a7bdcb"/></marker><marker id="a176d9d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#176d9d"/></marker><marker id="a27826b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#27826b"/></marker><marker id="aa85816" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a85816"/></marker><marker id="ab44765" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b44765"/></marker></defs><rect width="100%" height="100%" fill="#f3f8fb"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="59" font-size="35" fill="#1c3c51" text-anchor="start" font-weight="700">动作不交换：四步留下净位移</text><text x="35" y="103" font-size="25" fill="#506d80" text-anchor="start" font-weight="400">独轮车不能瞬时侧滑，却能通过转向改变位置。</text><path d="M 64 232 L 642 232" fill="none" stroke="#506d80" stroke-width="2" marker-end="url(#a506d80)"/><path d="M 110 478 L 110 155" fill="none" stroke="#506d80" stroke-width="2" marker-end="url(#a506d80)"/><path d="M 110 232 L 482 232" fill="none" stroke="#176d9d" stroke-width="6" marker-end="url(#a176d9d)"/><path d="M 482 232 L 147.03367792480418 393.8071786893776" fill="none" stroke="#a85816" stroke-width="6" marker-end="url(#aa85816)"/><circle cx="110" cy="232" r="9" fill="#1c3c51" stroke="#fff" stroke-width="2"/><circle cx="147.03367792480418" cy="393.8071786893776" r="10" fill="#27826b" stroke="#fff" stroke-width="2"/><path d="M 147.03367792480418 393.8071786893776 L 230.03367792480418 393.8071786893776" fill="none" stroke="#27826b" stroke-width="4" marker-end="url(#a27826b)"/><text x="178" y="204" font-size="29" fill="#176d9d" text-anchor="start" font-weight="400">① 前进 a</text><text x="498" y="271" font-size="27" fill="#506d80" text-anchor="start" font-weight="400">② 左转 b</text><text x="326" y="367" font-size="29" fill="#a85816" text-anchor="start" font-weight="400">③ 后退 a</text><text x="206" y="461" font-size="27" fill="#27826b" text-anchor="start" font-weight="400">④ 右转 b，朝向恢复</text><path d="M 110 393.8071786893776 L 147.03367792480418 393.8071786893776" fill="none" stroke="#b44765" stroke-width="3" stroke-dasharray="8 6"/><text x="44" y="521" font-size="27" fill="#b44765" text-anchor="start" font-weight="400">有限步长仍有 x 漂移</text><rect x="35" y="565" width="690" height="149" rx="16" fill="#e8f3f8" stroke="#cbdce6" stroke-width="2"/><text x="55" y="605" font-size="29" fill="#1c3c51" text-anchor="start" font-weight="650">精确终点 (x, y, θ)</text><text x="55" y="649" font-size="26" fill="#506d80" text-anchor="start" font-weight="400">(a(1−cos b), −a sin b, 0)</text><text x="55" y="691" font-size="26" fill="#506d80" text-anchor="start" font-weight="400">a = 0.6，b = 0.45 → (0.060, −0.261, 0)</text><text x="35" y="777" font-size="25" fill="#506d80" text-anchor="start" font-weight="400">小步长主导侧向项为 −ab；并非严格原地横移。</text><text x="35" y="810" font-size="20" fill="#506d80" text-anchor="start" font-weight="400">机器人操作数学 · 原创算例 / MLS 顺序 (v, ω)</text></g></svg>
