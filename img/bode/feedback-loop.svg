<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
<title id="title">负反馈控制框图</title><desc id="desc">参考经过误差求和、控制器C、对象P到达输出y；测量H返回负输入。环路L是CPH，参考到输出是CP除以1加CPH。</desc>
<rect width="960" height="330" rx="12" fill="#f3f8fa"/>
<g font-family="sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#17766c"/></marker></defs><text x="40" y="40" fill="#19354f" font-size="25" text-anchor="start">先确定环路：L = C · P · H</text><circle cx="200" cy="120" r="25" fill="white" stroke="#17766c" stroke-width="2"/><text x="60" y="112" fill="#19354f" font-size="22" text-anchor="start">r</text><path d="M85 120 H172" fill="none" stroke="#17766c" stroke-width="3" marker-end="url(#arrow)"/><text x="160" y="110" fill="#19354f" font-size="20" text-anchor="start">+</text><path d="M226 120 H330" fill="none" stroke="#17766c" stroke-width="3" marker-end="url(#arrow)"/><text x="271" y="106" fill="#19354f" font-size="22" text-anchor="start">e</text><rect x="335" y="87" width="155" height="65" rx="8" fill="white" stroke="#17766c" stroke-width="2"/><text x="412.5" y="115" fill="#19354f" font-size="22" text-anchor="middle">C(s)</text><text x="412.5" y="139" fill="#52677b" font-size="16" text-anchor="middle">控制器</text><path d="M490 120 H565" fill="none" stroke="#17766c" stroke-width="3" marker-end="url(#arrow)"/><rect x="570" y="87" width="155" height="65" rx="8" fill="white" stroke="#17766c" stroke-width="2"/><text x="647.5" y="115" fill="#19354f" font-size="22" text-anchor="middle">P(s)</text><text x="647.5" y="139" fill="#52677b" font-size="16" text-anchor="middle">对象</text><path d="M725 120 H895" fill="none" stroke="#17766c" stroke-width="3" marker-end="url(#arrow)"/><text x="906" y="126" fill="#19354f" font-size="22" text-anchor="start">y</text><circle cx="810" cy="120" r="5" fill="#17766c"/><path d="M810 120 V244 H585" fill="none" stroke="#17766c" stroke-width="3" marker-end="url(#arrow)"/><rect x="425" y="212" width="155" height="65" rx="8" fill="white" stroke="#17766c" stroke-width="2"/><text x="502.5" y="240" fill="#19354f" font-size="22" text-anchor="middle">H(s)</text><text x="502.5" y="264" fill="#52677b" font-size="16" text-anchor="middle">测量 / 反馈</text><path d="M425 244 H200 V148" fill="none" stroke="#17766c" stroke-width="3" marker-end="url(#arrow)"/><text x="213" y="171" fill="#19354f" font-size="24" text-anchor="start">−</text><text x="40" y="309" fill="#52677b" font-size="19" text-anchor="start">负反馈：e = r − Hy；参考到输出 Y/R = CP/(1+CPH)。</text></g>
</svg>
