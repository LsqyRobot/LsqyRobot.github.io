<script>
(function() {
    // 打字机文本数组
    const texts = [
        
            
                "DOTS...",
            
                "CODING...",
            
                "THINKING...",
            
                "CREATING...",
            
                "EXPLORING..."
            
        
    ];

    // 打字机设置
    const settings = {
        typeSpeed: 100,
        deleteSpeed: 50,
        pauseTime: 1500,
        startDelay: 500
    };

    const typewriterElement = document.getElementById('typewriter-text');
    const cursorElement = document.getElementById('cursor');
    let textIndex = 0;
    let charIndex = 0;
    let isDeleting = false;

    function typeWriter() {
        const currentText = texts[textIndex];

        if (!isDeleting) {
            // 打字阶段
            if (charIndex < currentText.length) {
                typewriterElement.innerHTML = currentText.substring(0, charIndex + 1);
                charIndex++;
                setTimeout(typeWriter, settings.typeSpeed);
            } else {
                // 完成打字，等待一段时间后开始删除
                setTimeout(() => {
                    isDeleting = true;
                    typeWriter();
                }, settings.pauseTime);
            }
        } else {
            // 删除阶段
            if (charIndex > 0) {
                typewriterElement.innerHTML = currentText.substring(0, charIndex - 1);
                charIndex--;
                setTimeout(typeWriter, settings.deleteSpeed);
            } else {
                // 完成删除，切换到下一个文本
                isDeleting = false;
                textIndex = (textIndex + 1) % texts.length;
                setTimeout(typeWriter, 200); // 切换文本的间隔
            }
        }
    }

    // 页面加载完成后开始打字效果
    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(typeWriter, settings.startDelay);
    });
})();
</script>

            <script>
                (function () {
                    function renderMermaidBlocks() {
                        var blocks = Array.from(document.querySelectorAll(
                            '.post-article-content pre > code.language-mermaid, .post-article-content pre > code.lang-mermaid'
                        ));

                        if (!blocks.length) {
                            return;
                        }

                        blocks.forEach(function (code, index) {
                            if (code.dataset.mermaidPrepared === 'true') {
                                return;
                            }

                            var pre = code.parentElement;
                            if (!pre) {
                                return;
                            }

                            code.dataset.mermaidPrepared = 'true';
                            var diagram = document.createElement('div');
                            diagram.className = 'mermaid post-mermaid-diagram';
                            diagram.id = 'post-mermaid-diagram-' + index;
                            diagram.textContent = code.textContent.trim();
                            pre.replaceWith(diagram);
                        });

                        function startRender() {
                            if (!window.mermaid) {
                                return;
                            }

                            window.mermaid.initialize({
                                startOnLoad: false,
                                theme: 'default',
                                securityLevel: 'strict',
                                flowchart: {
                                    useMaxWidth: true,
                                    htmlLabels: true
                                }
                            });

                            window.mermaid.run({
                                querySelector: '.post-mermaid-diagram'
                            }).catch(function (error) {
                                console.error('Mermaid render failed:', error);
                            });
                        }

                        if (window.mermaid) {
                            startRender();
                            return;
                        }

                        var script = document.createElement('script');
                        script.src = 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
                        script.defer = true;
                        script.onload = startRender;
                        document.head.appendChild(script);
                    }

                    if (document.readyState === 'loading') {
                        document.addEventListener('DOMContentLoaded', renderMermaidBlocks);
                    } else {
                        renderMermaidBlocks();
                    }
                })();
            </script>

            <script>
                document.addEventListener('DOMContentLoaded', function () {
                    var contentRoot = document.querySelector('.post-article-content');
                    var tocNav = document.querySelector('.post-toc-nav');
                    var backToTopButton = document.querySelector('.post-toc-top-button');
                    var slugCounts = {};
                    var makeHeadingId = function (text) {
                        var base = (text || '')
                            .trim()
                            .replace(/\s+/g, '-')
                            .replace(/[!"#$%&'()*+,./:;<=>?@[\\\]^`{|}~]/g, '');

                        if (!base) {
                            base = 'section';
                        }

                        if (slugCounts[base] == null) {
                            slugCounts[base] = 0;
                        } else {
                            slugCounts[base] += 1;
                        }

                        return slugCounts[base] ? base + '-' + slugCounts[base] : base;
                    };

                    if (contentRoot) {
                        contentRoot.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(function (heading) {
                            if (!heading.id) {
                                heading.id = makeHeadingId(heading.textContent);
                            }
                        });
                    }

                    var headings = Array.from(
                        document.querySelectorAll('.post-article-content h1[id], .post-article-content h2[id], .post-article-content h3[id], .post-article-content h4[id], .post-article-content h5[id], .post-article-content h6[id]')
                    );
                    var images = Array.from(document.querySelectorAll('.typo img'));

                    document.querySelectorAll('.typo a[href^="#"]:not(.headerlink)').forEach(function (link) {
                        var href = link.getAttribute('href');
                        if (!href || href === '#') {
                            return;
                        }

                        var targetId = decodeURIComponent(href.slice(1));
                        if (targetId && document.getElementById(targetId)) {
                            return;
                        }

                        var linkText = link.textContent.trim();
                        if (!linkText) {
                            return;
                        }

                        var matchedHeading = headings.find(function (heading) {
                            return heading.textContent.trim() === linkText;
                        });

                        if (matchedHeading && matchedHeading.id) {
                            link.setAttribute('href', '#' + matchedHeading.id);
                        }
                    });

                    if (tocNav && contentRoot) {
                        var tocHeadings = headings.filter(function (heading) {
                            var level = parseInt(heading.tagName.slice(1), 10);
                            return heading.id && level >= 1 && level <= 3;
                        });

                        if (!tocHeadings.length) {
                            var tocSidebar = document.querySelector('.post-toc-sidebar');
                            if (tocSidebar) {
                                tocSidebar.style.display = 'none';
                            }
                        } else {
                            var tocList = document.createElement('ul');
                            tocList.className = 'post-toc-list';
                            var baseTocLevel = Math.min.apply(null, tocHeadings.map(function (heading) {
                                return parseInt(heading.tagName.slice(1), 10);
                            }));

                            tocHeadings.forEach(function (heading) {
                                var item = document.createElement('li');
                                var level = parseInt(heading.tagName.slice(1), 10);
                                item.className = 'post-toc-item level-' + level;
                                item.setAttribute('data-depth', String(level - baseTocLevel));

                                var anchor = document.createElement('a');
                                anchor.className = 'post-toc-link';
                                anchor.href = '#' + heading.id;
                                anchor.textContent = heading.textContent.trim();
                                anchor.setAttribute('data-target-id', heading.id);

                                item.appendChild(anchor);
                                tocList.appendChild(item);
                            });

                            tocNav.appendChild(tocList);

                            var tocSidebar = document.querySelector('.post-toc-sidebar');
                            var tocPanel = tocSidebar.querySelector('.post-toc-card');
                            tocSidebar.hidden = false;
                            document.querySelector('.post-content-shell').classList.add('has-post-toc');
                            document.getElementById('main').classList.add('has-post-toc');
                            document.getElementById('wrapper').classList.add('has-post-toc');

                            // TOC responsive disclosure: keep this breakpoint in sync with post-toc.css.
                            var tocWideQuery = window.matchMedia('(min-width: 1180px)');
                            var syncTocDisclosure = function () {
                                tocPanel.open = tocWideQuery.matches;
                            };
                            syncTocDisclosure();
                            if (tocWideQuery.addEventListener) {
                                tocWideQuery.addEventListener('change', syncTocDisclosure);
                            } else {
                                tocWideQuery.addListener(syncTocDisclosure);
                            }

                            var sidebarTocLinks = Array.from(document.querySelectorAll('.post-toc-link'));
                            var activeTocLink = null;
                            var activeHeadingId = '';

                            var getScrollY = function () {
                                return window.scrollY || window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
                            };

                            var keepActiveLinkInView = function (link) {
                                if (!link || !tocNav) {
                                    return;
                                }

                                if (!tocPanel.open) {
                                    return;
                                }

                                var navRect = tocNav.getBoundingClientRect();
                                var linkRect = link.getBoundingClientRect();

                                if (linkRect.top < navRect.top || linkRect.bottom > navRect.bottom) {
                                    tocNav.scrollTop += linkRect.top - navRect.top - (navRect.height / 2) + (linkRect.height / 2);
                                }
                            };

                            var updateActiveLink = function (currentId) {
                                if (!currentId || currentId === activeHeadingId) {
                                    return;
                                }

                                activeHeadingId = currentId;
                                activeTocLink = null;

                                sidebarTocLinks.forEach(function (link) {
                                    var isActive = link.getAttribute('data-target-id') === currentId;
                                    link.classList.toggle('is-active', isActive);
                                    link.setAttribute('aria-current', isActive ? 'true' : 'false');
                                    if (isActive) {
                                        activeTocLink = link;
                                    }
                                });

                                keepActiveLinkInView(activeTocLink);
                            };

                            var ticking = false;
                            var syncActiveHeading = function () {
                                if (!tocHeadings.length) {
                                    return;
                                }

                                var scrollTop = getScrollY();
                                var marker = scrollTop + Math.min(window.innerHeight * 0.28, 220);
                                var currentId = tocHeadings[0].id;
                                var pageBottom = scrollTop + window.innerHeight;
                                var documentBottom = Math.max(
                                    document.body.scrollHeight,
                                    document.documentElement.scrollHeight
                                );

                                if (pageBottom >= documentBottom - 4) {
                                    updateActiveLink(tocHeadings[tocHeadings.length - 1].id);
                                    return;
                                }

                                for (var i = 0; i < tocHeadings.length; i += 1) {
                                    var headingTop = tocHeadings[i].getBoundingClientRect().top + scrollTop;
                                    if (headingTop <= marker) {
                                        currentId = tocHeadings[i].id;
                                    } else {
                                        break;
                                    }
                                }

                                updateActiveLink(currentId);
                            };

                            var handleScroll = function () {
                                if (ticking) {
                                    return;
                                }

                                ticking = true;
                                window.requestAnimationFrame(function () {
                                    syncActiveHeading();
                                    ticking = false;
                                });
                            };

                            var scheduleResync = function () {
                                handleScroll();
                                window.setTimeout(handleScroll, 80);
                                window.setTimeout(handleScroll, 240);
                                window.setTimeout(handleScroll, 600);
                            };

                            sidebarTocLinks.forEach(function (link) {
                                link.setAttribute('aria-current', 'false');
                                link.addEventListener('click', function () {
                                    var targetId = link.getAttribute('data-target-id');
                                    updateActiveLink(targetId);
                                    if (!tocWideQuery.matches) {
                                        tocPanel.open = false;
                                    }
                                    scheduleResync();
                                });
                            });

                            tocPanel.addEventListener('toggle', function () {
                                if (tocPanel.open) {
                                    keepActiveLinkInView(activeTocLink);
                                }
                            });

                            window.addEventListener('scroll', handleScroll, { passive: true });
                            window.addEventListener('resize', scheduleResync, { passive: true });
                            window.addEventListener('load', scheduleResync, { passive: true });
                            window.addEventListener('hashchange', scheduleResync, { passive: true });
                            document.addEventListener('scroll', handleScroll, { passive: true, capture: true });

                            if ('ResizeObserver' in window) {
                                var articleResizeObserver = new ResizeObserver(scheduleResync);
                                articleResizeObserver.observe(contentRoot);
                            }

                            images.forEach(function (img) {
                                img.addEventListener('load', scheduleResync, { passive: true });
                            });

                            scheduleResync();
                        }
                    }

                    if (backToTopButton) {
                        backToTopButton.addEventListener('click', function () {
                            window.scrollTo({
                                top: 0,
                                behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'
                            });
                        });
                    }

                    // Right floating tag sphere is initialized by the standalone script near its markup.
                    // Keep it separate from article TOC logic so one feature cannot break the other.

                    if (contentRoot) {
                        var firstElement = contentRoot.firstElementChild;
                        if (firstElement && /^(UL|OL)$/.test(firstElement.tagName)) {
                            var inlineTocLinks = Array.from(firstElement.querySelectorAll('a[href^="#"]'));
                            var totalLinks = firstElement.querySelectorAll('a').length;
                            if (inlineTocLinks.length > 0 && inlineTocLinks.length === totalLinks) {
                                firstElement.classList.add('post-inline-toc');
                            }
                        }
                    }

                    images.forEach(function (img) {
                        // Preserve picture's source selection and native lazy loading.
                        // CSS background copies would eagerly load/decode GIFs again.
                        if (img.closest('.post-image-frame, picture') ||
                            img.getAttribute('loading') === 'lazy' ||
                            /\.gif(?:[?#]|$)/i.test(img.currentSrc || img.getAttribute('src') || '')) {
                            return;
                        }

                        var src = img.getAttribute('src');
                        if (!src) {
                            return;
                        }

                        var frame = document.createElement('div');
                        frame.className = 'post-image-frame';
                        frame.style.setProperty('--post-image-url', 'url("' + src.replace(/"/g, '\\"') + '")');

                        var blur = document.createElement('div');
                        blur.className = 'post-image-blur';

                        var main = document.createElement('div');
                        main.className = 'post-image-main';

                        img.parentNode.insertBefore(frame, img);
                        frame.appendChild(blur);
                        frame.appendChild(main);
                        main.appendChild(img);
                    });
                });
            </script>
